ws\"></tbody></table></div>\n    <div class=\"score-card\"><div><strong>역량 자동 환산</strong><div class=\"behavior\" id=\"levelMapping\">설정 불러오는 중…</div></div><div class=\"score-values\"><div class=\"score-value\"><span>평균 Level</span><strong id=\"averageLevel\">-</strong></div><div class=\"score-value\"><span>100점 환산</span><strong id=\"competencyScore\">-</strong></div></div></div>\n  </section>\n\n  <section class=\"panel final-appraisal\" id=\"finalAppraisal\" style=\"display:none\">\n    <div class=\"section-head\"><span class=\"section-no\">F</span><h2>최종 연간평가서</h2></div>\n    <div class=\"result-highlight\"><div class=\"summary-grid\"><div class=\"summary-item\"><span>H1 점수 / 등급</span><strong id=\"finalH1\">-</strong></div><div class=\"summary-item\"><span>H2 점수</span><strong id=\"finalH2\">-</strong></div><div class=\"summary-item\"><span>역량 점수</span><strong id=\"finalCompetency\">-</strong></div><div class=\"summary-item\"><span>최종 점수 / 등급</span><strong id=\"finalScoreGrade\">-</strong></div></div></div>\n    <div class=\"phase-columns detail-section\"><div class=\"phase-box\"><h3>상반기</h3><div class=\"field\"><label>팀 목표</label><div class=\"readonly long\" id=\"finalH1Goal\"></div></div><div class=\"field\"><label>자기 Review</label><div class=\"readonly long\" id=\"finalH1Review\"></div></div><div class=\"field\"><label>결과 의견</label><div class=\"readonly long\" id=\"finalH1Comment\"></div></div></div><div class=\"phase-box\"><h3>하반기</h3><div class=\"field\"><label>팀 목표</label><div class=\"readonly long\" id=\"finalH2Goal\"></div></div><div class=\"field\"><label>자기 Review</label><div class=\"readonly long\" id=\"finalH2Review\"></div></div><div class=\"field\"><label>최종 의견</label><div class=\"readonly long\" id=\"finalComment\"></div></div></div></div>\n    <div class=\"detail-section\"><h3>연간 자기평가</h3><div class=\"grid two\"><div class=\"field\"><label>강점</label><div class=\"readonly long\" id=\"finalStrengths\"></div></div><div class=\"field\"><label>개선 필요 사항</ .';byId('competencyLock').textContent=EDITABLE_PHASE==='H2'?'H2 OPEN · 모든 역량 Level을 선택해 주세요.':'읽기 전용 · 역량 입력은 H2에서만 활성화됩니다.';}\nfunction renderFinal(a){var panel=byId('finalAppraisal');if(!a){panel.style.display='none';return;}panel.style.display='';text('finalH1',a.h1.score+' / '+a.h1.grade);text('finalH2',a.h2.score);text('finalCompetency',a.competencyScore);text('finalScoreGrade',a.finalScore+' / '+a.finalGrade);text('finalH1Goal',a.h1.teamGoal);text('finalH1Review',a.h1.review);text('finalH1Comment',a.h1.comment);text('finalH2Goal',a.h2.teamGoal);text('finalH2Review',a.h2.review);text('finalComment',a.finalComment);text('finalStrengths',a.annualNarrative.strengths);text('finalImprovements',a.annualNarrative.improvements);text('finalGoals',a.annualNarrative.goals);text('finalSummary',a.annualNarrative.selfSummary);text('finalH1Contribution',a.contributions.h1);text('finalH2Contribution',a.contributions.h2);text('finalCompetencyContribution',a.contributions.competency);text('finalReleasedAt',a.releasedAt);var body=byId('finalCompetencies');body.textContent='';(a.competencies||[]).forEach(function(c){var tr=document.createElement('tr');[c.name,c.level,c.comment||'-'].forEach(function(v){var td=document.createElement('td');td.textContent=String(v);tr.appendChild(td);});body.appendChild(tr);});}\nfunction renderPeriods(periods,selected){var select=byId('periodSelect');select.textContent='';(periods||[]).forEach(function(period){var option=document.createElement('option');option.value=period;option.textContent=period;select.appendChild(option);});if((periods||[]).indexOf(selected)===-1){var option=document.createElement('option');option.value=selected;option.textContent=selected;select.appendChild(option);}select.value=selected;}\nfunction svgEl(t,a){var n=document.createElementNS('http://www.w3.org/2000/svg',t);Object.keys(a).forEach(function(k){n.setAttribute(k,a[k]);});return n;}\nfunction renderTrend(trend){var panel=byId('trendPanel');if(!trend||!trend.length){pa "pv-sort\"><option value=\"step\">진행 낮은 순</option><option value=\"-step\">진행 높은 순</option><option value=\"name\">이름순</option><option value=\"team\">팀순</option></select>\n  </div>\n  <div class=\"table-scroll\"><table><thead><tr><th>이름</th><th>사번</th><th>본부</th><th>팀</th><th>단계</th><th style=\"min-width:180px\">진행률</th></tr></thead><tbody id=\"pv-rows\"></tbody></table></div>\n</section>\n<section class=\"panel\" id=\"pv-cal-panel\" style=\"display:none\">\n  <div class=\"section-head\"><h2>평가자 캘리브레이션 (관대화·엄격화 경고)</h2></div>\n  <p class=\"sub\" id=\"pv-cal-sub\"></p>\n  <div class=\"table-scroll\"><table><thead><tr><th>1차 평가자</th><th>팀</th><th>평가 인원</th><th>평균</th><th>표준편차</th><th>전체 평균 대비</th><th>경고</th></tr></thead><tbody id=\"pv-cal\"></tbody></table></div>\n</section>\n<script>\n'use strict';\nvar PROGRESS = (function () {\n  var $ = UI.byId, el = UI.el, DATA = null, ROLE = { HR: '전사 (인사 관리자)', CEO: '전사 (대표)', DIVISION_HEAD: '내 본부', TEAM_LEAD: '내 팀', SENIOR: '내 직속 인원', SELF: '본인', NONE: '조회 권한 없음' };\n  function unitCard(u, filterKey) {\n    var c = el('div', 'unit'); c.appendChild(el('h4', '', u.label)); c.appendChild(UI.stepBadge(Math.max(0, u.step), u.status));\n    c.appendChild(UI.bar(u.percent, u.step >= 6 ? 'ok' : (u.step <= 1 ? 'warn' : '')));\n    var meta = el('div', 'meta'); meta.appendChild(el('span', '', u.size + '명 · 확정 ' + u.completed)); meta.appendChild(el('span', '', u.percent + '%')); c.appendChild(meta);\n    c.addEventListener('click', function () { $(filterKey).value = u.label; renderRows(); $('pv-rows').scrollIntoView({ behavior: 'smooth' }); });\n    return c;\n  }\n  function fillSelect(id, values, first) { var s = $(id), cur = s.value; s.textContent = ''; var o = el('option', '', first); o.value = ''; s.appendChild(o); values.forEach(function (v) { var op = el('option', '', v); op.value = v; s.appendChild(op); }); s.value = values.indexOf(cur) >= 0 ? cur : ''; }\n  function render(d) {\n    DATA = d; if (!$('pv-period').value) $('pv-period').value = d.period;\n    var label = $('scopeLabel'); if (label) label.textContent = (ROLE[d.role] || d.role) + ' · ' + d.period + ' ' + d.phase + ' · 대상 ' + d.summary.total + '명';\n    $('pv-stamp').textContent = new Date(d.generatedAt).toLocaleTimeString() + ' 기준';\n    var cyc = d.phase === 'H1' ? d.cycles.h1 : d.cycles.h2, dd = $('pv-dday'); dd.textContent = '';\n    if (cyc) { dd.appendChild(el('span', 'badge ' + (cyc.status === 'OPEN' ? 's1' : 's6'), d.phase + ' ' + cyc.status)); var x = UI.dday(cyc.daysLeft); if (x) { dd.appendChild(document.createTextNode(' ')); dd.appendChild(x); } }\n    var s = d.summary, k = $('pv-kpis'); k.textContent = '';\n    k.appendChild(UI.kpi('전체 진행률', s.overallPercent + '%', '8단계 가중 평균', s.overallPercent));\n    k.appendChild(UI.kpi('제출률', s.submitRate + '%', '직원 회신', s.submitRate));\n    k.appendChild(UI.kpi('1차 평가', s.firstEvalRate + '%', '팀장 점수 입력', s.firstEvalRate));\n    k.appendChild(UI.kpi('2차 조정', s.secondEvalRate + '%', '본부장 확인', s.secondEvalRate));\n    k.appendChild(UI.kpi('결재(대표 의뢰)', s.approvalRate + '%', '본부 의뢰 완료', s.approvalRate));\n    k.appendChild(UI.kpi('확정률', s.completeRate + '%', '대표 확정', s.completeRate));\n    k.appendChild(UI.kpi('결과 안내', s.notifiedRate + '%', '인사팀 통보', s.notifiedRate));\n    var f = $('pv-funnel'); f.textContent = ''; s.steps.forEach(function (st, i) { var b = el('div'); b.appendChild(el('b', '', st.count)); b.appendChild(UI.stepBadge(i, st.label)); f.appendChild(b); });\n    var dv = $('pv-divisions'), tm = $('pv-teams'); dv.textContent = ''; tm.textContent = '';\n    d.divisions.forEach(function (u) { dv.appendChild(unitCard(u, 'pv-f-div')); }); d.teams.forEach(function (u) { tm.appendChild(unitCard(u, 'pv-f-team')); });\n    $('pv-units-panel').style.display = d.members.length > 1 ? '' : 'none';\n    fillSelect('pv-f-div', d.divisions.map(function (u) { return u.label; }), '전체 본부');\n    fillSelect('pv-f-team', d.teams.map(function (u) { return u.label; }), '전체 팀');\n    fillSelect(  = el('a', l[0] === active ? 'active' : '', l[1]); a.href = '?view=' + l[0]; host.appendChild(a); });\n      var who = byId('who'); if (who) { who.textContent = (r.name || '') + (r.testActingAs ? ' · TEST: ' + r.testActingAs : ''); }\n    }).catch(function () {});\n  }\n  function autoRefresh(fn, seconds) {\n    var timer = null, s = seconds || 60;\n    function tick() { if (document.visibilityState === 'visible') { fn(); } }\n    timer = setInterval(tick, s * 1000);\n    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { fn(); } });\n    return function () { clearInterval(timer); };\n  }\n  return { byId: byId, el: el, present: present, val: val, err: err, toast: toast, call: call, bar: bar, stepBadge: stepBadge,\n    stepper: stepper, chain: chain, dday: dday, kpi: kpi, tabs: tabs, download: download, nav: nav, autoRefresh: autoRefresh, STEPS: STEPS };\n})();\n<\/script>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"app-bar\"><div><h1>평가대상자 명단 관리</h1><p class=\"sub\">성명·사번·이메일주소(필수)와 결재 라인을 등록합니다. Google Sheet의 Roster 탭과 동일한 데이터입니다.</p></div><span class=\"who\" id=\"who\"></span></header>\n  <nav class=\"nav-pills\" id=\"nav\"></nav>\n\n  <div class=\"tabs\" id=\"rtabs\"><button class=\"active\" data-tab=\"pane-list\">명단</button><button data-tab=\"pane-edit\">등록 · 수정</button><button data-tab=\"pane-bulk\">엑셀/CSV 일괄등록</button></div>\n\n  <section class=\"panel tab-pane active\" id=\"pane-list\">\n    <div class=\"kpis\" id=\"rk\"></div>\n    <div class=\"filters\"><input type=\"text\" id=\"q\" placeholder=\"이름·사번·이메일·팀 검색\"><label class=\"chk\"><input type=\"checkbox\" id=\"onlyIssues\"> 결재 라인 문제만</label><button class=\"btn ghost sm\" id=\"reload\">새로고침</button></div>\n    <div class=\"table-scroll\"><table><thead><tr><th>성명</th><th>사번</th><th>이메일</th><th>본부 / 팀 / 직급</th><th>상위직급자 → 팀장 → 본부장</th><th>역할</th><th>상태</th><th></th></tr></thead><tbody id=\"rows\"></tbody></table></div>\n  </section>\n\n  <section class=\"panel tab-pane\" id=\"pane-edit\">\n    <p class=\"sub\">이메일이 이미 있으면 수정, 없으면 신규 등록됩니다. 역할 플래그(대표·감사·인사·마스터)는 마스터만 변경할 수 있습니다.</p>\n    <div class=\"grid\">\n      <div class=\"field\"><label for=\"f-name\">성명 <span class=\"required\">*</span></label><input type=\"text\" id=\"f-name\"></div>\n      <div class=\"field\"><label for=\"f-no\">사번 <span class=\"required\">*</span></label><input type=\"text\" id=\"f-no\"></div>\n      <div class=\"field\"><label for=\"f-email\">이메일주소 <span class=\"required\">*</span></label><input type=\"text\" id=\"f-email\"></div>\n      <div class=\"field\"><label for=\"f-rank\">직급</label><input type=\"text\" id=\"f-rank\"></div>\n      <div class=\"field\"><label for=\"f-div\">본부</label><input type=\"text\" id=\"f-div\"></div>\n      <div class=\"field\"><label for=\"f-team\">팀</label><input type=\"text\" id=\"f-team\"></div>\n      <div class=\"field\"><label for=\"f-a1\">상위직급자 이메일 (선택)</label><input type=\"text\" id=\"f-a1\"></div>\n      <div class=\"field\"><label for=\"f-a2\">팀장(1차 평가자) 이메일</label><input type=\"text\" id=\"f-a2\"></div>\n      <div class=\"field\"><label for=\"f-a3\">본부장(2차 평가자) 이메일</label><input type=\"text\" id=\"f-a3\"></div>\n      <div class=\"field\"><label for=\"f-g1\">상반기 팀 목표</label><input type=\"text\" id=\"f-g1\"></div>\n      <div class=\"field\"><label for=\"f-g2\">하반기 팀 목표</label><input type=\"text\" id=\"f-g2\"></div>\n    </div>\n    <div class=\"button-row\" id=\"flagRow\">\n      <label class=\"chk\"><input type=\"checkbox\" id=\"f-ceo\"> 대표</label>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"f-aud\"> 감사 (평가·결재 제외)</label>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"f-hr\"> 인사 관리자</label>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"f-master\"> 마스터</label>\n      <span class=\"sub\" id=\"flagHint\" style=\"margin:0\"></span>\n    </div>\n    <div class=\"button-row detail-section\"><button class=\"btn\" id=\"save\">저장</button><button class=\"btn ghost\" id=\"clear\">새로 입력</button><button class=\"btn danger\" id=\"del\" style=\"display:none\">삭제</button><span class=\"msg\" id=\"msg\"></span></div>\n  </section>\n\n  <section class=\"panel tab-pane\" id=\"pane-bulk\">\n    <p class=\"sub\">엑셀에서 <b>CSV UTF-8</b>로 저장한 파일을 올리거나 표를 복사해 붙여넣으세요(탭 구분도 가능). 필수 열: <b>성명(이름), 사번, 이메일주소</b>. 선택 열: 팀, 직급, 본부, 상위직급자, 팀장, 본부장(각 이메일), 상반기팀목표, 하반기팀목표. 전체 검증을 통과해야만 한 번에 반영됩니다(부분 반영 없음).</p>\n    <div class=\"button-row\"><input type=\"file\" id=\"file\" accept=\".csv,.txt,text/csv\"><button class=\"btn ghost sm\" id=\"sample\">양식 내려받기</button></div>\n    <textarea id=\"csv\" class=\"large\" placeholder=\"성명,사번,이메일주소,팀,직급,본부,팀장,본부장&#10;홍길동,E1001,hong@company.com,개발팀,사원,기술본부,lead@company.com,head@company.com\"></textarea>\n    <div class=\"button-row detail-section\"><button class=\"btn ghost\" id=\"dry\">검증만 하기</button><button class=\"btn\" id=\"import\">일괄 등록</button></div>\n    <div id=\"report\"></div>\n  </section>\n</div>\n<script>\n'use strict';\nvar $ = UI.byId, el = UI.el, DATA = null;\nvar F = { name: '이름', no: '사번', email: 'email', rank: '직급', div: '본부', team: '팀', a1: 'approver1Email', a2: 'approver2Email', a3: 'approver3Email', g1: '상반기팀목표', g2: '하반기팀목표' };\nfunction roles(e) { return [e.isCeo ? '대표' : '', e.isAuditor ? '감사' : '', e.isHrAdmin ? '인사' : '', e.isMaster ? '마스터' : ''].filter(String); }\nfunction render() {\n  var list = DATA.entries, q = $('q').value.trim().toLowerCase(), only = $('onlyIssues').checked;\n  var targets = list.filter(function (e) { return e.evaluationTarget; }), issues = list.filter(function (e) { return (e.chainIssues || []).some(function (i) { return i.indexOf('상위직급자') !== 0; }); });\n  var k = $('rk'); k.textContent = '';\n  k.appendChild(UI.kpi('등록 인원', list.length + '명')); k.appendChild(UI.kpi('평가 대상', targets.length + '명', '감사 ' + (list.length - targets.length) + '명 제외'));\n  k.appendChild(UI.kpi('결재 라인 문제', issues.length + '명', '팀장·본부장·대표 미지정 등')); k.appendChild(UI.kpi('내 권한', DATA.isMaster ? '마스터' : '인사 관리자'));\n  var body = $('rows'); body.textContent = '';\n  list.filter(function (e) { var hay = [e['이름'], e['사번'], e.email, e['팀'], e['본부']].join(' ').toLowerCase(); return (!q || hay.indexOf(q) >= 0) && (!only || issues.indexOf(e) >= 0); }).forEach(function (e) {\n    var tr = el('tr'); [e['이름'], e['사번'], e.email, [e['본부'], e['팀'], e['직급']].filter(String).join(' / '), [e.approver1Email || '-', e.approver2Email || '-', e.approver3Email || '-'].join(' → ')].forEach(function (v) { tr.appendChild(el('td', '', UI.val(v))); });\n    var r = el('td'); roles(e).forEach(function (x) { r.appendChild(el('span', 'badge ' + (x === '감사' ? 's0' : 's2'), x)); }); tr.appendChild(r);\n    var st = el('td'), bad = (e.chainIssues || []).filter(function (i) { return i.indexOf('상위직급자') !== 0; });\n    st.appendChild(!e.evaluationTarget ? el('span', 'badge s0', '평가 제외') : bad.length ? el('span', 'badge err', bad.join(', ')) : el('span', 'badge s6', '정상')); tr.appendChild(st);\n    var a = el('td'), b = el('button', 'link', '수정'); b.addEventListener('click', function () { edit(e); }); a.appendChild(b); tr.appendChild(a); body.appendChild(tr);\n  });\n}\nfunction load() { UI.call('listRoster').then(function (d) { DATA = d; ['f-ceo', 'f-aud', 'f-hr', 'f-master'].forEach(function (id) { $(id).disabled = !d.isMaster; }); $('flagHint').textContent = d.isMaster ? '' : '역할 플래그는 마스터만 변경할 수 있습니다.'; render(); }).catch(function (e) { UI.toast(UI.err(e), true); }); }\nfunction show(tab) { Array.prototype.forEach.call($('rtabs').querySelectorAll('button'), function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); }); Array.prototype.forEach.call(document.querySelectorAll('.tab-pane'), function (p) { p.classList.toggle('active', p.id === tab); }); }\nfunction edit(e) { show('pane-edit'); Object.keys(F).forEach(function (k) { $('f-' + k).value = e[F[k]] || ''; }); $('f-ceo').checked = !!e.isCeo; $('f-aud').checked = !!e.isAuditor; $('f-hr').checked = !!e.isHrAdmin; $('f-master').checked = !!e.isMaster; $('del').style.display = ''; $('f-email').disabled = true; }\nfunction clearForm() { Object.keys(F).forEach(function (k) { $('f-' + k).value = ''; }); ['f-ceo', 'f-aud', 'f-hr', 'f-master'].forEach(function (id) { $(id).checked = false; }); $('del').style.display = 'none'; $('f-email').disabled = false; $('msg').textContent = ''; }\nfunction input() { var o = {}; Object.keys(F).forEach(function (k) { o[F[k]] = $('f-' + k).value; }); if (DATA && DATA.isMaster) { o.isCeo = $('f-ceo').checked; o.isAuditor = $('f-aud').checked; o.isHrAdmin = $('f-hr').checked; o.isMaster = $('f-master').checked; } return o; }\nfunction report(r) { var box = $('report'); box.textContent = ''; box.appendChild(el('div', 'badge ' + (r.ok ? 's6' : 'err'), (r.ok ? (r.dryRun ? '검증 통과' : '반영 완료') : '반영 안 됨') + ' · 신규 ' + r.created + ' · 수정 ' + r.updated)); if (r.errors && r.errors.length) { var ul = el('ul'); r.errors.forEach(function (x) { ul.appendChild(el('li', 'flag', x)); }); box.appendChild(ul); } }\n$('save').addEventListener('click', function () { UI.call('upsertRosterEntry', input()).then(function (r) { if (!r.ok) { $('msg').className = 'msg err'; $('msg').textContent = r.errors.join(' / '); return; } UI.toast(r.created ? '등록했습니다.' : '수정했습니다.'); clearForm(); load(); show('pane-list'); }).catch(function (e) { UI.toast(UI.err(e), true); }); });\n$('del').addEventListener('click', function () { var email = $('f-email').value; if (!confirm(email + ' 을(를) 명단에서 삭제합니다. 결재 진행 중이거나 다른 사람의 결재자이면 서버가 거부합니다.')) return; UI.call('deleteRosterEntry', email).then(function () { UI.toast('삭제했습니다.'); clearForm(); load(); show('pane-list'); }).catch(function (e) { UI.toast(UI.err(e), true); }); });\n$('clear').addEventListener('click', clearForm);\n$('file').addEventListener('change', function () { var f = this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { $('csv').value = rd.result; }; rd.readAsText(f, 'utf-8'); });\n$( FINAL) 기준표가 하나만 존재하며 수정할 수 없습니다. 오기입 등으로 변경이 필요하면 <b>마스터</b>가 사유를 남기고 확정취소할 수 있지만, 그 해 평가 시즌(운영)이 한 번이라도 생성된 뒤에는 불가능합니다. 모든 확정·확정취소는 감사 로그에 기록됩니다.</p>\n    </section>\n\n    <section class=\"panel\">\n      <h2>새 DRAFT 만들기</h2>\n      <div class=\"settings-grid\">\n        <div class=\"field\"><label for=\"targetPeriod\">대상 연도</label><input type=\"number\" id=\"targetPeriod\" min=\"2000\" max=\"9999\" value=\"2026\"></div>\n        <div class=\"field\"><label for=\"cloneSource\">복제할 기존 FINAL (선택)</label><select id=\"cloneSource\"><option value=\"\">기본값으로 시작</option></select></div>\n        <div class=\"field\"><label>&nbsp;</label><button class=\"btn\" id=\"createDraft\">새 DRAFT 만들기</button></div>\n      </div>\n      <p class=\"sub\">이전 FINAL을 선택하면 계산 내용을 대상 연도로 복제하고, 새 버전 번호와 ID는 서버가 부여합니다.</p>\n    </section>\n\n    <section class=\"panel\">\n      <h2>버전 목록</h2>\n      <div class=\"table-scroll\"><table><thead><tr><th>연도</th><th>버전</th><th>상태</th><th>최종 수정</th><th>확정</th><th></th></tr></thead><tbody id=\"versionRows\"><tr><td colspan=\"6\" class=\"spinner\">불러오는 중…</td></tr></tbody></table></div>\n    </section>\n\n    <section class=\"panel\" id=\"editor\" style=\"display:none\">\n      <div class=\"section-head\"><span class=\"section-no\">S</span><h2>선택한 버전</h2></div>\n      <div class=\"summary-grid\">\n        <div class=\"summary-item\"><span>연도</span><strong id=\"s-period\">-</strong></div>\n        <div class=\"summary-item\"><span>버전 / 상태</span><strong id=\"s-version\">-</strong></div>\n        <div class=\"summary-item\"><span>생성</span><strong id=\"s-created\">-</strong></div>\n        <div class=\"summary-item\"><span>최종 수정 / 확정</span><strong id=\"s-audit\">-</strong></div>\n      </div>\n      <div id=\"immutableNotice\" class=\"notice\" style=\"display:none;margin-top:14px\">FINAL은 애플리케이션에서 수정할 수 없습니다. 변경하려면 이 FINAL을 복제해 새 버전을 만드세요.</div>\n\n      <div class=\"detail-section\"><h3>가중치 (%)</h3>\n        <div class=\"settings-grid\">\n          <div class=\"field\"><label for=\"h1Weight\">상반기 업적</label><input class=\"setting-input\" type=\"number\" id=\"h1Weight\" min=\"0\" max=\"100\" step=\"0.1\"></div>\n          <div class=\"field\"><label for=\"h2Weight\">하반기 업적</label><input class=\"setting-input\" type=\"number\" id=\"h2Weight\" min=\"0\" max=\"100\" step=\"0.1\"></div>\n          <div class=\"field\"><label for=\"competencyWeight\">역량</label><input class=\"setting-input\" type=\"number\" id=\"competencyWeight\" min=\"0\" max=\"100\" step=\"0.1\"></div>\n        </div>\n        <div class=\"status-banner\">합계: <strong id=\"weightTotal\">-</strong>% <span id=\"weightValidation\"></span></div>\n      </div>\n\n      <div class=\"detail-section\"><h3>Level 점수 매핑</h3><div class=\"settings-grid\" id=\"levelInputs\"></div></div>\n\n      <div class=\"detail-section\"><h3>계산 및 반올림</h3>\n        <div class=\"settings-grid\">\n          <div class=\"field\"><label for=\"calculationMethod\">계산 방식</label><select class=\"setting-input\" id=\"calculationMethod\"><option value=\"WEIGHTED_SUM\">가중 합계 후 최종값만 반올림</option><option value=\"ROUND_COMPONENTS_THEN_SUM\">각 가중 기여도를 반올림한 뒤 합산·최종 반올림</option></select></div>\n          <div class=\"field\"><label for=\"roundingMode\">반올림 방식</label><select class=\"setting-input\" id=\"roundingMode\"><option value=\"HALF_UP\">사사오입 (HALF_UP)</option><option value=\"FLOOR\">버림 (FLOOR)</option><option value=\"CEIL\">올림 (CEIL)</option></select></div>\n          <div class=\"field\"><label for=\"decimalPlaces\">소수 자릿수</label><select class=\"setting-input\" id=\"decimalPlaces\"><option value=\"0\">0</option><option value=\"1\">1</option><option value=\"2\">2</option></select></div>\n        </div>\n      </div>\n\n      <div class=\"detail-section\"><h3>1차 등급 구간 (환산등급 · 2차 ±1 조정 체계)</h3><p class=\"sub\">1차 평가자의 0~100 점수(상반기·하반기 업적)에 적용합니다. 2차 평가자의 ±1등급 조정은 이 표의 순서 안에서만 이동하고, 등급 비율 상한도 이 표의 등급에 적용됩니다. 기본값: S≥95 · A≥90 · B+≥85 · B≥80 · C≥70 · D≥60 · F</p><div id=\"thresholdRows\"></div><button class=\"link\" id=\"addThreshold\">등급 행 추가</button></div>\n\n      <div class=\"detail-section\"><h3>최종 종합등급 구간 (연간 종합점수)</h3><p class=\"sub\">상반기 업적·하반기 업적·역량을 가중 합산한 연간 종합점수에 적용합니다. 기본값: S≥95 · A≥90 · B≥80 · C+(보통)≥70 · D≥60 · F</p><div id=\"legacyBandsNotice\" class=\"notice\" style=\"display:none\">이 기준표는 구간 분리 이전에 확정되어 1차·최종 공용 단일 구간표를 사용합니다. 이미 확정된 결과를 그대로 재현하기 위해 변경되지 않으며, 다음 연도에 복제하면 이 표는 1차용이 되고 최종용은 기본값으로 생성됩니다.</div><div id=\"finalBandRows\"></div><button class=\"link\" id=\"addFinalBand\">등급 행 추가</button></div>\n      <p class=\"sub\">공통 규칙: 위에서부터 점수 ≥ 최저점을 적용합니다. 등급명은 중복 없이 안전한 문자(영문·숫자·한글·+·-·_)만, 최저점은 엄격히 내림차순, 마지막 행은 0이어야 합니다. 두 표는 기준표 확정 시 함께 잠깁니다.</p>\n\n      <div class=\"detail-section\"><h3>등급 비율 상한 (선택)</h3><p class=\"sub\">예: S 10%, A 20%. 2차 평가자의 <b>상향 조정</b>으로 평가 그룹 내 상한을 넘기려 하면 서버가 차단하고, 점수로 산출된 등급이 상한을 넘으면 대시보드에서 경고합니다. 비워 두면 제한이 없습니다.</p><div id=\"capRows\"></div><button class=\"link\" id=\"addCap\">상한 행 추가</button></div>\n\n      <div class=\"detail-section\"><h3>실시간 예시</h3><div class=\"muted-box\">1차 점수 85 → 환산등급 <strong id=\"previewRound1\">-</strong> · H1=85, H2=90, 역량=80 → <span id=\"previewContributions\">-</span> · 종합 <strong id=\"previewFinal\">-</strong> · 최종 종합등급 <strong id=\"previewGrade\">-</strong></div></div>\n\n      <div class=\"button-row detail-section\"><button class=\"btn\" id=\"saveDraft\">DRAFT 저장</button><button class=\"btn danger\" id=\"finalizeDraft\">기준표 확정 (연도 잠금)</button><button class=\"btn ghost\" id=\"unfinalize\" style=\"display:none\">확정취소 (마스터)</button><span class=\"msg\" id=\"msg\" aria-live=\"polite\"></span></div>\n      <div class=\"notice detail-section\">방어 심층화를 위해 Google Sheet에서도 FINAL 행 범위를 보호하세요. 직접 수정하지 말고 모든 변경은 새 버전으로 진행해야 합니다.</div>\n    </section>\n  </div>\n<script>\n'use strict';\nvar ALL=[], CURRENT=null;\nfunction byId(id){return document.getElementById(id);}\nfunction setMsg(text,cls){var el=byId('msg');el.textContent=text||'';el.className='msg'+(cls?' '+cls:'');}\nfunction raw(id){return byId(id).value;}\nfunction roundValue(value,mode,places){var factor=Math.pow(10,places),scaled=Number((value*factor).toPrecision(15));if(mode==='FLOOR')return Math.floor(scaled)/factor;if(mode==='CEIL')return Math.ceil(scaled)/factor;return Math.floor(scaled+.5)/factor;}\nfunction thresholdsFromDom(id){return Array.prototype.map.call(byId(id||'thresholdRows').children,function(row){return{grade:row.querySelector('.threshold-grade').value.trim(),min:row.querySelector('.threshold-min').value};});}\nfunction capsFromDom(){return Array.prototype.map.call(byId('capRows').children,function(row){return{grade:row.querySelector('.cap-grade').value.trim(),maxPercent:row.querySelector('.cap-max').value};}).filter(function(c){return c.grade||String(c.maxPercent).trim();});}\nfunction addCapRow(item){var row=document.createElement('div');row.className='threshold-row';var g=document.createElement('div');g.className='field';var gl=document.createElement('label');gl.textContent='등급';var gi=document.createElement('input');gi.type='text';gi.className='setting-input cap-grade';gi.value=item&&item.grade||'';g.appendChild(gl);g.appendChild(gi);var m=document.createElement('div');m.className='field';var ml=document.createElement('label');ml.textContent='최대 비율(%)';var mi=document.createElement('input');mi.type='number';mi.min='0';mi.max='100';mi.step='0.1';mi.className='setting-input cap-max';mi.value=item&&item.maxPercent!==undefined?item.maxPercent:'';m.appendChild(ml);m.appendChild(mi);var rm=document.createElement('button');rm.type='button';rm.className='link remove-threshold';rm.textContent='삭제';rm.addEventListener('click',function(){row.remove();});row.appendChild(g);row.appendChild(m);row.appendChild(rm);byId('capRows').appendChild(row);}\nvar LOCK=null;\nfunction loadLocks(){UI.call('getCriteriaLockStatus').then(function(r){LOCK=r;var box=byId('lockCards');box.textContent='';if(!r.years.length){box.appendChild(UI.el('div','empty','아직 기준표가 없습니다. 올해 DRAFT를 만들어 시작하세요.'));}r.years.forEach(function(y){var c=UI.el('div','unit');c.appendChild(UI.el('h4','',y.period+'년 기준표'));c.appendChild(UI.el('span','badge '+(y.locked?'s6':'s5'),y.locked?'확정·잠금 v'+y.finalVersion:'미확정 (DRAFT '+y.drafts+'개)'));var meta=UI.el('div','meta');meta.appendChild(UI.el('span','',y.seasonStarted?'시즌 운영됨':'시즌 전'));meta.appendChild(UI.el('span','',y.locked?String(y.finalizedAt).slice(0,10):''));c.appendChild(meta);if(String(y.period)===r.currentYear&&!y.locked){c.appendChild(UI.el('div','flag','올해 기준표를 확정해야 평가 시즌을 열 수 있습니다.'));}box.appendChild(c);});if(CURRENT)openSettings(CURRENT);}).catch(function(e){byId('lockCards').textContent=UI.err(e);});}\nfunction unfinalize(){if(!CURRENT)return;var reason=prompt(CURRENT.period+' v'+CURRENT.version+' 기준표 확정을 취소합니다. 사유를 입력하세요 (감사 로그 기록).');if(!reason)return;UI.call('unfinalizeEvaluationSettings',CURRENT.settingsId,reason).then(function(){UI.toast('확정취소되어 DRAFT로 되돌렸습니다.');load(CURRENT.settingsId);loadLocks();}).catch(function(e){UI.toast(UI.err(e),true);});}\nfunction payload(){var r1=thresholdsFromDom('thresholdRows');return{gradeRatioCaps:capsFromDom(),gradeThresholds:r1,gradeBandsRound1:r1,gradeBandsFinal:thresholdsFromDom('finalBandRows'),h1Weight:raw('h1Weight'),h2Weight:raw('h2Weight'),competencyWeight:raw('competencyWeight'),level1Points:raw('level1Points'),level2Points:raw('level2Points'),level3Points:raw('level3Points'),level4Points:raw('level4Points'),level5Points:raw('level5Points'),calculationMethod:byId('calculationMethod').value,roundingMode:byId('roundingMode').value,decimalPlaces:raw('decimalPlaces')};}\nfunction bandErrors(list,label){var errors=[],labels={};if(!list.length)errors.push(label+': 등급 기준이 필요합니다.');list.forEach(function(t,i){if(!/^[0-9A-Za-z가-힣][0-9A-Za-z가-힣_+\\-]{0,19}$/.test(t.grade))errors.push(label+' '+(i+1)+'행 등급명이 올바르지 않습니다.');if(labels[t.grade.toUpperCase()])errors.push(label+': 등급명이 중복됩니다.');labels[t.grade.toUpperCase()]=true;var minText=String(t.min==null?'':t.min).trim(),min=Number(minText);i /**
 * Roster.gs
 * ---------------------------------------------------------------------------
 * Data-access + pure parsing/lookup logic for the Roster tab.
 *
 * The roster is the single source of truth for identity: every employee is a
 * row keyed by lowercased `email`. This module resolves columns by HEADER NAME
 * (never fixed index) so the HR team may reorder columns safely, and factors
 * the pure parsing/lookup logic (parseRosterValues_, buildRosterIndex_,
 * resolveApproverChainFromEntry_) so it can be unit-tested with mocked rows and
 * no Google runtime.

 * ---------------------------------------------------------------------------

/**
 * Normalize an email for use as the roster key: trim + lowercase. Non-strings
 * and blanks become ''.
 *
 * @param {*} email Raw email value.
 * @return {string} Normalized email (lowercased) or ''.
 */
function normalizeEmail_(email) {
  if (email === null || email === undefined) {
    return '';
  }
  return String(email).trim().toLowerCase();
}

/**
 * Parse a raw Roster tab 2D array (row 0 = headers) into an array of roster
 * entry objects. PURE: no Google globals, unit-testable with mocked rows.
 *
 * Each entry has normalized `email` plus the display/approver fields. Rows with
 * a blank email are skipped (they cannot be an auth key). Duplicate emails: the
 * first row wins (documented uniqueness rule).
 *
 * @param {Array<Array<*>>} values 2D array from getDataRange().getValues().
 * @return {Array<!Object>} Parsed roster entries.
 */
function parseRosterValues_(values) {
  var entries = [];
  if (!values || values.length < 2) {
    return entries;
  }
  var cols = resolveColumns_(values[0]);
  var C = ROSTER_COLUMNS;
  var idxEmail = requireColumn_(cols, C.EMAIL, TAB_NAMES.ROSTER);
  var idxNumber = requireColumn_(cols, C.EMPLOYEE_NUMBER, TAB_NAMES.ROSTER);
  var idxName = requireColumn_(cols, C.NAME, TAB_NAMES.ROSTER);
  var idxTeam = requireColumn_(cols, C.TEAM, TAB_NAMES.ROSTER);
  var idxRank = requireColumn_(cols, C.RANK, TAB_NAMES.ROSTER);
  // Team-goal columns are optional for backwards-compatible reads. Missing or
  // blank values are represented as an empty string and rendered with a clear
  // fallback in the employee UI.
  var idxH1Goal = Object.prototype.hasOwnProperty.call(cols, C.H1_TEAM_GOAL)
    ? cols[C.H1_TEAM_GOAL] : -1;
  var idxH2Goal = Object.prototype.hasOwnProperty.call(cols, C.H2_TEAM_GOAL)
    ? cols[C.H2_TEAM_GOAL] : -1;
  var idxDivision = Object.prototype.hasOwnProperty.call(cols, C.DIVISION) ? cols[C.DIVISION] : -1;
  var idxMaster = Object.prototype.hasOwnProperty.call(cols, C.IS_MASTER) ? cols[C.IS_MASTER] : -1;
  var idxA1 = requireColumn_(cols, C.APPROVER1_EMAIL, TAB_NAMES.ROSTER);
  var idxA2 = requireColumn_(cols, C.APPROVER2_EMAIL, TAB_NAMES.ROSTER);
  var idxA3 = requireColumn_(cols, C.APPROVER3_EMAIL, TAB_NAMES.ROSTER);
  var idxAuditor = requireColumn_(cols, C.IS_AUDITOR, TAB_NAMES.ROSTER);
  var idxCeo = requireColumn_(cols, C.IS_CEO, TAB_NAMES.ROSTER);
  var idxHr = requireColumn_(cols, C.IS_HR_ADMIN, TAB_NAMES.ROSTER);

  var seen = {};
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (!row) {
      continue;
    }
    var email = normalizeEmail_(row[idxEmail]);
    if (!email) {
      continue; // blank email cannot be a key
    }
    if (Object.prototype.hasOwnProperty.call(seen, email)) {
      continue; // first occurrence wins
    }
    seen[email] = true;
    entries.push({
      email: email,
      employeeNumber: row[idxNumber] === undefined ? '' : String(row[idxNumber]),
      name: row[idxName] === undefined ? '' : String(row[idxName]),
      team: row[idxTeam] === undefined ? '' : String(row[idxTeam]),
      rank: row[idxRank] === undefined ? '' : String(row[idxRank]),

/**
 * Resolve an employee's 4-stage approver-email chain from their roster entry
 * plus the company-wide 대표 row. PURE, unit-testable.
 *
 * Order matches WORKFLOW.STAGE_ORDER:
 *   상위직급자 -> 팀장 -> 본부장 -> 대표
 *
 * An isAuditor=TRUE person never approves: if a roster row names the auditor
 * as an approver (or the auditor is also flagged 대표), that stage resolves to
 * '' and fails closed (nobody can act) until HR fixes the roster. The Admin
 * view surfaces such gaps via approverChainIssues_.

 * @param {!Object} entry The employee's roster entry.

    return e && !Object.prototype.hasOwnProperty.call(auditors, e) ? e : '';

  chain[stages.TEAM_LEAD] = entry ? allowed(entry.approver2Email) : '';
  chain[stages.DIVISION_HEAD] = entry ? allowed(entry.approver3Email) : '';
  chain[stages.CEO] = ceo ? allowed(ceo.email) : '';
  return chain;

/**
 * List chain problems for one employee (unset stage or a stage pointing at
 * the excluded auditor). PURE; used for the HR dashboard warnings.
 *
 * @return {Array<string>} Human-readable Korean issue strings.
 */

  var issues = [];
  if (!entry) { return issues; }
  var auditors = auditorEmailSet_(allEntries);
  var raw = {};
  raw[WORKFLOW.STAGES.SENIOR] = entry.approver1Email;
  raw[WORKFLOW.STAGES.TEAM_LEAD] = entry.approver2Email;
  raw[WORKFLOW.STAGES.DIVISION_HEAD] = entry.approver3Email;
  var ceo = findCompanyWideRole_(allEntries, 'isCeo');
  raw[WORKFLOW.STAGES.CEO] = ceo ? ceo.email : '';
  WORKFLOW.STAGE_ORDER.forEach(function (stage) {
    var email = normalizeEmail_(raw[stage]);
    if (!email) {
      issues.push(stage + ' 결재자 미지정');
    } else if (Object.prototype.hasOwnProperty.call(auditors, email)) {
      issues.push(stage + ' 결재자가 감사(평가·결재 제외)로 지정됨');
    }
  });
  return issues;
}

/**
 * Auth.gs
 * ---------------------------------------------------------------------------
 * Server-side identity + authorization. THIS IS THE SECURITY BOUNDARY.
 *
 * Rules (non-negotiable):
 *  - Identity is ALWAYS derived from Session.getActiveUser().getEmail(),
 *    lowercased. Any email / 사번 / identity supplied by the browser is treated
 *    as untrusted DATA and is NEVER used for authorization.
 *  - An employee can access ONLY their own evaluation.
 *  - Authorization decisions are factored into PURE functions taking
 *    (callerEmail, rosterEntry, submission[, stage]) so they are unit-testable

 * when not signed in to the domain.

  var real = normalizeEmail_(Session.getActiveUser().getEmail());
  if (typeof getAppMode_ !== 'function' || getAppMode_() !== 'TEST' || !real) {
    return real; // PROD: the session identity is the only identity.
  }
  // TEST mode only (separate [TEST] spreadsheet): a real HR admin may act as a
  // VIRTUAL @test.local user to click through every role. Real addresses can
  // never be impersonated (resolveTestActAs_ domain fence).
  var requested = PropertiesService.getScriptProperties().getProperty(testActAsKey_(real));
  if (!requested) { return real; }
  var ss = openHrSpreadsheet_();
  if (String(ss.getName()).indexOf('[TEST]') === -1) { return real; }

/**

 * signed in / not on the roster.

 * @return {?Object} The caller's roster entry or null.

 * @return {!Object} The caller's roster entry.

/**

 * This is deliberately strict: an approver or HR admin is NOT the owner and
 * must not pass this check. That guarantees an employee only ever reaches their
 * own evaluation through the ownership path.

 * 대표 row found in `allEntries`. PURE, unit-testable; delegates to

 * @param {string} stage The stage (한글), one of WORKFLOW.STAGE_ORDER.

  // never an approver.

}

/**

 * STAGE. The caller must be the resolved approver email for that stage AND the
 * submission must currently be at that stage.
 *
 * The expected approver email is taken from `approverChain` when supplied,
 * otherwise from the chain the caller pre-resolved and stashed on

 * chain from the roster once and hands it in.
 *

 * @param {?Object} submission The submission ({currentStage, _approverChain?}).
 * @param {string} stage The stage (한글) being acted upon.

  var caller = normalizeEmail_(callerEmail);
  if (!caller || !submission || !stage) {

  if (!chain) {
    return false;
  }

    return false; // approver may only act while the submission is at their stage
  }

/**
 * Decide whether a caller may read the consolidated HR view.
 *
 * @param {?Object} entry The caller's roster entry.
 * @return {boolean} True only for HR admins.
 */
function authorizeHrAdmin(entry) {
  return isHrAdmin(entry);
}

// ===== Workflow.gs =====
/**
 * Workflow.gs
 * ---------------------------------------------------------------------------
 * The fixed company-wide 4-stage approval workflow, modeled as an EXPLICIT
 * state machine of PURE functions:
 *
 *   상위직급자 -> 팀장(1차) -> 본부장(2차) -> 대표 -> COMPLETED
 *   (stage1)   (stage2)    (stage3)      (stage4)
 *
 * The former 감사 stage was removed. A submission still parked at '감사' is
 * decided as 대표 (normalizeWorkflowStage_), keeping old rows workable.
 *
 * DESIGN RULE: this module never touches SpreadsheetApp (or any Google global).
 * It only computes the new {status, currentStage, completedAt} for a decision,
 * so the transition logic is fully unit-testable and the deny/authorization
 * concerns live in Auth.gs. The stage strings and lifecycle states come from
 * the WORKFLOW constants in Config.gs (single source of truth).
 *
 * RETURN policy (per docs/DESIGN.md): a RETURN at any review stage sends the
 * submission back to the EMPLOYEE for revision — status becomes RETURNED and
 * currentStage is cleared. On resubmission (회신) the submission re-enters at
 * 상위직급자, which is handled by the submit path in Evaluations.gs.
 * ---------------------------------------------------------------------------
 */

/**
 * Map a stored stage to the stage that currently owns it. A removed legacy
 * stage (감사) is redirected to its successor (대표) so in-flight submissions
 * from the former 5-stage chain are not stranded. Active stages and unknown
 * values are returned unchanged. PURE.
 *
 * @param {*} stage Stored currentStage value.
 * @return {string} The effective stage.
 */
function normalizeWorkflowStage_(stage) {
  var s = stage === null || stage === undefined ? '' : String(stage).trim();
  var redirects = WORKFLOW.LEGACY_STAGE_REDIRECTS || {};
  return Object.prototype.hasOwnProperty.call(redirects, s) ? redirects[s] : s;
}

/** Whether a stored stage is a removed legacy stage (e.g. 감사). PURE. */
function isLegacyWorkflowStage_(stage) {
  var s = stage === null || stage === undefined ? '' : String(stage).trim();
  return Object.prototype.hasOwnProperty.call(WORKFLOW.LEGACY_STAGE_REDIRECTS || {}, s);
}

/**
 * The next stage after `current` in STAGE_ORDER, or null when `current` is the
 * final stage (대표) or not a recognized stage. PURE, unit-testable.
 *
 * @param {string} current A stage (한글), one of WORKFLOW.STAGE_ORDER.
 * @return {?string} The next stage, or null if `current` is final/unknown.
 */
function nextStage(current) {
  var order = WORKFLOW.STAGE_ORDER;
  var i = order.indexOf(current);
  if (i === -1) {
    return null; // unknown stage
  }
  if (i >= order.length - 1) {
    return null; // 대표 is the last stage; nothing after it
  }
  return order[i + 1];
}

/**
 * Whether a stage is terminal, i.e. the last stage in the chain (대표) after
 * which an APPROVE completes the submission. PURE, unit-testable.
 *
 * @param {string} stage A stage (한글).
 * @return {boolean} True only for the final stage (대표).
 */
function isTerminal(stage) {
  var order = WORKFLOW.STAGE_ORDER;
  return order.length > 0 && stage === order[order.length - 1];
}

/**
 * Apply an approval decision to a submission and return the NEW workflow fields
 * that should be written. PURE: does not mutate `submission`, returns a small
 * patch object { status, currentStage, completedAt }. Callers merge the patch
 * into the row and persist it.
 *
 * APPROVE:
 *   - at a non-final stage: advance currentStage to nextStage, status=IN_REVIEW.
 *   - at the final stage (대표): status=COMPLETED, currentStage cleared (''),
 *     completedAt set to nowIso.
 * RETURN:
 *   - at any review stage: status=RETURNED, currentStage cleared (''). Goes
 *     back to the employee for revision (see module header / DESIGN.md).
 *
 * Throws if the submission is not currently in an actionable review state or if
 * the action / stage is unrecognized, so an out-of-band decision fails loudly.
 *
 * @param {!Object} submission The submission ({status, currentStage, ...}).
 * @param {string} action WORKFLOW.ACTIONS.APPROVE | RETURN.
 * @param {string=} nowIso ISO timestamp used for completedAt on completion.
 * @return {!Object} Patch { status, currentStage, completedAt }.
 */
function applyDecision(submission, action, nowIso) {
  if (!submission) {
    throw new Error('결재 대상 제출물이 없습니다.');
  }
  var STATUS = WORKFLOW.STATUS;
  var ACTIONS = WORKFLOW.ACTIONS;
  // A legacy 감사-parked submission is decided as its redirect stage (대표).
  var stage = normalizeWorkflowStage_(submission.currentStage);

  // Only submissions currently in the chain can be decided on.
  if (submission.status !== STATUS.SUBMITTED &&
      submission.status !== STATUS.IN_REVIEW) {
    throw new Error('결재 가능한 상태가 아닙니다. (상태: ' + submission.status + ')');
  }
  if (WORKFLOW.STAGE_ORDER.indexOf(stage) === -1) {
    throw new Error('유효하지 않은 결재 단계입니다: ' + stage);
  }

  if (action === ACTIONS.APPROVE) {
    if (isTerminal(stage)) {
      return {
        status: STATUS.COMPLETED,
        currentStage: '',
        completedAt: nowIso || new Date().toISOString()
      };
    }
    return {
      status: STATUS.IN_REVIEW,
      currentStage: nextStage(stage),
      completedAt: ''
    };
  }

  if (action === ACTIONS.RETURN) {
    // Return to the employee for revision.
    return {
      status: STATUS.RETURNED,
      currentStage: '',
      completedAt: ''
    };
  }

  throw new Error('알 수 없는 결재 동작입니다: ' + action);
}

// Export for the Node test harness only (skipped on Google's servers).
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    normalizeWorkflowStage_: normalizeWorkflowStage_,
    isLegacyWorkflowStage_: isLegacyWorkflowStage_,
    nextStage: nextStage,
    isTerminal: isTerminal,
    applyDecision: applyDecision
  };
}

    level4Points: 90,

    calculationMethod: EVALUATION_SETTINGS.CALCULATION_METHODS.WEIGHTED_SUM,
    roundingMode: EVALUATION_SETTINGS.ROUNDING_MODES.HALF_UP,
    decimalPlaces: 1,
    // 1차용 bands, best → worst. Also the 2차 ±1 adjustment ladder.
    // `gradeThresholds` is the legacy name of the same table.
    gradeThresholds: copyBands_(DEFAULT_GRADE_BANDS_ROUND1),
    gradeThresholdsJson: '',
    // 최종용 bands for the annual 종합등급 (S, A, B, C+(보통), D).
    gradeBandsFinal: copyBands_(DEFAULT_GRADE_BANDS_FINAL),
    gradeBandsFinalExplicit: true,
    gradeBandsFinalJson: '',
    // 등급 비율 상한 (선택). Empty = no cap. Example:
    // [{ grade: 'S', maxPercent: 10 }, { grade: 'A', maxPercent: 20 }]
    gradeRatioCaps: [],
    gradeRatioCapsJson: '',
    createdAt: '', createdBy: '', updatedAt: '', updatedBy: '',
    finalizedAt: '', finalizedBy: '', settingsHash: ''
  };
  settings.gradeThresholdsJson = JSON.stringify(settings.gradeThresholds);
  settings.gradeBandsRound1 = settings.gradeThresholds;
  settings.gradeBandsFinalJson = JSON.stringify(settings.gradeBandsFinal);
  settings.gradeRatioCapsJson = JSON.stringify(settings.gradeRatioCaps);
  return settings;
}

/**
 * Validate optional 등급 비율 상한. Each grade must exist in the thresholds,
 * appear once, and have maxPercent in 0~100. Blank/'[]' = no caps. PURE.
 */
function canonicalizeGradeRatioCaps_(raw, thresholds) {
  var source = raw;
  if (source === null || source === undefined || source === '') { return []; }
  if (typeof source === 'string') {
    try { source = JSON.parse(source); } catch (e) {
      throw new Error('등급 비율 상한 JSON 형식이 올바르지 않습니다.');
    }
  }
  if (!Array.isArray(source)) { throw new Error('등급 비율 상한은 목록이어야 합니다.'); }
  var grades = (thresholds || []).map(function (t) { return t.grade; });
  var seen = {};
  var out = [];
  source.forEach(function (item, index) {
    var grade = item && item.grade !== undefined ? String(item.grade).trim() : '';
    if (!grade && (item.maxPercent === '' || item.maxPercent === undefined)) { return; }
    if (grades.indexOf(grade) === -1) {
      throw new Error('비율 상한의 등급이 등급 기준에 없습니다: ' + grade + ' (행 ' + (index + 1) + ')');
    }
    if (seen[grade]) { throw new Error('비율 상한 등급이 중복되었습니다: ' + grade); }
    seen[grade] = true;
    out.push({ grade: grade, maxPercent: finiteSettingsNumber_(item.maxPercent, grade + ' 비율 상한(%)', 0, 100) });
  });
  // Keep ladder order for a stable hash.
  out.sort(function (a, b) { return grades.indexOf(a.grade) - grades.indexOf(b.grade); });
  return out;
}

function finiteSettingsNumber_(value, label, min, max) {
  var text = value === null || value === undefined ? '' : String(value).trim();
  if (text === '' || !/^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(text)) {
    throw new Error(label + '은(는) 숫자여야 합니다.');
  }
  var number = Number(text);
  if (!isFinite(number) || number < min || number > max) {
    throw new Error(label + '은(는) ' + min + '~' + max + ' 범위여야 합니다.');
  }
  return number;
}

function canonicalizeGradeThresholds_(raw, label) {
  try {
    return canonicalizeGradeBandsInner_(raw);
  } catch (e) {
    throw new Error((label ? label + ': ' : '') + e.message);
  }
}

function canonicalizeGradeBandsInner_(raw) {
  var source = raw;
  if (typeof source === 'string') {
    try {
      source = JSON.parse(source);
    } catch (e) {
      throw new Error('등급 기준 JSON 형식이 올바르지 않습니다.');
    }
  }
  if (!Array.isArray(source) || source.length === 0) {
    throw new Error('등급 기준은 한 개 이상이어야 합니다.');
  }
  var seen = {};
  var out = source.map(function (item, index) {
    var grade = item && item.grade !== undefined ? String(item.grade).trim() : '';
    if (!/^[0-9A-Za-z가-힣][0-9A-Za-z가-힣_+\-]{0,19}$/.test(grade)) {
      throw new Error('등급명은 1~20자의 안전한 문자만 사용할 수 있습니다. (행 ' + (index + 1) + ')');
    }
    var key = grade.toUpperCase();
    if (Object.prototype.hasOwnProperty.call(seen, key)) {
      throw new Error('등급명은 중복될 수 없습니다: ' + grade);
    }
    seen[key] = true;
    return { grade: grade, min: finiteSettingsNumber_(item.min, '등급 최저점', 0, 100) };
  });
  for (var i = 1; i < out.length; i++) {
    if (!(out[i - 1].min > out[i].min)) {
      throw new Error('등급 최저점은 위에서 아래로 엄격히 감소해야 합니다.');
    }
  }
  if (out[out.length - 1].min !== 0) {
    throw new Error('마지막 등급의 최저점은 정확히 0이어야 합니다.');
  }
  return out;
}

/**
 * Reduce an untrusted settings payload to calculation fields only, validate it,
 * and return a canonical object. IDs, version/status, audit data and hash are
 * deliberately ignored.
 */
function canonicalizeEvaluationSettingsPayload_(payload, trustedPeriod) {
  var src = payload || {};
  var period = String(trustedPeriod || '').trim();
  if (!/^\d{4}$/.test(period)) {
    throw new Error('평가 연도는 4자리 숫자여야 합니다.');
  }
  var out = {
    period: period,
    h1Weight: finiteSettingsNumber_(src.h1Weight, '상반기 가중치', 0, 100),
    h2Weight: finiteSettingsNumber_(src.h2Weight, '하반기 가중치', 0, 100),
    competencyWeight: finiteSettingsNumber_(src.competencyWeight, '역량 가중치', 0, 100),
    level1Points: finiteSettingsNumber_(src.level1Points, 'Level 1 점수', 0, 100),
    level2Points: finiteSettingsNumber_(src.level2Points, 'Level 2 점수', 0, 100),
    level3Points: finiteSettingsNumber_(src.level3Points, 'Level 3 점수', 0, 100),
    level4Points: finiteSettingsNumber_(src.level4Points, 'Level 4 점수', 0, 100),
    level5Points: finiteSettingsNumber_(src.level5Points, 'Level 5 점수', 0, 100),
    calculationMethod: String(src.calculationMethod || ''),
    roundingMode: String(src.roundingMode || ''),
    decimalPlaces: finiteSettingsNumber_(src.decimalPlaces, '소수 자릿수', 0, 2),
    gradeThresholds: canonicalizeGradeThresholds_(
      src.gradeBandsRound1 !== undefined ? src.gradeBandsRound1
        : (src.gradeThresholds !== undefined ? src.gradeThresholds : src.gradeThresholdsJson),
      '1차 등급 구간')
  };
  // 최종용 table. Absent (or explicitly legacy) → legacy single-table mode.
  var finalSource = src.gradeBandsFinal !== undefined ? src.gradeBandsFinal : src.gradeBandsFinalJson;
  var hasFinal = src.gradeBandsFinalExplicit !== false && finalSource !== undefined &&
    finalSource !== null && !(typeof finalSource === 'string' && finalSource.trim() === '');
  out.gradeBandsFinalExplicit = hasFinal;
  out.gradeBandsFinal = hasFinal
    ? canonicalizeGradeThresholds_(finalSource, '최종 등급 구간')
    : copyBands_(out.gradeThresholds);
  var total = out.h1Weight + out.h2Weight + out.competencyWeight;
  if (Math.abs(total - 100) > SETTINGS_NUMBER_TOLERANCE) {
    throw new Error('가중치 합계는 정확히 100이어야 합니다. (현재 ' + total + ')');
  }
  if (out.decimalPlaces % 1 !== 0) {
    throw new Error('소수 자릿수는 0~2 사이의 정수여야 합니다.');
  }
  var methods = EVALUATION_SETTINGS.CALCULATION_METHODS;
  if (out.calculationMethod !== methods.WEIGHTED_SUM &&
      out.calculationMethod !== methods.ROUND_COMPONENTS_THEN_SUM) {
    throw new Error('허용되지 않은 계산 방식입니다.');
  }
  var modes = EVALUATION_SETTINGS.ROUNDING_MODES;
  if (out.roundingMode !== modes.HALF_UP && out.roundingMode !== modes.FLOOR &&
      out.roundingMode !== modes.CEIL) {
    throw new Error('허용되지 않은 반올림 방식입니다.');
  }
  out.gradeThresholdsJson = JSON.stringify(out.gradeThresholds);
  out.gradeBandsRound1 = out.gradeThresholds;
  out.gradeBandsFinalJson = hasFinal ? JSON.stringify(out.gradeBandsFinal) : '';
  out.gradeRatioCaps = canonicalizeGradeRatioCaps_(
    src.gradeRatioCaps !== undefined ? src.gradeRatioCaps : src.gradeRatioCapsJson,
    out.gradeThresholds);
  out.gradeRatioCapsJson = JSON.stringify(out.gradeRatioCaps);
  return out;
}

function calculationContent_(settings) {
  var valid = canonicalizeEvaluationSettingsPayload_(settings, settings.period);
  var content = {
    period: valid.period,
    h1Weight: valid.h1Weight,
    h2Weight: valid.h2Weight,
    competencyWeight: valid.competencyWeight,
    level1Points: valid.level1Points,
    level2Points: valid.level2Points,
    level3Points: valid.level3Points,
    level4Points: valid.level4Points,
    level5Points: valid.level5Points,
    calculationMethod: valid.calculationMethod,
    roundingMode: valid.roundingMode,
    decimalPlaces: valid.decimalPlaces,
    gradeThresholds: valid.gradeThresholds
  };
  // Added only when present so every pre-existing FINAL hash stays valid.
  if (valid.gradeRatioCaps.length) { content.gradeRatioCaps = valid.gradeRatioCaps; }
  if (valid.gradeBandsFinalExplicit) { content.gradeBandsFinal = valid.gradeBandsFinal; }
  return content;
}

function canonicalCalculationJson_(settings) {
  return JSON.stringify(calculationContent_(settings));
}

/* Deterministic SHA-256 fallback for local tests where Apps Script Utilities is absent. */
function sha256Fallback_(text) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var maxWord = Math.pow(2, 32);
  var words = [];
  var ascii = unescape(encodeURIComponent(String(text)));
  var bitLength = ascii.length * 8;
  var hash = [], k = [], primeCounter = 0;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var multiple = candidate * candidate; multiple < 313; multiple += candidate) {
        isComposite[multiple] = candidate;
      }
      hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 !== 56) { ascii += '\x00'; }
  for (var i = 0; i < ascii.length; i++) {
    words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
  }
  words[words.length] = Math.floor(bitLength / maxWord);
  words[words.length] = bitLength;
  for (var j = 0; j < words.length; j += 16) {
    var w = words.slice(j, j + 16);
    var oldHash = hash.slice(0);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = (hash[7] +
        (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
        ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = i < 16 ? w[i] : (
          w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
          w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0)) | 0;
      var temp2 = ((rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
        ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]))) | 0;
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
      hash.length = 8;
    }
    for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
  }
  var result = '';
  for (i = 0; i < 8; i++) {
    for (j = 3; j >= 0; j--) {
      var byte = (hash[i] >> (j * 8)) & 255;
      result += (byte < 16 ? '0' : '') + byte.toString(16);
    }
  }
  return result;
}

function calculateSettingsHash_(settings) {
  var content = canonicalCalculationJson_(settings);
  if (typeof Utilities !== 'undefined' && Utilities.computeDigest &&
      Utilities.DigestAlgorithm && Utilities.DigestAlgorithm.SHA_256) {
    var bytes = Utilities.computeDigest(
      Utilities.DigestAlgorithm.SHA_256, content,
      Utilities.Charset ? Utilities.Charset.UTF_8 : undefined);
    return bytes.map(function (b) {
      var value = b < 0 ? b + 256 : b;
      return (value < 16 ? '0' : '') + value.toString(16);
    }).join('');
  }
  return sha256Fallback_(content);
}

function roundWithSettings_(value, settings) {
  var number = Number(value);
  if (!isFinite(number)) { throw new Error('계산할 점수가 올바르지 않습니다.'); }
  var factor = Math.pow(10, Number(settings.decimalPlaces));
  // Normalize only binary representation noise after scaling. Fifteen
  // significant digits preserves real configured boundaries (for example
  // 89.9999999995) while making decimal values such as 1.005 and 0.1+0.2
  // behave according to the declared decimal rounding mode.
  var scaled = Number((number * factor).toPrecision(15));
  var rounded;
  if (settings.roundingMode === EVALUATION_SETTINGS.ROUNDING_MODES.FLOOR) {
    rounded = Math.floor(scaled);
  } else if (settings.roundingMode === EVALUATION_SETTINGS.ROUNDING_MODES.CEIL) {
    rounded = Math.ceil(scaled);
  } else if (settings.roundingMode === EVALUATION_SETTINGS.ROUNDING_MODES.HALF_UP) {
    rounded = Math.floor(scaled + 0.5);
  } else {
    throw new Error('허용되지 않은 반올림 방식입니다.');
  }
  return rounded / factor;
}

function calculateCompetencyWithSettings_(formData, settings) {
  var valid = canonicalizeEvaluationSettingsPayload_(settings, settings.period);
  var source = formData || {};
  var totalLevel = 0;
  var totalPoints = 0;
  COMPETENCY_DEFINITIONS.forEach(function (item) {
    var raw = source[item.level];
    var text = raw === null || raw === undefined ? '' : String(raw).trim();
    if (!/^[1-5]$/.test(text)) {
      throw new Error('역량평가의 모든 Level을 1~5 정수로 선택해 주세요. (항목: ' + item.name + ')');
    }
    var level = Number(text);
    totalLevel += level;
    totalPoints += valid['level' + level + 'Points'];
  });
  return {
    averageLevel: roundWithSettings_(totalLevel / COMPETENCY_DEFINITIONS.length, valid),
    score: roundWithSettings_(totalPoints / COMPETENCY_DEFINITIONS.length, valid)
  };
}

function rawComponentScore_(value, label) {
  return finiteSettingsNumber_(value, label, 0, 100);
}

/** First inclusive band whose min ≤ score, or ''. PURE. */
function gradeForBands_(score, bands) {
  for (var i = 0; i < (bands || []).length; i++) {
    if (score >= bands[i].min) { return bands[i].grade; }
  }
  return '';
}

function calculateFinalResult_(h1Score, h2Score, competencyScore, settings) {
  var valid = canonicalizeEvaluationSettingsPayload_(settings, settings.period);
  var raw = {
    h1: rawComponentScore_(h1Score, '상반기 점수'),
    h2: rawComponentScore_(h2Score, '하반기 점수'),
    competency: rawComponentScore_(competencyScore, '역량 점수')
  };
  var exact = {
    h1: raw.h1 * valid.h1Weight / 100,
    h2: raw.h2 * valid.h2Weight / 100,
    competency: raw.competency * valid.competencyWeight / 100
  };
  var contributions = exact;
  if (valid.calculationMethod ===
      EVALUATION_SETTINGS.CALCULATION_METHODS.ROUND_COMPONENTS_THEN_SUM) {
    contributions = {
      h1: roundWithSettings_(exact.h1, valid),
      h2: roundWithSettings_(exact.h2, valid),
      competency: roundWithSettings_(exact.competency, valid)
    };
  }
  var finalScore = roundWithSettings_(
    contributions.h1 + contributions.h2 + contributions.competency, valid);
  // 최종 종합등급 uses the 최종용 bands (legacy FINAL: the single table).
  var grade = gradeForBands_(finalScore, valid.gradeBandsFinal);
  if (!grade) { throw new Error('최종 점수에 해당하는 등급 기준이 없습니다.'); }
  return { contributions: contributions, finalScore: finalScore, grade: grade };
}

function requireEvaluationSettingsColumns_(headerRow) {
  var columns = resolveColumns_(headerRow || []);
  EVALUATION_SETTINGS_HEADERS.forEach(function (header) {
    requireColumn_(columns, header, TAB_NAMES.EVALUATION_SETTINGS);
  });
  return columns;
}

function parseEvaluationSettingsValues_(values, requireExactHeaders) {
  if (!values || values.length < 1) {
    if (requireExactHeaders) { requireEvaluationSettingsColumns_([]); }
    return [];
  }
  var columns = requireExactHeaders ? requireEvaluationSettingsColumns_(values[0]) : resolveColumns_(values[0]);
  var out = [];
  for (var r = 1; r < values.length; r++) {
    var row = values[r] || [];
    var rec = { _row: r + 1 };
    EVALUATION_SETTINGS_HEADERS.concat(EVALUATION_SETTINGS_OPTIONAL_HEADERS).forEach(function (header) {
      rec[header] = Object.prototype.hasOwnProperty.call(columns, header) &&
        row[columns[header]] !== undefined && row[columns[header]] !== null
        ? row[columns[header]] : '';
    });
    if (String(rec.settingsId).trim()) { out.push(rec); }
  }
  return out;
}

function settingRecordWithCanonicalContent_(record) {
  var valid = canonicalizeEvaluationSettingsPayload_(record, record.period);
  var out = {};
  EVALUATION_SETTINGS_HEADERS.concat(EVALUATION_SETTINGS_OPTIONAL_HEADERS).forEach(function (header) {
    out[header] = record[header] === undefined || record[header] === null ? '' : record[header];
  });
  Object.keys(valid).forEach(function (key) { out[key] = valid[key]; });
  out.gradeThresholdsJson = valid.gradeThresholdsJson;
  return out;
}

function verifyFinalSettings_(record) {
  if (!record || String(record.status) !== EVALUATION_SETTINGS.STATUS.FINAL) {
    throw new Error('확정(FINAL) 평가 설정이 아닙니다.');
  }
  var valid = settingRecordWithCanonicalContent_(record);
  var stored = String(record.settingsHash || '').trim().toLowerCase();
  var calculated = calculateSettingsHash_(valid);
  if (!stored || stored !== calculated) {
    throw new Error('평가 설정 무결성 검증에 실패했습니다. 새 버전을 확인해 주세요.');
  }
  valid.settingsHash = stored;
  valid.version = Number(record.version);
  if (!isFinite(valid.version) || valid.version % 1 !== 0 || valid.version < 1) {
    throw new Error('평가 설정 버전이 올바르지 않습니다.');
  }
  return valid;
}

function canonicalFinalizedSnapshotJson_(settings) {
  var calc = calculationContent_(settings);
  var snapshot = {
    settingsId: String(settings.settingsId), period: String(settings.period),
    version: Number(settings.version), status: EVALUATION_SETTINGS.STATUS.FINAL,
    h1Weight: calc.h1Weight, h2Weight: calc.h2Weight,
    competencyWeight: calc.competencyWeight,
    level1Points: calc.level1Points, level2Points: calc.level2Points,
    level3Points: calc.level3Points, level4Points: calc.level4Points,
    level5Points: calc.level5Points,
    calculationMethod: calc.calculationMethod, roundingMode: calc.roundingMode,
    decimalPlaces: calc.decimalPlaces, gradeThresholds: calc.gradeThresholds
  };
  if (calc.gradeRatioCaps) { snapshot.gradeRatioCaps = calc.gradeRatioCaps; }
  if (calc.gradeBandsFinal) { snapshot.gradeBandsFinal = calc.gradeBandsFinal; }
  return JSON.stringify(snapshot);
}

function finalizedSettingsSnapshotJson_(settings) {
  return canonicalFinalizedSnapshotJson_(verifyFinalSettings_(settings));
}

function settingsFromSubmissionSnapshot_(submission) {
  var C = SUBMISSION_COLUMNS;
  var json = String(submission && submission[C.SETTINGS_SNAPSHOT_JSON] || '').trim();
  if (!json) { throw new Error('제출물에 평가 설정 스냅샷이 없습니다.'); }
  var parsed;
  try { parsed = JSON.parse(json); } catch (e) { throw new Error('평가 설정 스냅샷 JSON이 손상되었습니다.'); }
  if (!parsed || parsed.status !== EVALUATION_SETTINGS.STATUS.FINAL) {
    throw new Error('제출물의 평가 설정 상태가 올바르지 않습니다.');
  }
  if (String(parsed.settingsId) !== String(submission[C.SETTINGS_ID]) ||
      Number(parsed.version) !== Number(submission[C.SETTINGS_VERSION]) ||
      String(parsed.period) !== String(submission[C.PERIOD])) {
    throw new Error('제출물의 평가 설정 식별자가 스냅샷과 일치하지 않습니다.');
  }
  var valid = canonicalizeEvaluationSettingsPayload_(parsed, parsed.period);
  valid.settingsId = String(parsed.settingsId);
  valid.version = Number(parsed.version);
  valid.status = EVALUATION_SETTINGS.STATUS.FINAL;
  if (json !== canonicalFinalizedSnapshotJson_(valid)) {
    throw new Error('제출물의 평가 설정 스냅샷이 표준 형식과 일치하지 않습니다.');
  }
  valid.settingsHash = String(submission[C.SETTINGS_HASH] || '').toLowerCase();
  if (!valid.settingsHash || calculateSettingsHash_(valid) !== valid.settingsHash) {
    throw new Error('제출물의 평가 설정 무결성 검증에 실패했습니다.');
  }
  return valid;
}

function displaySafeSettings_(settings) {
  var valid = canonicalizeEvaluationSettingsPayload_(settings, settings.period);
  return {
    settingsId: settings.settingsId || '', period: valid.period,
    version: Number(settings.version) || 0, status: settings.status || '',
    h1Weight: valid.h1Weight, h2Weight: valid.h2Weight,
    competencyWeight: valid.competencyWeight,
    level1Points: valid.level1Points, level2Points: valid.level2Points,
    level3Points: valid.level3Points, level4Points: valid.level4Points,
    level5Points: valid.level5Points,
    calculationMethod: valid.calculationMethod, roundingMode: valid.roundingMode,
    decimalPlaces: valid.decimalPlaces, gradeThresholds: valid.gradeThresholds,
    gradeBandsRound1: valid.gradeThresholds, gradeBandsFinal: valid.gradeBandsFinal,
    legacySingleBands: !valid.gradeBandsFinalExplicit,
    gradeRatioCaps: valid.gradeRatioCaps
  };
}

/**
 * Read model for the settings editor. A DRAFT still in legacy single-table
 * form is PROMOTED for editing (final = default) — saving persists it. A
 * legacy FINAL is shown as-is with legacySingleBands=true. PURE.
 */
function settingsEditorView_(record) {
  var full = settingRecordWithCanonicalContent_(record);
  full.gradeThresholds = JSON.parse(full.gradeThresholdsJson);
  full.gradeBandsRound1 = full.gradeThresholds;
  full.gradeRatioCaps = JSON.parse(full.gradeRatioCapsJson || '[]');
  full.legacySingleBands = !full.gradeBandsFinalExplicit;
  if (full.legacySingleBands && full.status !== EVALUATION_SETTINGS.STATUS.FINAL) {
    full.gradeBandsFinal = copyBands_(DEFAULT_GRADE_BANDS_FINAL);
    full.legacySingleBands = false;
    full.promotedFinalBands = true;
  }
  delete full._row;
  return full;
}

/** Promote a legacy single-table payload: final bands = default. PURE. */
function promoteFinalBands_(settings, period) {
  var valid = canonicalizeEvaluationSettingsPayload_(settings, period);
  if (valid.gradeBandsFinalExplicit) { return valid; }
  valid.gradeBandsFinal = copyBands_(DEFAULT_GRADE_BANDS_FINAL);
  valid.gradeBandsFinalExplicit = true;
  return canonicalizeEvaluationSettingsPayload_(valid, period);
}

function requireFinalBandsColumn_(headerRow) {
  if (!Object.prototype.hasOwnProperty.call(resolveColumns_(headerRow || []), 'gradeBandsFinalJson')) {
    throw new Error('EvaluationSettings 탭에 "gradeBandsFinalJson" 열이 없어 최종 등급 구간을 저장할 수 없습니다. ' +
      '1행에 해당 헤더를 추가하세요. (docs/SETUP_GUIDE.md §1)');
  }
  return true;
}

function findSettingsById_(records, settingsId) {
  var id = String(settingsId || '');
  for (var i = 0; i < (records || []).length; i++) {
    if (String(records[i].settingsId) === id) { return records[i]; }
  }
  return null;
}

function getSettingsSheet_(spreadsheet) {
  var sheet = spreadsheet.getSheetByName(TAB_NAMES.EVALUATION_SETTINGS);
  if (!sheet) { throw new Error('필수 탭 "' + TAB_NAMES.EVALUATION_SETTINGS + '"이(가) 없습니다.'); }
  return sheet;
}

function getActiveFinalEvaluationSettings_(spreadsheet, period) {
  var records = parseEvaluationSettingsValues_(
    getSettingsSheet_(spreadsheet).getDataRange().getValues(), true);
  var per = String(period || '');
  var best = null;
  records.forEach(function (record) {
    if (String(record.period) === per && record.status === EVALUATION_SETTINGS.STATUS.FINAL &&
        (!best || Number(record.version) > Number(best.version))) {
      best = record;
    }
  });
  if (!best) {
    throw new Error(per + ' 연도 평가기준표가 아직 확정(잠금)되지 않았습니다. ' +
      '인사팀이 [연간 평가기준 설정]에서 기준표를 확정한 뒤 평가 시즌을 열 수 있습니다.');
  }
  return verifyFinalSettings_(best);
}

function listEvaluationSettings(period) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 평가 설정을 조회할 수 있습니다.'); }
  var per = String(period || '').trim();
  var records = parseEvaluationSettingsValues_(
    getSettingsSheet_(openHrSpreadsheet_()).getDataRange().getValues(), true);
  var list = records.filter(function (record) { return !per || String(record.period) === per; });
  list.sort(function (a, b) {
    return String(b.period).localeCompare(String(a.period)) || Number(b.version) - Number(a.version);
  });
  return { settings: list.map(settingsEditorView_) };
}

function getEvaluationSettings(settingsId) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 평가 설정을 조회할 수 있습니다.'); }
  var records = parseEvaluationSettingsValues_(
    getSettingsSheet_(openHrSpreadsheet_()).getDataRange().getValues(), true);
  var record = findSettingsById_(records, settingsId);
  if (!record) { throw new Error('평가 설정을 찾을 수 없습니다.'); }
  return settingsEditorView_(record);
}

function createEvaluationSettingsDraft(targetPeriod, sourceSettingsId) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 평가 설정을 만들 수 있습니다.'); }
  var period = String(targetPeriod || '').trim();
  if (!/^\d{4}$/.test(period)) { throw new Error('대상 연도는 4자리 숫자여야 합니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var sheet = getSettingsSheet_(openHrSpreadsheet_());
    var values = sheet.getDataRange().getValues();
    requireEvaluationSettingsColumns_(values[0] || []);
    var records = parseEvaluationSettingsValues_(values, true);
    var locked = findFinalForPeriod_(records, period);
    if (locked) {
      throw new Error(period + ' 연도 평가기준표는 이미 확정(잠금)되어 새 버전을 만들 수 없습니다. ' +
        '(v' + locked.version + ') 지난 기준은 히스토리로만 조회할 수 있습니다.');
    }
    var source = defaultEvaluationSettings_(period);
    if (sourceSettingsId) {
      var found = findSettingsById_(records, sourceSettingsId);
      if (!found || found.status !== EVALUATION_SETTINGS.STATUS.FINAL) {
        throw new Error('복제 원본은 기존 확정(FINAL) 버전이어야 합니다.');
      }
      var verifiedSource = verifyFinalSettings_(found);
      // Migration: a legacy single table becomes the 1차 table; the 최종
      // table starts from the default.
      source = promoteFinalBands_(verifiedSource, period);
    }
    requireFinalBandsColumn_(values[0]);
    var maxVersion = 0;
    records.forEach(function (record) {
      if (String(record.period) === period) { maxVersion = Math.max(maxVersion, Number(record.version) || 0); }
    });
    var now = new Date().toISOString();
    var record = settingRecordWithCanonicalContent_(source);
    var newSettingsId = '';
    for (var attempt = 0; attempt < 5; attempt++) {
      newSettingsId = String(Utilities.getUuid());
      if (newSettingsId && !findSettingsById_(records, newSettingsId)) { break; }
      newSettingsId = '';
    }
    if (!newSettingsId) { throw new Error('고유한 평가 설정 ID를 생성하지 못했습니다. 다시 시도하세요.'); }
    record.settingsId = newSettingsId;
    record.period = period;
    record.version = maxVersion + 1;
    record.status = EVALUATION_SETTINGS.STATUS.DRAFT;
    record.createdAt = now; record.createdBy = entry.email;
    record.updatedAt = now; record.updatedBy = entry.email;
    record.finalizedAt = ''; record.finalizedBy = ''; record.settingsHash = '';
    sheet.appendRow(recordToRow_(values[0], record));
    return { ok: true, settings: settingsEditorView_(record) };
  } finally { lock.releaseLock(); }
}

function saveEvaluationSettingsDraft(settingsId, payload) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 평가 설정을 저장할 수 있습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var sheet = getSettingsSheet_(openHrSpreadsheet_());
    var values = sheet.getDataRange().getValues();
    requireEvaluationSettingsColumns_(values[0] || []);
    var record = findSettingsById_(parseEvaluationSettingsValues_(values, true), settingsId);
    if (!record) { throw new Error('평가 설정을 찾을 수 없습니다.'); }
    if (record.status !== EVALUATION_SETTINGS.STATUS.DRAFT) { throw new Error('확정(FINAL) 설정은 수정할 수 없습니다. 새 버전을 만드세요.'); }
    var clean = promoteFinalBands_(payload, record.period);
    requireFinalBandsColumn_(values[0]);
    Object.keys(clean).forEach(function (key) { record[key] = clean[key]; });
    record.gradeThresholdsJson = clean.gradeThresholdsJson;
    record.updatedAt = new Date().toISOString(); record.updatedBy = entry.email;
    record.status = EVALUATION_SETTINGS.STATUS.DRAFT;
    record.settingsHash = ''; record.finalizedAt = ''; record.finalizedBy = '';
    requireRatioCapsColumnIfUsed_(values[0], clean);
    sheet.getRange(record._row, 1, 1, values[0].length).setValues([
      recordToRow_(values[0], record)
    ]);
    return { ok: true, settings: settingsEditorView_(record) };
  } finally { lock.releaseLock(); }
}

function finalizeEvaluationSettingsDraft(settingsId, payload) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 평가 설정을 확정할 수 있습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = getSettingsSheet_(ss);
    var values = sheet.getDataRange().getValues();
    requireEvaluationSettingsColumns_(values[0] || []);
    var records = parseEvaluationSettingsValues_(values, true);
    var record = findSettingsById_(records, settingsId);
    if (!record) { throw new Error('평가 설정을 찾을 수 없습니다.'); }
    if (record.status !== EVALUATION_SETTINGS.STATUS.DRAFT) { throw new Error('DRAFT 설정만 확정할 수 있습니다.'); }
    // Finalization and the visible editor payload are committed atomically
    // under this lock. Server-owned identity/version/status/audit/hash fields in
    // the payload are ignored by canonicalization.
    if (payload) {
      var finalPayload = canonicalizeEvaluationSettingsPayload_(payload, record.period);
      Object.keys(finalPayload).forEach(function (key) { record[key] = finalPayload[key]; });
      record.gradeThresholdsJson = finalPayload.gradeThresholdsJson;
    }
    // Every NEW FINAL carries both tables (legacy drafts are promoted here).
    var promoted = promoteFinalBands_(record, record.period);
    Object.keys(promoted).forEach(function (key) { record[key] = promoted[key]; });
    requireFinalBandsColumn_(values[0]);
    var valid = settingRecordWithCanonicalContent_(record);
    // ANNUAL CRITERIA LOCK: one FINAL per year. A second FINAL is refused;
    // the master must un-finalize the existing one first (only before any
    // season of that year has opened).
    var existingFinal = findFinalForPeriod_(records, record.period);
    if (existingFinal && existingFinal.settingsId !== record.settingsId) {
      throw new Error(record.period + ' 연도 평가기준표가 이미 확정(잠금)되어 있습니다. (v' +
        existingFinal.version + ') 변경이 필요하면 마스터가 확정취소한 뒤 다시 확정하세요.');
    }
    requireRatioCapsColumnIfUsed_(values[0], valid);
    var now = new Date().toISOString();
    Object.keys(valid).forEach(function (key) { record[key] = valid[key]; });
    record.status = EVALUATION_SETTINGS.STATUS.FINAL;
    record.updatedAt = now; record.updatedBy = entry.email;
    record.finalizedAt = now; record.finalizedBy = entry.email;
    record.settingsHash = calculateSettingsHash_(record);
    sheet.getRange(record._row, 1, 1, values[0].length).setValues([
      recordToRow_(values[0], record)
    ]);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email,
      action: AUDIT_ACTIONS.CRITERIA_FINALIZED, targetType: 'EVALUATION_SETTINGS',
      targetId: record.settingsId, period: record.period,
      detail: { version: Number(record.version), settingsHash: record.settingsHash,
        criteria: calculationContent_(record) }, nowIso: now }));
    return { ok: true, settings: settingsEditorView_(record) };
  } finally { lock.releaseLock(); }
}

function findFinalForPeriod_(records, period) {
  var found = null;
  (records || []).forEach(function (item) {
    if (String(item.period) === String(period) && item.status === EVALUATION_SETTINGS.STATUS.FINAL &&
        (!found || Number(item.version) > Number(found.version))) {
      found = item;
    }
  });
  return found;
}

function requireRatioCapsColumnIfUsed_(headerRow, settings) {
  if (settings && settings.gradeRatioCaps && settings.gradeRatioCaps.length) {
    requireColumn_(resolveColumns_(headerRow || []), 'gradeRatioCapsJson', TAB_NAMES.EVALUATION_SETTINGS);
  }
  return true;
}

/**
 * Whether a FINAL may be un-finalized. PURE. Allowed only for the master and
 * only while no cycle of that year exists and no submission of that year
 * exists (i.e. before the season is opened).
 */
function canUnfinalizeCriteria_(callerEntry, record, hasBoundCycle, hasSubmissions) {
  if (!isMaster(callerEntry)) { return { ok: false, reason: '마스터 권한(isMaster + isHrAdmin)이 필요합니다.' }; }
  if (!record || record.status !== EVALUATION_SETTINGS.STATUS.FINAL) {
    return { ok: false, reason: '확정(FINAL) 상태의 기준표만 확정취소할 수 있습니다.' };
  }
  if (hasBoundCycle) { return { ok: false, reason: '해당 연도 평가 시즌이 이미 생성·오픈되어 확정취소할 수 없습니다.' }; }
  if (hasSubmissions) { return { ok: false, reason: '해당 연도 제출물이 있어 확정취소할 수 없습니다.' }; }
  return { ok: true, reason: '' };
}

/** 마스터 확정취소: FINAL → DRAFT (before any season opens), audited. */
function unfinalizeEvaluationSettings(settingsId, reason) {
  var entry = requireCurrentUser_();
  if (!isMaster(entry)) { throw new Error('권한이 없습니다. 마스터만 기준표 확정을 취소할 수 있습니다.'); }
  var why = String(reason || '').trim();
  if (!why) { throw new Error('확정취소 사유를 입력하세요.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = getSettingsSheet_(ss);
    var values = sheet.getDataRange().getValues();
    requireEvaluationSettingsColumns_(values[0] || []);
    var record = findSettingsById_(parseEvaluationSettingsValues_(values, true), settingsId);
    if (!record) { throw new Error('평가 설정을 찾을 수 없습니다.'); }
    var submissions = parseSubmissionValues_(readTabValues_(ss, TAB_NAMES.SUBMISSIONS));
    var check = canUnfinalizeCriteria_(entry, record,
      hasSettingsBoundCycleForPeriod_(ss, record.period),
      submissions.some(function (sub) { return String(sub[SUBMISSION_COLUMNS.PERIOD]) === String(record.period); }));
    if (!check.ok) { throw new Error(check.reason); }
    verifyFinalSettings_(record);
    var now = new Date().toISOString();
    var previousHash = record.settingsHash;
    record.status = EVALUATION_SETTINGS.STATUS.DRAFT;
    record.settingsHash = ''; record.finalizedAt = ''; record.finalizedBy = '';
    record.updatedAt = now; record.updatedBy = entry.email;
    sheet.getRange(record._row, 1, 1, values[0].length).setValues([recordToRow_(values[0], record)]);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email,
      action: AUDIT_ACTIONS.CRITERIA_UNFINALIZED, targetType: 'EVALUATION_SETTINGS',
      targetId: record.settingsId, period: record.period,
      detail: { version: Number(record.version), previousHash: previousHash, reason: why }, nowIso: now }));
    return { ok: true, settingsId: record.settingsId, status: record.status };
  } finally { lock.releaseLock(); }
}

/** Year-by-year lock status for the 연간 평가기준 설정 page. HR-only. */
function getCriteriaLockStatus() {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다.'); }
  var ss = openHrSpreadsheet_();
  var records = parseEvaluationSettingsValues_(getSettingsSheet_(ss).getDataRange().getValues(), true);
  var cycles = readEvaluationCycles_(ss);
  var years = {};
  records.forEach(function (r) { years[String(r.period)] = true; });
  return { isMaster: isMaster(entry), currentYear: String(new Date().getFullYear()),
    years: Object.keys(years).sort().reverse().map(function (year) {
      var fin = findFinalForPeriod_(records, year);
      var bound = cycles.some(function (c) { return String(c.period) === year; });
      return { period: year, locked: !!fin, finalVersion: fin ? Number(fin.version) : null,
        finalizedAt: fin ? fin.finalizedAt : '', finalizedBy: fin ? fin.finalizedBy : '',
        seasonStarted: bound,
        drafts: records.filter(function (r) { return String(r.period) === year &&
          r.status === EVALUATION_SETTINGS.STATUS.DRAFT; }).length };
    }) };
}

  module.exports = {
