// ===== Batch.gs =====
/**
 * Batch.gs
 * ---------------------------------------------------------------------------
 * Team / division BATCH evaluation flow (the company's real process):
 *
 *   employee 회신 → 상위직급자 (individual review, optional)
 *     → 팀장: 1차 평가 for EVERY team member (0~100 + Comment), then
 *             "팀 평가 완료 → 본부장에게 일괄 의뢰" moves the whole team.
 *     → 본부장: 2차 평가 (±1, ≤20% of the division) for every member of every
 *             team, then "본부 평가 완료 → 대표에게 일괄 의뢰".
 *     → 대표: final confirmation per division → COMPLETED → 인사팀.
 *     → 인사팀: 결과 안내 to each employee (H1: notifyH1Results, H2: the
 *             existing confirm + send). Employees see nothing before that.
 *
 *  - Team     = rostered evaluation targets whose approver2Email is the 팀장.
 *  - Division = rostered evaluation targets whose approver3Email is the 본부장.
 *  - 감사 (isAuditor) is never a member and never an evaluator.
 *
 * STATE: every transition is still the per-row state machine of Workflow.gs
 * (applyDecision), so ApprovalLog keeps one row per submission. Team and
 * division statuses are DERIVED from their rows (unitStatus_), never stored,
 * so they cannot drift. Every batch action runs under the script lock,
 * re-reads the Sheet, authorizes the session caller from the roster, verifies
 * each row's cycle/settings binding and refuses the batch if ANY member is not
 * ready. A repeated click finds nothing left to move and returns
 * alreadyForwarded (idempotent).
 * ---------------------------------------------------------------------------
 */

// ---- Pure helpers --------------------------------------------------------

function teamMembers_(entries, teamLeadEmail) {
  var lead = normalizeEmail_(teamLeadEmail);
  if (!lead) { return []; }
  return filterEvaluationTargets_(entries).filter(function (e) {
    return normalizeEmail_(e.approver2Email) === lead;
  });
}

function divisionMembers_(entries, divisionHeadEmail) {
  var head = normalizeEmail_(divisionHeadEmail);
  if (!head) { return []; }
  return filterEvaluationTargets_(entries).filter(function (e) {
    return normalizeEmail_(e.approver3Email) === head;
  });
}

/** email -> phase row (or null). Duplicate logical keys fail closed. PURE. */
function phaseRowsByEmail_(records, members, period, phase) {
  var map = {};
  (members || []).forEach(function (m) {
    map[m.email] = findPhaseSubmission_(records, m.email, period, phase);
  });
  return map;
}

function blockerReason_(sub) {
  var C = SUBMISSION_COLUMNS;
  if (!sub) { return '미제출'; }
  var status = sub[C.STATUS];
  if (status === WORKFLOW.STATUS.RETURNED) { return '반려 후 재회신 대기'; }
  if (status === WORKFLOW.STATUS.DRAFT || !status) { return '미제출(작성 중)'; }
  var stage = normalizeWorkflowStage_(sub[C.CURRENT_STAGE]);
  if (stage === WORKFLOW.STAGES.SENIOR) { return '상위직급자 검토 중'; }
  if (stage === WORKFLOW.STAGES.TEAM_LEAD) { return '1차 평가 점수 미입력'; }
  if (stage === WORKFLOW.STAGES.DIVISION_HEAD) { return '2차 평가 미완료'; }
  return '진행 상태 확인 필요';
}

/**
 * Readiness of a unit for a batch move. `readyStep` is the member step that
 * will move, `doneStep` the first step that counts as already moved. PURE.
 *
 * @return {!Object} { ready, alreadyForwarded, toMove: [sub], blockers: [...] }
 */
function batchReadiness_(members, rowsByEmail, readyStep, doneStep) {
  var toMove = [];
  var blockers = [];
  (members || []).forEach(function (m) {
    var sub = rowsByEmail[m.email] || null;
    var step = memberStep_(sub);
    if (step >= doneStep) { return; }
    if (step === readyStep) { toMove.push(sub); return; }
    blockers.push({ email: m.email, name: m.name, team: m.team, reason: blockerReason_(sub) });
  });
  return {
    ready: blockers.length === 0 && toMove.length > 0,
    alreadyForwarded: blockers.length === 0 && toMove.length === 0 && (members || []).length > 0,
    toMove: toMove,
    blockers: blockers
  };
}

function teamReadiness_(members, rowsByEmail) { return batchReadiness_(members, rowsByEmail, 2, 3); }
function divisionReadiness_(members, rowsByEmail) { return batchReadiness_(members, rowsByEmail, 4, 5); }

/**
 * Pre-forward preview: score stats, grade distribution vs caps, and outliers
 * (missing score, extreme score, |z| ≥ 2 with n ≥ 5). PURE.
 */
function batchPreview_(members, rowsByEmail, settings, scoreField) {
  var C = SUBMISSION_COLUMNS;
  var scores = [];
  var grades = [];
  var items = [];
  (members || []).forEach(function (m) {
    var sub = rowsByEmail[m.email] || null;
    var has = sub && hasFirstEvaluation_(sub) && isValidStoredScore_(sub[scoreField]);
    var score = has ? Number(sub[scoreField]) : null;
    // Distribution/caps are on the 1차 ladder; H2 also carries the 최종 grade.
    if (has) { scores.push(score); grades.push(round1GradeOf_(sub)); }
    items.push({ email: m.email, name: m.name, team: m.team, score: score,
      grade: round1GradeOf_(sub),
      finalGrade: sub && sub[C.PHASE] === EVALUATION_CYCLES.PHASES.H2 ? String(sub[C.CALCULATED_GRADE] || '') : '',
      adjustment: sub ? valueOrBlank_(sub[C.GRADE_ADJUSTMENT]) : '', flags: [] });
  });
  var n = scores.length;
  var mean = n ? scores.reduce(function (a, b) { return a + b; }, 0) / n : 0;
  var sd = n ? Math.sqrt(scores.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / n) : 0;
  items.forEach(function (item) {
    if (item.score === null) { item.flags.push('점수 없음'); return; }
    if (item.score >= 98) { item.flags.push('극단 고득점'); }
    if (item.score < 60) { item.flags.push('극단 저득점'); }
    if (n >= 5 && sd > 0 && Math.abs(item.score - mean) / sd >= 2) { item.flags.push('분포 이탈(|z|≥2)'); }
  });
  var round1 = function (v) { return Math.round(v * 10) / 10; };
  return {
    count: (members || []).length, scored: n,
    mean: round1(mean), stdev: round1(sd),
    min: n ? Math.min.apply(null, scores) : null, max: n ? Math.max.apply(null, scores) : null,
    distribution: settings ? gradeDistribution_(grades, settings) : null,
    items: items,
    outliers: items.filter(function (i) { return i.flags.length; }).length
  };
}

/**
 * Evaluator calibration (관대화/엄격화): each 1차 evaluator's mean score vs the
 * overall mean. |diff| ≥ 5 points with ≥ 3 scored members raises a warning.
 * PURE.
 */
function evaluatorCalibration_(records, period, phase, rosterIndex) {
  var C = SUBMISSION_COLUMNS;
  var field = phase === EVALUATION_CYCLES.PHASES.H1 ? C.H1_SCORE : C.H2_SCORE;
  var by = {};
  var all = [];
  (records || []).forEach(function (rec) {
    if (String(rec[C.PERIOD]) !== String(period) || rec[C.PHASE] !== phase) { return; }
    if (!hasFirstEvaluation_(rec) || !isValidStoredScore_(rec[field])) { return; }
    if (rec[C.STATUS] === WORKFLOW.STATUS.RETURNED) { return; }
    var ev = normalizeEmail_(rec[C.FIRST_EVALUATED_BY]);
    var score = Number(rec[field]);
    (by[ev] = by[ev] || []).push(score);
    all.push(score);
  });
  var overall = all.length ? all.reduce(function (a, b) { return a + b; }, 0) / all.length : 0;
  var out = Object.keys(by).map(function (ev) {
    var list = by[ev];
    var mean = list.reduce(function (a, b) { return a + b; }, 0) / list.length;
    var sd = Math.sqrt(list.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / list.length);
    var diff = mean - overall;
    var bias = '';
    if (list.length >= 3 && diff >= 5) { bias = '관대화 경향'; }
    if (list.length >= 3 && diff <= -5) { bias = '엄격화 경향'; }
    if (list.length >= 3 && sd < 2) { bias = bias ? bias + ' · 중심화' : '중심화 경향(편차 매우 작음)'; }
    var entry = rosterIndex && rosterIndex[ev];
    return { evaluator: ev, name: entry ? entry.name : ev, team: entry ? entry.team : '',
      count: list.length, mean: Math.round(mean * 10) / 10, stdev: Math.round(sd * 10) / 10,
      diff: Math.round(diff * 10) / 10, bias: bias };
  });
  out.sort(function (a, b) { return b.diff - a.diff; });
  return { overallMean: Math.round(overall * 10) / 10, scored: all.length, evaluators: out };
}

/**
 * Role scope for the progress dashboard (server-side filter). PURE.
 *   HR / 대표 → everyone; 본부장 → own division; 팀장 → own team;
 *   상위직급자 → own direct reports; others → only themselves.
 */
function progressScope_(caller, entries) {
  var targets = filterEvaluationTargets_(entries);
  if (!caller) { return { role: 'NONE', members: [] }; }
  if (isHrAdmin(caller)) { return { role: 'HR', members: targets }; }
  if (isCeo(caller) && !isAuditor(caller)) { return { role: 'CEO', members: targets }; }
  if (isAuditor(caller)) { return { role: 'NONE', members: [] }; }
  var division = divisionMembers_(entries, caller.email);
  if (division.length) { return { role: 'DIVISION_HEAD', members: division }; }
  var team = teamMembers_(entries, caller.email);
  if (team.length) { return { role: 'TEAM_LEAD', members: team }; }
  var direct = targets.filter(function (e) { return normalizeEmail_(e.approver1Email) === caller.email; });
  if (direct.length) { return { role: 'SENIOR', members: direct }; }
  return { role: 'SELF', members: targets.filter(function (e) { return e.email === caller.email; }) };
}

/** Group members into units by a key. PURE. */
function groupUnits_(members, rowsByEmail, keyFn, labelFn) {
  var units = {};
  var order = [];
  (members || []).forEach(function (m) {
    var key = keyFn(m);
    if (!units[key]) { units[key] = { key: key, label: labelFn(m), members: [] }; order.push(key); }
    units[key].members.push(m);
  });
  return order.map(function (key) {
    var u = units[key];
    var subs = u.members.map(function (m) { return rowsByEmail[m.email] || null; });
    var status = unitStatus_(subs);
    var done = subs.filter(function (s) { return memberStep_(s) >= 6; }).length;
    return { key: key, label: u.label, size: u.members.length, status: status.label,
      step: status.step, percent: status.percent, completed: done };
  });
}

/**
 * Build the role-scoped progress dashboard payload. PURE.
 * Only name/team/division/progress are exposed for members — no scores,
 * grades or comments — so a scope never leaks evaluation content.
 */
function buildProgressDashboard_(scope, rowsByEmail, entries, rosterIndex) {
  var members = scope.members || [];
  var rows = members.map(function (m) {
    var sub = rowsByEmail[m.email] || null;
    var progress = memberProgress_(sub);
    var lead = rosterIndex[normalizeEmail_(m.approver2Email)];
    var head = rosterIndex[normalizeEmail_(m.approver3Email)];
    return { email: m.email, name: m.name, employeeNumber: m.employeeNumber, team: m.team,
      division: m.division || (head ? head.name + ' 본부' : '-'),
      teamLead: lead ? lead.name : (m.approver2Email || '-'),
      divisionHead: head ? head.name : (m.approver3Email || '-'),
      status: sub ? sub[SUBMISSION_COLUMNS.STATUS] : '',
      step: progress.step, stepLabel: progress.label, percent: progress.percent };
  });
  var n = rows.length || 1;
  var count = function (min) { return rows.filter(function (r) { return r.step >= min; }).length; };
  var summary = {
    total: rows.length,
    submitRate: Math.round(count(1) * 1000 / n) / 10,
    firstEvalRate: Math.round(count(2) * 1000 / n) / 10,
    secondEvalRate: Math.round(count(4) * 1000 / n) / 10,
    approvalRate: Math.round(count(5) * 1000 / n) / 10,
    completeRate: Math.round(count(6) * 1000 / n) / 10,
    notifiedRate: Math.round(count(7) * 1000 / n) / 10,
    overallPercent: rows.length ? Math.round(rows.reduce(function (a, r) { return a + r.percent; }, 0) * 10 / rows.length) / 10 : 0,
    steps: MEMBER_STEPS.map(function (label, i) {
      return { label: label, count: rows.filter(function (r) { return r.step === i; }).length };
    })
  };
  return {
    role: scope.role, summary: summary, members: rows,
    teams: groupUnits_(members, rowsByEmail, function (m) { return normalizeEmail_(m.approver2Email) || '-'; },
      function (m) { var l = rosterIndex[normalizeEmail_(m.approver2Email)]; return m.team + (l ? ' (팀장 ' + l.name + ')' : ''); }),
    divisions: groupUnits_(members, rowsByEmail, function (m) { return normalizeEmail_(m.approver3Email) || '-'; },
      function (m) { var h = rosterIndex[normalizeEmail_(m.approver3Email)]; return m.division || (h ? h.name + ' 본부' : '본부 미지정'); })
  };
}

// ---- Runtime helpers -----------------------------------------------------

function loadBatchContext_(ss) {
  var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
  if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
  var values = sheet.getDataRange().getValues();
  var entries = parseRosterValues_(readTabValues_(ss, TAB_NAMES.ROSTER));
  return { sheet: sheet, values: values, headerRow: values[0] || [],
    records: parseSubmissionValues_(values), entries: entries,
    index: buildRosterIndex_(entries) };
}

function resolveBatchPhase_(ss, period, phase) {
  var per = normalizeEvaluationPeriod_(period || new Date().getFullYear());
  if (phase) { return { period: per, phase: normalizeEvaluationPhase_(phase) }; }
  var open = getSingleOpenEvaluationCycle_(ss, per);
  if (open) { return { period: per, phase: open.phase }; }
  var cycles = readEvaluationCycles_(ss);
  var h2 = findEvaluationCycle_(cycles, per, EVALUATION_CYCLES.PHASES.H2);
  return { period: per, phase: h2 ? EVALUATION_CYCLES.PHASES.H2 : EVALUATION_CYCLES.PHASES.H1 };
}

function writeSubmissionRow_(ctx, sub) {
  ctx.sheet.getRange(sub._row, 1, 1, ctx.headerRow.length).setValues([recordToRow_(ctx.headerRow, sub)]);
}

/**
 * Single mail gateway. In TEST mode mail for a virtual @test.local address is
 * redirected to the real operator (never to an unknown mailbox).
 */
function sendMail_(to, subject, body) {
  var email = normalizeEmail_(to);
  if (typeof isTestEmail_ === 'function' && isTestEmail_(email)) {
    if (getAppMode_() !== 'TEST') { throw new Error('운영 모드에서는 가상 주소로 발송할 수 없습니다: ' + email); }
    var operator = normalizeEmail_(Session.getActiveUser().getEmail());
    MailApp.sendEmail(operator, '[TEST → ' + email + '] ' + subject, body);
    return true;
  }
  MailApp.sendEmail(email, subject, body);
  return true;
}

/** Best-effort notification mail; never undoes a committed state change. */
function notifyByMail_(to, subject, body) {
  var email = normalizeEmail_(to);
  if (!email || typeof MailApp === 'undefined') { return false; }
  try {
    if (MailApp.getRemainingDailyQuota && MailApp.getRemainingDailyQuota() <= 0) { return false; }
    return sendMail_(email, subject, body + '\n\n— 인사평가 시스템 (자동 발송)');
  } catch (e) {
    return false;
  }
}

function hrAdminEmails_(entries) {
  return (entries || []).filter(function (e) { return e.isHrAdmin === true; })
    .map(function (e) { return e.email; });
}

/** Authorize the caller as the approver of `stage` for a row's owner. */
function assertStageEvaluator_(ctx, sub, stage, callerEmail) {
  var C = SUBMISSION_COLUMNS;
  var owner = ctx.index[normalizeEmail_(sub[C.EMPLOYEE_EMAIL])];
  if (!owner || !isEvaluationTarget_(owner)) { throw new Error('평가 대상자가 아닙니다.'); }
  var chain = resolveApproverChainFromEntry_(owner, ctx.entries);
  if (!authorizeApprover(callerEmail, sub, stage, chain)) {
    throw new Error('현재 단계(' + stage + ')의 평가자만 처리할 수 있습니다.');
  }
  return owner;
}

/** Move a list of rows one stage forward with ApprovalLog rows. */
function advanceRows_(ss, ctx, rows, stage, actorEmail, comment, nowIso) {
  rows.forEach(function (sub) {
    verifyPhaseApprovalSubmission_(ss, sub, ctx.records);
    var patch = applyDecision(sub, WORKFLOW.ACTIONS.APPROVE, nowIso);
    sub[SUBMISSION_COLUMNS.STATUS] = patch.status;
    sub[SUBMISSION_COLUMNS.CURRENT_STAGE] = patch.currentStage;
    if (patch.completedAt) { sub[SUBMISSION_COLUMNS.COMPLETED_AT] = patch.completedAt; }
    sub[SUBMISSION_COLUMNS.UPDATED_AT] = nowIso;
    writeSubmissionRow_(ctx, sub);
    appendApprovalLog_(ss, buildApprovalLogRow_({
      submissionId: sub[SUBMISSION_COLUMNS.SUBMISSION_ID], stage: stage,
      approverEmail: actorEmail, action: WORKFLOW.ACTIONS.APPROVE,
      comment: comment, nowIso: nowIso }));
  });
}

function blockerMessage_(prefix, blockers) {
  return prefix + ' 미완료 ' + blockers.length + '명: ' + blockers.map(function (b) {
    return (b.name || b.email) + '(' + b.reason + ')';
  }).join(', ');
}

// ---- Evaluator entry points ---------------------------------------------

/** 1차 평가 save (editable until the team batch is forwarded). */
function saveFirstEvaluation(submissionId, score, comment) {
  var entry = requireCurrentUser_();
  if (isAuditor(entry)) { throw new Error('감사는 평가자에서 제외됩니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var ctx = loadBatchContext_(ss);
    requirePhaseSubmissionColumns_(ctx.headerRow);
    requireEvaluatorColumns_(ctx.headerRow);
    var C = SUBMISSION_COLUMNS;
    var sub = findSubmissionById_(ctx.records, submissionId);
    if (!sub || !String(sub[C.PHASE] || '').trim()) { throw new Error('H1/H2 제출물을 찾을 수 없습니다.'); }
    assertStageEvaluator_(ctx, sub, WORKFLOW.STAGES.TEAM_LEAD, entry.email);
    verifyPhaseApprovalSubmission_(ss, sub, ctx.records);
    var settings = settingsFromSubmissionSnapshot_(sub);
    var h1 = sub[C.PHASE] === EVALUATION_CYCLES.PHASES.H2
      ? findPhaseSubmission_(ctx.records, sub[C.EMPLOYEE_EMAIL], sub[C.PERIOD], EVALUATION_CYCLES.PHASES.H1) : null;
    var now = new Date().toISOString();
    var previous = { score: sub[sub[C.PHASE] === EVALUATION_CYCLES.PHASES.H1 ? C.H1_SCORE : C.H2_SCORE],
      grade: sub[C.FIRST_EVALUATION_GRADE] };
    var result = buildFirstEvaluationPatch_({ submission: sub, settings: settings, score: score,
      comment: comment, evaluatorEmail: entry.email, nowIso: now, h1Submission: h1 });
    Object.keys(result.patch).forEach(function (k) { sub[k] = result.patch[k]; });
    sub[C.UPDATED_AT] = now;
    writeSubmissionRow_(ctx, sub);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email,
      action: AUDIT_ACTIONS.FIRST_EVALUATION, targetType: 'SUBMISSION',
      targetId: sub[C.SUBMISSION_ID], period: sub[C.PERIOD],
      detail: { phase: sub[C.PHASE], employee: sub[C.EMPLOYEE_EMAIL], before: previous,
        after: { score: result.score, grade: result.grade, finalScore: result.finalScore,
          finalGrade: result.finalGrade } },
      nowIso: now }));
    return { ok: true, submissionId: sub[C.SUBMISSION_ID], score: result.score,
      grade: result.grade, finalScore: result.finalScore, finalGrade: result.finalGrade };
  } finally { lock.releaseLock(); }
}

/** 2차 평가 save (±1, quota & ratio caps; editable until division forward). */
function saveSecondEvaluation(submissionId, adjustment, comment) {
  var entry = requireCurrentUser_();
  if (isAuditor(entry)) { throw new Error('감사는 평가자에서 제외됩니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var ctx = loadBatchContext_(ss);
    requirePhaseSubmissionColumns_(ctx.headerRow);
    requireEvaluatorColumns_(ctx.headerRow);
    var C = SUBMISSION_COLUMNS;
    var sub = findSubmissionById_(ctx.records, submissionId);
    if (!sub || !String(sub[C.PHASE] || '').trim()) { throw new Error('H1/H2 제출물을 찾을 수 없습니다.'); }
    assertStageEvaluator_(ctx, sub, WORKFLOW.STAGES.DIVISION_HEAD, entry.email);
    verifyPhaseApprovalSubmission_(ss, sub, ctx.records);
    if (!hasFirstEvaluation_(sub)) {
      throw new Error('1차 평가 기록이 없는 기존 제출물은 2차 조정 대상이 아닙니다. 그대로 대표에게 의뢰할 수 있습니다.');
    }
    var settings = settingsFromSubmissionSnapshot_(sub);
    var quota = adjustmentQuota_(ctx.records, ctx.entries, entry.email, sub[C.PERIOD],
      sub[C.PHASE], sub[C.SUBMISSION_ID]);
    var now = new Date().toISOString();
    var previous = { adjustment: sub[C.GRADE_ADJUSTMENT], grade: round1GradeOf_(sub) };
    var result = buildSecondEvaluationPatch_({ submission: sub, settings: settings,
      adjustment: adjustment, comment: comment, evaluatorEmail: entry.email,
      nowIso: now, quota: quota });
    assertGradeRatioCapForAdjustment_(ctx.records, ctx.entries, entry.email, sub, settings, result);
    Object.keys(result.patch).forEach(function (k) { sub[k] = result.patch[k]; });
    sub[C.UPDATED_AT] = now;
    writeSubmissionRow_(ctx, sub);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email,
      action: AUDIT_ACTIONS.SECOND_EVALUATION, targetType: 'SUBMISSION',
      targetId: sub[C.SUBMISSION_ID], period: sub[C.PERIOD],
      detail: { phase: sub[C.PHASE], employee: sub[C.EMPLOYEE_EMAIL], before: previous,
        after: { adjustment: result.adjustment, baseGrade: result.baseGrade, grade: result.grade } },
      nowIso: now }));
    quota.used += result.adjustment !== 0 ? 1 : 0;
    return { ok: true, submissionId: sub[C.SUBMISSION_ID], baseGrade: result.baseGrade,
      adjustment: result.adjustment, grade: result.grade, quota: quota };
  } finally { lock.releaseLock(); }
}

/** 팀 평가 완료 → 본부장에게 일괄 의뢰. */

/** HR: 상반기 결과 안내 (per row or all eligible rows of the year). */
function notifyH1Results(period, submissionId) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 결과를 안내할 수 있습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var ctx = loadBatchContext_(ss);
    requirePhaseSubmissionColumns_(ctx.headerRow);
    requireEvaluatorColumns_(ctx.headerRow);
    var C = SUBMISSION_COLUMNS;
    var per = normalizeEvaluationPeriod_(period);
    var id = String(submissionId || '').trim();
    var targets = ctx.records.filter(function (s) {
      return String(s[C.PERIOD]) === per && s[C.PHASE] === EVALUATION_CYCLES.PHASES.H1 &&
        (!id || String(s[C.SUBMISSION_ID]) === id);
    });
    var sent = 0;
    var skipped = [];
    targets.forEach(function (s) {
      if (!isEvaluationTarget_(ctx.index[normalizeEmail_(s[C.EMPLOYEE_EMAIL])])) { skipped.push({ id: s[C.SUBMISSION_ID], reason: '평가 대상 아님' }); return; }
      if (hasStoredValue_(s[C.RESULT_NOTIFIED_AT])) { skipped.push({ id: s[C.SUBMISSION_ID], reason: '이미 안내됨' }); return; }
      if (!isFinalizedH1Submission_(s)) { skipped.push({ id: s[C.SUBMISSION_ID], reason: '대표 확정 전' }); return; }
      assertPhaseSubmissionCycleBinding_(ss, s);
      var body = [s[C.NAME_SNAPSHOT] + ' 님 (' + s[C.TEAM_SNAPSHOT] + ' / ' + s[C.RANK_SNAPSHOT] + ')', '',
        per + ' 상반기 업적평가 결과를 안내드립니다.', '',
        '- 상반기 점수: ' + s[C.H1_SCORE], '- 상반기 등급: ' + s[C.CALCULATED_GRADE],
        '- 1차 평가 의견:', String(s[C.RESULT_COMMENT] || ''), '',
        '시스템에서 상세 내용을 확인할 수 있습니다. 문의: 인사팀'].join('\n');
      if (MailApp.getRemainingDailyQuota() <= 0) { skipped.push({ id: s[C.SUBMISSION_ID], reason: '메일 한도 초과' }); return; }
      sendMail_(normalizeEmail_(s[C.EMPLOYEE_EMAIL]), '[인사평가 결과] ' + per + ' 상반기 결과 안내', body);
      var now = new Date().toISOString();
      s[C.RESULT_NOTIFIED_AT] = now;
      s[C.UPDATED_AT] = now;
      writeSubmissionRow_(ctx, s);
      sent++;
    });
    if (sent) {
      appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email, action: 'H1_RESULTS_NOTIFIED',
        targetType: 'PERIOD', targetId: per, period: per, detail: { sent: sent, submissionId: id } }));
    }
    return { ok: true, sent: sent, skipped: skipped };
  } finally { lock.releaseLock(); }
}

/**
 * Evaluator workspace for the caller: own team (1차), own division (2차),
 * CEO queue. Only rows inside the caller's own scope are returned.
 */
function getEvaluatorWorkspace(period, phase) {
  var entry = requireCurrentUser_();
  var ss = openHrSpreadsheet_();
  var target = resolveBatchPhase_(ss, period, phase);
  var ctx = loadBatchContext_(ss);
  var C = SUBMISSION_COLUMNS;
  var out = { period: target.period, phase: target.phase, me: { name: entry.name, email: entry.email },
    approvalChain: WORKFLOW.STAGE_ORDER.slice(), team: null, division: null, ceo: null };
  if (isAuditor(entry)) { out.excluded = '감사는 평가·결재에서 제외됩니다.'; return out; }
  var viewed = [];
  function settingsOf(rows) {
    for (var k in rows) { if (rows[k] && String(rows[k][C.SETTINGS_SNAPSHOT_JSON] || '').trim()) { return settingsFromSubmissionSnapshot_(rows[k]); } }
    return null;
  }
  function memberView(m, sub, detailStage) {
    var progress = memberProgress_(sub);
    var view = { email: m.email, name: m.name, team: m.team, rank: m.rank,
      step: progress.step, stepLabel: progress.label, percent: progress.percent,
      blocker: progress.step <= 1 || !sub ? blockerReason_(sub) : '' };
    if (sub && normalizeWorkflowStage_(sub[C.CURRENT_STAGE]) === detailStage) {
      view.submission = toApproverView_(sub);
      viewed.push(sub[C.SUBMISSION_ID]);
    } else if (sub && progress.step >= 3) {
      // Read-only summary of already-forwarded evaluations.
      view.summary = { firstGrade: valueOrBlank_(sub[C.FIRST_EVALUATION_GRADE]),
        grade: round1GradeOf_(sub), adjustment: valueOrBlank_(sub[C.GRADE_ADJUSTMENT]),
        finalGrade: sub[C.PHASE] === EVALUATION_CYCLES.PHASES.H2 ? valueOrBlank_(sub[C.CALCULATED_GRADE]) : '' };
    }
    return view;
  }
  var scoreField = target.phase === EVALUATION_CYCLES.PHASES.H1 ? C.H1_SCORE : C.H2_SCORE;
  var team = teamMembers_(ctx.entries, entry.email);
  if (team.length) {
    var tRows = phaseRowsByEmail_(ctx.records, team, target.period, target.phase);
    var tReady = teamReadiness_(team, tRows);
    var tSettings = settingsOf(tRows);
    out.team = { members: team.map(function (m) { return memberView(m, tRows[m.email], WORKFLOW.STAGES.TEAM_LEAD); }),
      status: unitStatus_(team.map(function (m) { return tRows[m.email]; })),
      ready: tReady.ready, alreadyForwarded: tReady.alreadyForwarded, blockers: tReady.blockers,
      preview: batchPreview_(team, tRows, tSettings, scoreField),
      settings: tSettings ? displaySafeSettings_(tSettings) : null };
  }
  var division = divisionMembers_(ctx.entries, entry.email);
  if (division.length) {
    var dRows = phaseRowsByEmail_(ctx.records, division, target.period, target.phase);
    var dReady = divisionReadiness_(division, dRows);
    var dSettings = settingsOf(dRows);
    out.division = { members: division.map(function (m) { return memberView(m, dRows[m.email], WORKFLOW.STAGES.DIVISION_HEAD); }),
      status: unitStatus_(division.map(function (m) { return dRows[m.email]; })),
      teams: groupUnits_(division, dRows, function (m) { return normalizeEmail_(m.approver2Email) || '-'; },
        function (m) { var l = ctx.index[normalizeEmail_(m.approver2Email)]; return m.team + (l ? ' (팀장 ' + l.name + ')' : ''); }),
      ready: dReady.ready, alreadyForwarded: dReady.alreadyForwarded, blockers: dReady.blockers,
      quota: adjustmentQuota_(ctx.records, ctx.entries, entry.email, target.period, target.phase, ''),
      preview: batchPreview_(division, dRows, dSettings, scoreField),
      settings: dSettings ? displaySafeSettings_(dSettings) : null };
  }
  if (isCeo(entry)) {
    var all = filterEvaluationTargets_(ctx.entries);
    var aRows = phaseRowsByEmail_(ctx.records, all, target.period, target.phase);
    var heads = {};
    all.forEach(function (m) { var h = normalizeEmail_(m.approver3Email) || '-'; (heads[h] = heads[h] || []).push(m); });
    out.ceo = { divisions: Object.keys(heads).map(function (h) {
      var list = heads[h];
      var subs = list.map(function (m) { return aRows[m.email]; });
      var headEntry = ctx.index[h];
      return { divisionHead: h, name: list[0].division || (headEntry ? headEntry.name + ' 본부' : '본부 미지정'),
        size: list.length, status: unitStatus_(subs),
        pending: subs.filter(function (s) { return memberStep_(s) === 5; }).length,
        preview: batchPreview_(list, aRows, settingsOf(aRows), scoreField) };
    }) };
  }
  recordAccess_(ss, entry.email, 'VIEW_EVALUATOR_WORKSPACE', viewed);
  return out;
}

/** Role-scoped live progress dashboard (server-filtered). */
function getProgressDashboard(period, phase) {

// ===== AdminTools.gs =====
/**
 * AdminTools.gs
 * ---------------------------------------------------------------------------
 * HR operations: roster management (CRUD + CSV bulk import), evaluation CSV
 * export, deadline reminders (manual + daily trigger), one-click backup,
 * result PDF, personal growth trend, appeals, system readiness, and the
 * domain-fenced TEST mode used by the UI test console.
 *
 * Every entry point re-derives the caller from the session and authorizes
 * BEFORE touching data; every data change is written to the hash-chained
 * AuditLog under the script lock.
 * ---------------------------------------------------------------------------
 */

// ---- Roster management ---------------------------------------------------

var ROSTER_EDITABLE_TEXT = ['email', '사번', '이름', '팀', '직급', '본부', '상반기팀목표',
  '하반기팀목표', 'approver1Email', 'approver2Email', 'approver3Email'];
var ROSTER_FLAGS = ['isAuditor', 'isCeo', 'isHrAdmin', 'isMaster'];
// CSV header aliases → Roster header.
var ROSTER_CSV_ALIASES = {
  'email': 'email', '이메일': 'email', '이메일주소': 'email', 'e-mail': 'email',
  '사번': '사번', 'employeeid': '사번', 'employee_id': '사번', '직원번호': '사번',
  '이름': '이름', '성명': '이름', '사용자명': '이름', 'name': '이름',
  '팀': '팀', 'team': '팀', '부서': '팀', '직급': '직급', 'rank': '직급',
  '본부': '본부', 'division': '본부',
  '상반기팀목표': '상반기팀목표', '하반기팀목표': '하반기팀목표',
  'approver1email': 'approver1Email', '상위직급자': 'approver1Email',
  'approver2email': 'approver2Email', '팀장': 'approver2Email',
  'approver3email': 'approver3Email', '본부장': 'approver3Email',
  'isauditor': 'isAuditor', 'isceo': 'isCeo', 'ishradmin': 'isHrAdmin', 'ismaster': 'isMaster'
};
var EMAIL_RE = /^[^\s@,;<>"']+@[^\s@,;<>"']+\.[^\s@,;<>"']+$/;

/**
 * Validate one roster input. Only a master may set role flags; for others the
 * existing flags are preserved. PURE.
 *
 * @return {!Object} { record, errors: [] }
 */
function validateRosterInput_(input, existing, callerIsMaster) {
  var src = input || {};
  var errors = [];
  var rec = {};
  ROSTER_EDITABLE_TEXT.forEach(function (key) {
    var v = src[key] === null || src[key] === undefined ? '' : String(src[key]).trim();
    if (v.length > 500) { errors.push(key + ' 값이 너무 깁니다.'); }
    rec[key] = v;
  });
  rec.email = normalizeEmail_(rec.email);
  ['approver1Email', 'approver2Email', 'approver3Email'].forEach(function (k) {
    rec[k] = normalizeEmail_(rec[k]);
    if (rec[k] && !EMAIL_RE.test(rec[k])) { errors.push(k + ' 이메일 형식이 올바르지 않습니다: ' + rec[k]); }
    if (rec[k] && rec[k] === rec.email) { errors.push('본인을 결재자(' + k + ')로 지정할 수 없습니다.'); }
  });
  if (!rec.email || !EMAIL_RE.test(rec.email)) { errors.push('이메일주소(필수) 형식이 올바르지 않습니다.'); }
  if (!rec['사번']) { errors.push('사번(필수)이 비어 있습니다.'); }
  if (!/^[0-9A-Za-z_\-]{1,30}$/.test(rec['사번'] || 'x')) { errors.push('사번은 영문/숫자/-/_ 1~30자여야 합니다.'); }
  if (!rec['이름']) { errors.push('성명(필수)이 비어 있습니다.'); }
  ROSTER_FLAGS.forEach(function (flag) {
    var requested = src[flag] === undefined ? undefined : isFlagTrue_(src[flag]);
    var current = existing ? existing[flag] === true : false;
    if (requested !== undefined && requested !== current && !callerIsMaster) {
      errors.push(flag + ' 권한 플래그는 마스터만 변경할 수 있습니다.');
    }
    rec[flag] = callerIsMaster && requested !== undefined ? requested : current;
  });
  if (rec.isAuditor && (rec.isCeo || rec.isHrAdmin)) {
    errors.push('감사(isAuditor)는 평가·결재에서 제외되므로 대표/인사 권한과 함께 지정할 수 없습니다.');
  }
  if (rec.isMaster && !rec.isHrAdmin) { errors.push('마스터(isMaster)는 인사 관리자(isHrAdmin)여야 합니다.'); }
  return { record: rec, errors: errors };
}

/** Roster-wide invariants after a change (unique 사번, single CEO, ≥1 master). PURE. */
function rosterInvariantErrors_(entries) {
  var errors = [];
  var numbers = {};
  var ceo = 0;
  var masters = 0;
  (entries || []).forEach(function (e) {
    var n = String(e.employeeNumber || e['사번'] || '').trim();
    if (n) {
      if (numbers[n]) { errors.push('사번이 중복됩니다: ' + n); }
      numbers[n] = true;
    }
    if (e.isCeo) { ceo++; }
    if (e.isMaster) { masters++; }
  });
  if (ceo > 1) { errors.push('대표(isCeo)는 한 명만 지정할 수 있습니다.'); }
  if (!masters) { errors.push('마스터(isMaster)가 최소 한 명 있어야 합니다.'); }
  return errors;
}

/** Tokenize CSV text (RFC 4180 quotes, CRLF/LF, optional BOM). PURE. */
function parseCsv_(text) {
  var s = String(text || '').replace(/^\uFEFF/, '');
  var rows = [];
  var row = [];
  var field = '';
  var quoted = false;
  for (var i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    if (quoted) {
      if (ch === '"') {
        if (s.charAt(i + 1) === '"') { field += '"'; i++; } else { quoted = false; }
      } else { field += ch; }
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === ',' || ch === '\t') {
      row.push(field); field = '';
    } else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && s.charAt(i + 1) === '\n') { i++; }
      row.push(field); rows.push(row); row = []; field = '';
    } else { field += ch; }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

/** Map CSV rows to roster inputs by header aliases. PURE. */
function csvToRosterInputs_(text) {
  var rows = parseCsv_(text);
  if (rows.length < 2) { throw new Error('CSV에 헤더와 1개 이상의 행이 필요합니다.'); }
  var map = rows[0].map(function (h) {
    var key = String(h).trim().toLowerCase().replace(/\s+/g, '');
    return ROSTER_CSV_ALIASES[key] || ROSTER_CSV_ALIASES[String(h).trim()] || '';
  });
  ['email', '사번', '이름'].forEach(function (req) {
    if (map.indexOf(req) === -1) { throw new Error('CSV 필수 열이 없습니다: ' + req + ' (이메일주소·사번·성명)'); }
  });
  return rows.slice(1).map(function (r, i) {
    var input = { _line: i + 2 };
    map.forEach(function (key, c) { if (key) { input[key] = r[c] === undefined ? '' : r[c]; } });
    return input;
  });
}

function rosterEntryToInput_(e) {

/**
 * Apply a list of roster inputs atomically (all-or-nothing). Used by the
 * single-row form and the CSV import. Returns { created, updated, errors }.
 */
function applyRosterInputs_(entry, inputs, dryRun) {
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = ss.getSheetByName(TAB_NAMES.ROSTER);
    if (!sheet) { throw new Error('Roster 탭이 없습니다.'); }
    var values = sheet.getDataRange().getValues();
    var headerRow = values[0] || [];
    var cols = resolveColumns_(headerRow);
    ['email', '사번', '이름', '팀', '직급', 'approver1Email', 'approver2Email', 'approver3Email',
      'isAuditor', 'isCeo', 'isHrAdmin'].forEach(function (h) { requireColumn_(cols, h, TAB_NAMES.ROSTER); });
    var entries = parseRosterValues_(values);
    var index = buildRosterIndex_(entries);
    var master = isMaster(entry);
    var errors = [];
    var planned = [];
    var seen = {};
    (inputs || []).forEach(function (input) {
      var email = normalizeEmail_(input.email);
      var existing = index[email] || null;
      var v = validateRosterInput_(input, existing, master);
      if (seen[email]) { v.errors.push('같은 이메일이 두 번 입력되었습니다.'); }
      seen[email] = true;
      if (v.record['본부'] && !Object.prototype.hasOwnProperty.call(cols, '본부')) {
        v.errors.push('Roster에 "본부" 열이 없어 본부 값을 저장할 수 없습니다.');
      }
      if (v.record.isMaster && !Object.prototype.hasOwnProperty.call(cols, 'isMaster')) {
        v.errors.push('Roster에 "isMaster" 열이 없습니다.');
      }
      v.errors.forEach(function (msg) { errors.push((input._line ? input._line + '행 ' : '') + email + ': ' + msg); });
      planned.push({ existing: existing, record: v.record });
    });
    // Whole-roster invariants on the post-change view.
    var after = entries.map(function (e) { return rosterRecordAsEntry_(validateRosterInput_(rosterEntryToInput_(e), e, true).record); });
    planned.forEach(function (p) {
      var asEntry = rosterRecordAsEntry_(p.record);
      var i = -1;
      after.forEach(function (a, k) { if (a.email === p.record.email) { i = k; } });
      if (i >= 0) { after[i] = asEntry; } else { after.push(asEntry); }
    });
    rosterInvariantErrors_(after).forEach(function (msg) { errors.push(msg); });
    var created = planned.filter(function (p) { return !p.existing; }).length;
    var updated = planned.length - created;
    if (errors.length || dryRun) {
      return { ok: !errors.length, dryRun: !!dryRun, created: created, updated: updated, errors: errors };
    }
    var now = new Date().toISOString();
    planned.forEach(function (p) {
      writeRosterRecord_(sheet, headerRow, p.existing ? p.existing._row : 0, p.record);
    });
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email, action: AUDIT_ACTIONS.ROSTER_CHANGED,
      targetType: 'ROSTER', targetId: planned.length === 1 ? planned[0].record.email : 'BULK',
      detail: { created: created, updated: updated, changes: planned.map(function (p) {
        return { email: p.record.email, before: p.existing ? rosterEntryToInput_(p.existing) : null, after: p.record };
      }) }, nowIso: now }));
    return { ok: true, created: created, updated: updated, errors: [] };
  } finally { lock.releaseLock(); }
}

function upsertRosterEntry(input) {

function importRosterCsv(csvText, dryRun) {

/** HR: delete a roster row unless it would orphan in-flight evaluations. */
function deleteRosterEntry(email) {
  var entry = requireRosterAdmin_();
  var key = normalizeEmail_(email);
  if (!key) { throw new Error('삭제할 이메일이 없습니다.'); }
  if (key === entry.email) { throw new Error('본인 계정은 삭제할 수 없습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = ss.getSheetByName(TAB_NAMES.ROSTER);
    var entries = parseRosterValues_(sheet.getDataRange().getValues());
    var target = buildRosterIndex_(entries)[key];
    if (!target) { throw new Error('명단에 없는 이메일입니다.'); }
    if ((target.isHrAdmin || target.isMaster || target.isCeo) && !isMaster(entry)) {
      throw new Error('인사·마스터·대표 계정은 마스터만 삭제할 수 있습니다.');
    }
    var subs = parseSubmissionValues_(readTabValues_(ss, TAB_NAMES.SUBMISSIONS));
    var active = subs.filter(function (s) {
      return s[SUBMISSION_COLUMNS.EMPLOYEE_EMAIL] === key &&
        (s[SUBMISSION_COLUMNS.STATUS] === WORKFLOW.STATUS.SUBMITTED || s[SUBMISSION_COLUMNS.STATUS] === WORKFLOW.STATUS.IN_REVIEW);
    });
    if (active.length) { throw new Error('결재 진행 중인 평가서가 있어 삭제할 수 없습니다. 먼저 반려하거나 완료하세요.'); }
    var approverOf = entries.filter(function (e) {
      return e.approver1Email === key || e.approver2Email === key || e.approver3Email === key;
    });
    if (approverOf.length) {
      throw new Error('다른 직원 ' + approverOf.length + '명의 결재자로 지정되어 있어 삭제할 수 없습니다. 결재자를 먼저 변경하세요.');
    }
    var remaining = entries.filter(function (e) { return e.email !== key; });
    var inv = rosterInvariantErrors_(remaining);
    if (inv.length) { throw new Error(inv.join(' ')); }
    sheet.deleteRow(target._row);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email, action: AUDIT_ACTIONS.ROSTER_CHANGED,
      targetType: 'ROSTER', targetId: key, detail: { deleted: rosterEntryToInput_(target) } }));
    return { ok: true, deleted: key };
  } finally { lock.releaseLock(); }
}

function csvCell_(v) {
  var t = v === null || v === undefined ? '' : String(v);
  // Excel formula-injection guard for exported files too.
  if (/^[=+\-@\t\r]/.test(t)) { t = "'" + t; }
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

/** Build the evaluation-status CSV (UTF-8 BOM for Excel). PURE. */
function buildEvaluationCsv_(members, rowsByEmail, rosterIndex, phase) {
  var C = SUBMISSION_COLUMNS;
  var header = ['본부', '팀', '성명', '사번', '이메일', '진행단계', '진행률(%)', '상태',
    phase === EVALUATION_CYCLES.PHASES.H1 ? '상반기 점수' : '하반기 점수',
    '1차 환산등급', '2차 조정', '조정등급(1차 체계)', phase === EVALUATION_CYCLES.PHASES.H2 ? '연간 점수' : '',
    phase === EVALUATION_CYCLES.PHASES.H2 ? '최종 종합등급' : '',
    '1차 평가자', '2차 평가자', '결과 안내'];
  var lines = [header.map(csvCell_).join(',')];
  (members || []).forEach(function (m) {
    var sub = rowsByEmail[m.email] || null;
    var p = memberProgress_(sub);
    var head = rosterIndex[normalizeEmail_(m.approver3Email)];
    var val = function (field) { return sub ? valueOrBlank_(sub[field]) : ''; };
    lines.push([m.division || (head ? head.name + ' 본부' : ''), m.team, m.name, m.employeeNumber, m.email,
      p.label, p.percent, sub ? sub[C.STATUS] : '미제출',
      sub && hasFirstEvaluation_(sub) ? val(phase === EVALUATION_CYCLES.PHASES.H1 ? C.H1_SCORE : C.H2_SCORE) : '',
      val(C.FIRST_EVALUATION_GRADE), val(C.GRADE_ADJUSTMENT), round1GradeOf_(sub),
      phase === EVALUATION_CYCLES.PHASES.H2 ? val(C.FINAL_SCORE) : '',
      phase === EVALUATION_CYCLES.PHASES.H2 ? val(C.CALCULATED_GRADE) : '',
      val(C.FIRST_EVALUATED_BY), val(C.SECOND_EVALUATED_BY),
      isResultNotified_(sub) ? '안내됨' : ''].map(csvCell_).join(','));
  });
  return '\uFEFF' + lines.join('\r\n');
}

function exportEvaluationCsv(period, phase) {
  var entry = requireRosterAdmin_();
  var ss = openHrSpreadsheet_();
  var target = resolveBatchPhase_(ss, period, phase);
  var ctx = loadBatchContext_(ss);

  members.sort(function (a, b) {
    return String(a.division + a.team + a.name).localeCompare(String(b.division + b.team + b.name));
  });

  recordAccess_(ss, entry.email, 'EXPORT_EVALUATION_CSV', [target.period + '-' + target.phase]);
  return { fileName: 'evaluation-' + target.period + '-' + target.phase + '.csv',
    csv: buildEvaluationCsv_(members, rows, ctx.index, target.phase) };
}

/**
 * Who should be reminded for a phase. PURE.
 * Returns [{ email, role, count, names }].
 */
function reminderTargets_(entries, records, period, phase) {
  var targets = filterEvaluationTargets_(entries);
  var rows = phaseRowsByEmail_(records, targets, period, phase);
  var out = {};
  function add(email, role, name) {
    var key = normalizeEmail_(email);
    if (!key) { return; }
    var k = key + '|' + role;
    if (!out[k]) { out[k] = { email: key, role: role, count: 0, names: [] }; }
    out[k].count++;
    if (out[k].names.length < 20) { out[k].names.push(name); }
  }
  targets.forEach(function (m) {
    var sub = rows[m.email];
    var step = memberStep_(sub);
    var chain = resolveApproverChainFromEntry_(m, entries);
    if (step === 0) { add(m.email, '본인 평가서 미제출', m.name); }
    else if (step === 1 && sub && normalizeWorkflowStage_(sub[SUBMISSION_COLUMNS.CURRENT_STAGE]) === WORKFLOW.STAGES.SENIOR) {
      add(chain[WORKFLOW.STAGES.SENIOR], '상위직급자 검토 대기', m.name);
    } else if (step === 1 || step === 2) { add(chain[WORKFLOW.STAGES.TEAM_LEAD], '1차 평가/팀 의뢰 대기', m.name); }
    else if (step === 3 || step === 4) { add(chain[WORKFLOW.STAGES.DIVISION_HEAD], '2차 평가/본부 의뢰 대기', m.name); }
    else if (step === 5) { add(chain[WORKFLOW.STAGES.CEO], '대표 확정 대기', m.name); }
  });
  return Object.keys(out).map(function (k) { return out[k]; });
}

function runReminders_(ss, actorEmail, period, phase, onlyNearDeadline) {
  var cycle = getSingleOpenEvaluationCycle_(ss, period || null);
  if (!cycle) { return { ok: true, sent: 0, reason: 'OPEN 평가 운영이 없습니다.' }; }
  var days = daysUntilDeadline_(cycle.deadlineAt);
  if (onlyNearDeadline && (days === null || days > 3)) {
    return { ok: true, sent: 0, reason: '마감 3일 전부터 자동 발송됩니다.', daysLeft: days };
  }
  var ctx = loadBatchContext_(ss);
  var today = new Date().toISOString().slice(0, 10);
  var audit = parseAuditLogValues_(getAuditSheet_(ss).getDataRange().getValues());
  var alreadyToday = {};
  audit.forEach(function (a) {
    if (a.action === AUDIT_ACTIONS.REMINDER_SENT && String(a.timestamp).slice(0, 10) === today) {
      try { JSON.parse(a.detailJson).recipients.forEach(function (r) { alreadyToday[r] = true; }); } catch (e) { /* ignore */ }
    }
  });
  var list = reminderTargets_(ctx.entries, ctx.records, cycle.period, phase || cycle.phase);
  var sent = [];
  list.forEach(function (t) {
    var key = t.email + '|' + t.role;
    if (alreadyToday[key]) { return; }
    var dday = days === null ? '' : (days >= 0 ? ' (마감 D-' + days + ')' : ' (마감 ' + (-days) + '일 경과)');
    if (notifyByMail_(t.email, '[인사평가] ' + cycle.period + ' ' + cycle.phase + ' 진행 요청' + dday,
      t.role + ': ' + t.count + '건\n대상: ' + t.names.join(', ') + (t.count > t.names.length ? ' 외' : '') +
      '\n\n인사평가 시스템에 접속해 처리해 주세요.')) {
      sent.push(key);
    }
  });
  if (sent.length) {
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: actorEmail, action: AUDIT_ACTIONS.REMINDER_SENT,
      targetType: 'CYCLE', targetId: cycle.cycleId, period: cycle.period,
      detail: { recipients: sent, daysLeft: days } }));
  }
  return { ok: true, sent: sent.length, daysLeft: days, candidates: list.length };
}

/** HR: send reminders now (deduplicated per recipient per day). */
function sendReminders(period, phase) {
  var entry = requireRosterAdmin_();
  var lock = LockService.getScriptLock();

}

/** Released results of one employee across years (trend). PURE. */
function growthTrend_(records, email) {
  var C = SUBMISSION_COLUMNS;
  var key = normalizeEmail_(email);
  var byYear = {};
  (records || []).forEach(function (r) {
    if (normalizeEmail_(r[C.EMPLOYEE_EMAIL]) !== key) { return; }
    var y = String(r[C.PERIOD]);
    byYear[y] = byYear[y] || { period: y };
    if (r[C.PHASE] === EVALUATION_CYCLES.PHASES.H1 && r[C.STATUS] === WORKFLOW.STATUS.COMPLETED &&
        (hasStoredValue_(r[C.RESULT_NOTIFIED_AT]) || (!hasFirstEvaluation_(r) && hasStoredValue_(r[C.CALCULATED_AT])))) {
      byYear[y].h1Score = Number(r[C.H1_SCORE]);
      byYear[y].h1Grade = r[C.CALCULATED_GRADE];
    }
    if (r[C.PHASE] === EVALUATION_CYCLES.PHASES.H2 && hasStoredValue_(r[C.RESULT_SENT_AT])) {
      byYear[y].h2Score = Number(r[C.H2_SCORE]);
      byYear[y].finalScore = Number(r[C.FINAL_SCORE]);
      byYear[y].finalGrade = r[C.CALCULATED_GRADE];
      byYear[y].competencyScore = Number(r[C.COMPETENCY_SCORE]);
    }
  });
  return Object.keys(byYear).sort().map(function (y) { return byYear[y]; })
    .filter(function (y) { return y.h1Grade || y.finalGrade; });
}

function getMyGrowthTrend() {

    '<h3>상반기</h3><p><b>팀 목표</b><br>' + e(a.h1.teamGoal) + '</p><p><b>자기 Review</b><br>' + e(a.h1.review) + '</p><p><b>1차 평가 의견</b><br>' + e(a.h1.comment) + '</p>' +
    '<h3>하반기</h3><p><b>팀 목표</b><br>' + e(a.h2.teamGoal) + '</p><p><b>자기 Review</b><br>' + e(a.h2.review) + '</p>' +
    '<h3>역량평가</h3><table><tr><th>역량</th><th>Level</th><th>의견</th></tr>' + rows + '</table>' +
    '<h3>최종 의견</h3><p>' + e(a.finalComment) + '</p><p style="color:#667">공개일 ' + e(a.releasedAt) + '</p></body></html>';
}

/** Employee: PDF of their own RELEASED annual result (base64). */
function getMyAnnualResultPdf(period) {
  var entry = requireCurrentUser_();
  var ss = openHrSpreadsheet_();
  var per = normalizeEvaluationPeriod_(period);
  var subs = parseSubmissionValues_(readTabValues_(ss, TAB_NAMES.SUBMISSIONS));
  var h1 = findPhaseSubmission_(subs, entry.email, per, EVALUATION_CYCLES.PHASES.H1);
  var h2 = findPhaseSubmission_(subs, entry.email, per, EVALUATION_CYCLES.PHASES.H2);
  if (!h2 || !hasStoredValue_(h2[SUBMISSION_COLUMNS.RESULT_SENT_AT])) {
    throw new Error('공개된 연간 결과가 없습니다.');
  }
  assertPhaseSubmissionCycleBinding_(ss, h2);
  assertPhaseSubmissionCycleBinding_(ss, h1);
  var annual = buildEmployeeAnnualResult_(h1, h2);
  var blob = HtmlService.createHtmlOutput(annualResultHtml_(annual)).getBlob().getAs('application/pdf');
  recordAccess_(ss, entry.email, 'DOWNLOAD_OWN_RESULT_PDF', [h2[SUBMISSION_COLUMNS.SUBMISSION_ID]]);
  return { fileName: per + '_인사평가결과_' + entry.name + '.pdf', base64: Utilities.base64Encode(blob.getBytes()) };
}

// ---- Appeals (이의제기) ----------------------------------------------------

var APPEAL_HEADERS = ['appealId', 'submissionId', 'employeeEmail', 'period', 'phase', 'status',
  'reason', 'filedAt', 'resolution', 'resolvedBy', 'resolvedAt'];
var APPEAL_STATUS = { FILED: 'FILED', ACCEPTED: 'ACCEPTED', REJECTED: 'REJECTED' };

function getAppealSheet_(ss) {
  var sheet = ss.getSheetByName(TAB_NAMES.APPEALS);
  if (!sheet) { throw new Error('이의제기 기능을 쓰려면 Appeals 탭을 만드세요. (docs/SETUP_GUIDE.md)'); }
  var values = sheet.getDataRange().getValues();
  var cols = resolveColumns_(values[0] || []);
  APPEAL_HEADERS.forEach(function (h) { requireColumn_(cols, h, TAB_NAMES.APPEALS); });
  var list = [];
  for (var r = 1; r < values.length; r++) {
    var rec = { _row: r + 1 };
    APPEAL_HEADERS.forEach(function (h) { rec[h] = values[r][cols[h]] === undefined ? '' : String(values[r][cols[h]]); });
    if (rec.appealId) { list.push(rec); }
  }
  return { sheet: sheet, header: values[0], list: list };
}

/** Employee: appeal their own released result (one open appeal per result). */
function fileAppeal(period, phase, reason) {
  var entry = requireCurrentUser_();
  assertEvaluationTarget_(entry);
  var why = String(reason || '').trim();
  if (why.length < 10) { throw new Error('이의제기 사유를 10자 이상 입력하세요.'); }
  if (why.length > 3000) { throw new Error('이의제기 사유는 3000자 이내로 입력하세요.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var subs = parseSubmissionValues_(readTabValues_(ss, TAB_NAMES.SUBMISSIONS));
    var sub = findPhaseSubmission_(subs, entry.email, normalizeEvaluationPeriod_(period), normalizeEvaluationPhase_(phase));
    if (!sub || !isResultNotified_(sub)) { throw new Error('안내된 결과에만 이의를 제기할 수 있습니다.'); }
    var ap = getAppealSheet_(ss);
    if (ap.list.some(function (a) { return a.submissionId === sub[SUBMISSION_COLUMNS.SUBMISSION_ID] && a.status === APPEAL_STATUS.FILED; })) {
      throw new Error('이미 접수된 이의제기가 처리 중입니다.');
    }
    var now = new Date().toISOString();
    var rec = { appealId: 'APL-' + Utilities.getUuid().slice(0, 8), submissionId: sub[SUBMISSION_COLUMNS.SUBMISSION_ID],
      employeeEmail: entry.email, period: sub[SUBMISSION_COLUMNS.PERIOD], phase: sub[SUBMISSION_COLUMNS.PHASE],
      status: APPEAL_STATUS.FILED, reason: why, filedAt: now, resolution: '', resolvedBy: '', resolvedAt: '' };
    ap.sheet.appendRow(recordToRow_(ap.header, rec));
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email, action: AUDIT_ACTIONS.APPEAL_FILED,
      targetType: 'APPEAL', targetId: rec.appealId, period: rec.period, detail: { submissionId: rec.submissionId }, nowIso: now }));
    parseRosterValues_(readTabValues_(ss, TAB_NAMES.ROSTER)).filter(function (e) { return e.isHrAdmin; })
      .forEach(function (hr) { notifyByMail_(hr.email, '[인사평가] 이의제기 접수', entry.name + ' 님의 ' + rec.period + ' ' + rec.phase + ' 결과 이의제기가 접수되었습니다.'); });
    return { ok: true, appealId: rec.appealId };
  } finally { lock.releaseLock(); }
}

function getMyAppeals() {
  var entry = requireCurrentUser_();
  var ss = openHrSpreadsheet_();
  if (!ss.getSheetByName(TAB_NAMES.APPEALS)) { return { enabled: false, appeals: [] }; }
  return { enabled: true, appeals: getAppealSheet_(ss).list.filter(function (a) {
    return a.employeeEmail === entry.email;
  }).map(function (a) { delete a._row; delete a.resolvedBy; return a; }) };
}

function listAppeals() {
  var entry = requireRosterAdmin_();
  var ss = openHrSpreadsheet_();
  if (!ss.getSheetByName(TAB_NAMES.APPEALS)) { return { enabled: false, appeals: [] }; }
  var list = getAppealSheet_(ss).list;
  recordAccess_(ss, entry.email, 'VIEW_APPEALS', list.map(function (a) { return a.appealId; }));
  return { enabled: true, appeals: list.map(function (a) { delete a._row; return a; }) };
}

/**
 * HR: 재심의 결과 확정. ACCEPTED/REJECTED with a mandatory resolution. The
 * resolution text is shown to the employee; any grade correction requires the
 * normal evaluator flow (RETURN → re-evaluation) so the audit trail stays
 * complete — HR never overwrites a grade here.
 */
function resolveAppeal(appealId, decision, resolution) {
  var entry = requireRosterAdmin_();
  var d = String(decision || '');
  if (d !== APPEAL_STATUS.ACCEPTED && d !== APPEAL_STATUS.REJECTED) { throw new Error('결정은 ACCEPTED 또는 REJECTED여야 합니다.'); }
  var text = String(resolution || '').trim();
  if (!text) { throw new Error('재심의 결과 의견을 입력하세요.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var ap = getAppealSheet_(ss);
    var a = ap.list.filter(function (x) { return x.appealId === String(appealId); })[0];
    if (!a) { throw new Error('이의제기를 찾을 수 없습니다.'); }
    if (a.status !== APPEAL_STATUS.FILED) { throw new Error('이미 처리된 이의제기입니다.'); }
    var now = new Date().toISOString();
    a.status = d; a.resolution = text; a.resolvedBy = entry.email; a.resolvedAt = now;
    ap.sheet.getRange(a._row, 1, 1, ap.header.length).setValues([recordToRow_(ap.header, a)]);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email, action: AUDIT_ACTIONS.APPEAL_RESOLVED,
      targetType: 'APPEAL', targetId: a.appealId, period: a.period, detail: { decision: d }, nowIso: now }));
    notifyByMail_(a.employeeEmail, '[인사평가] 이의제기 재심의 결과', '결정: ' + (d === 'ACCEPTED' ? '인용' : '기각') + '\n' + text);
    return { ok: true, appealId: a.appealId, status: d };
  } finally { lock.releaseLock(); }
}

// ---- System readiness (preflight) -----------------------------------------

/** HR: checklist before opening a season. */
function getSystemReadiness(period) {
  var entry = requireRosterAdmin_();
  var ss = openHrSpreadsheet_();
  var per = String(period || new Date().getFullYear());
  var checks = [];
  function check(name, fn) {
    try { var r = fn(); checks.push({ name: name, ok: r === true || (r && r.ok !== false), detail: r && r.detail ? r.detail : '' }); }
    catch (e) { checks.push({ name: name, ok: false, detail: String(e && e.message ? e.message : e) }); }
  }
  [TAB_NAMES.ROSTER, TAB_NAMES.SUBMISSIONS, TAB_NAMES.APPROVAL_LOG, TAB_NAMES.EVALUATION_SETTINGS,
    TAB_NAMES.EVALUATION_CYCLES, TAB_NAMES.AUDIT_LOG].forEach(function (tab) {
    check('필수 탭: ' + tab, function () { if (!ss.getSheetByName(tab)) { throw new Error('탭 없음'); } return true; });
  });
  check('권장 탭: AccessLog (열람 로그)', function () {
    return ss.getSheetByName(TAB_NAMES.ACCESS_LOG) ? true : { ok: false, detail: '없으면 열람 기록이 남지 않습니다.' };
  });
  check('Submissions 1차/2차 평가 열', function () {
    var h = ss.getSheetByName(TAB_NAMES.SUBMISSIONS).getDataRange().getValues()[0];
    requirePhaseSubmissionColumns_(h); requireEvaluatorColumns_(h); return true;
  });
  var entries = [];
  check('명단(Roster) 불변식', function () {
    entries = parseRosterValues_(readTabValues_(ss, TAB_NAMES.ROSTER));
    var errs = rosterInvariantErrors_(entries);
    if (!findCompanyWideRole_(entries, 'isCeo')) { errs.push('대표(isCeo)가 지정되지 않았습니다.'); }
    return errs.length ? { ok: false, detail: errs.join(' ') } : { ok: true, detail: '대상 ' + filterEvaluationTargets_(entries).length + '명' };
  });
  check('결재 체인 누락', function () {
    var bad = filterEvaluationTargets_(entries).filter(function (e) {
      return approverChainIssues_(e, entries).some(function (i) { return i.indexOf('상위직급자') !== 0; });
    });
    return bad.length ? { ok: false, detail: bad.slice(0, 10).map(function (e) { return e.name; }).join(', ') + (bad.length > 10 ? ' 외 ' + (bad.length - 10) + '명' : '') }
      : { ok: true, detail: '모든 대상자의 팀장·본부장·대표 지정 완료 (상위직급자는 선택)' };
  });
  check('EvaluationSettings 최종 등급 구간 열(gradeBandsFinalJson)', function () {
    return requireFinalBandsColumn_(getSettingsSheet_(ss).getDataRange().getValues()[0]);
  });
  check(per + ' 연간 평가기준표 확정(잠금)', function () {
    var s = getActiveFinalEvaluationSettings_(ss, per); return { ok: true, detail: 'v' + s.version };
  });
  check('감사 로그 해시 체인', function () {
    var v = verifyAuditChain_(parseAuditLogValues_(getAuditSheet_(ss).getDataRange().getValues()));
    return v.valid ? { ok: true, detail: v.count + '건 무결' } : { ok: false, detail: (v.brokenAt + 1) + '번째 기록: ' + v.reason };
  });
  check('실행 모드', function () {
    return getAppMode_() === 'TEST' ? { ok: true, detail: 'TEST 모드 (가상 데이터 전용)' } : { ok: true, detail: '운영(PROD) 모드' };
  });
  return { period: per, checks: checks, ready: checks.every(function (c) { return c.ok || c.name.indexOf('권장') === 0; }) };
}

// ---- TEST mode (UI flow testing with virtual employees) --------------------

var TEST_DOMAIN = '@test.local';

function getAppMode_() {
  try {
    var v = PropertiesService.getScriptProperties().getProperty('APP_MODE');
    return String(v || '').trim().toUpperCase() === 'TEST' ? 'TEST' : 'PROD';
  } catch (e) { return 'PROD'; }
}

function isTestEmail_(email) {
  var e = normalizeEmail_(email);
  return e.length > TEST_DOMAIN.length && e.slice(-TEST_DOMAIN.length) === TEST_DOMAIN;
}

/**
 * In TEST mode an HR admin may act as a VIRTUAL @test.local user. Never
 * possible in PROD, never for a real address. PURE decision.
 */
function resolveTestActAs_(mode, realEntry, requested) {
  if (mode !== 'TEST' || !realEntry || realEntry.isHrAdmin !== true) { return ''; }
  var target = normalizeEmail_(requested);
  return target && isTestEmail_(target) ? target : '';
}

function testActAsKey_(realEmail) { return 'TEST_ACT_AS:' + normalizeEmail_(realEmail); }

function requireTestOperator_() {
  if (getAppMode_() !== 'TEST') { throw new Error('TEST 모드가 아닙니다. (Script Property APP_MODE=TEST 필요)'); }
  var real = normalizeEmail_(Session.getActiveUser().getEmail());
  var entry = getRosterEntryByEmail(real);
  if (!entry || !entry.isHrAdmin) { throw new Error('TEST 콘솔은 실제 인사 관리자 계정만 사용할 수 있습니다.'); }
  var ss = openHrSpreadsheet_();
  if (String(ss.getName()).indexOf('[TEST]') === -1) {
    throw new Error('운영 데이터 보호: 스프레드시트 이름에 [TEST]가 포함된 별도 사본에서만 TEST 기능을 쓸 수 있습니다.');
  }
  return { real: real, entry: entry, ss: ss };
}

function setTestActAs(email) {
  var op = requireTestOperator_();
  var target = normalizeEmail_(email);
  if (target && !isTestEmail_(target)) { throw new Error('가상 사용자(' + TEST_DOMAIN + ')로만 전환할 수 있습니다.'); }
  var props = PropertiesService.getScriptProperties();
  if (target) { props.setProperty(testActAsKey_(op.real), target); } else { props.deleteProperty(testActAsKey_(op.real)); }
  return { ok: true, actingAs: target || op.real };
}

function getTestConsoleState() {
  var op = requireTestOperator_();
  var entries = parseRosterValues_(readTabValues_(op.ss, TAB_NAMES.ROSTER));
  return { mode: 'TEST', operator: op.real,
    actingAs: PropertiesService.getScriptProperties().getProperty(testActAsKey_(op.real)) || op.real,
    virtualUsers: entries.filter(function (e) { return isTestEmail_(e.email); }).map(function (e) {
      return { email: e.email, name: e.name, team: e.team, rank: e.rank,
        roles: [e.isCeo ? '대표' : '', e.isAuditor ? '감사(제외)' : '', e.isHrAdmin ? '인사' : ''].filter(String) };
    }) };
}

/** Seed a virtual organization (idempotent). TEST mode + [TEST] sheet only. */
function seedTestScenario() {
  var op = requireTestOperator_();
  var d = TEST_DOMAIN;
  var org = [
    { email: 'ceo' + d, '사번': 'T-CEO', '이름': '가상 대표', '팀': '경영진', '직급': '대표', isCeo: true },
    { email: 'auditor' + d, '사번': 'T-AUD', '이름': '가상 감사', '팀': '감사실', '직급': '감사', isAuditor: true },
    // Evaluators carry no approver lines here so the test division is exactly
    // the five staff below (20% → at most one ±1 adjustment).
    { email: 'head' + d, '사번': 'T-D01', '이름': '가상 본부장', '팀': '기술본부', '직급': '본부장', '본부': '기술본부' },
    { email: 'lead.a' + d, '사번': 'T-L01', '이름': '가상 A팀장', '팀': 'A팀', '직급': '팀장', '본부': '기술본부' },
    { email: 'lead.b' + d, '사번': 'T-L02', '이름': '가상 B팀장', '팀': 'B팀', '직급': '팀장', '본부': '기술본부' },
    { email: 'senior.a' + d, '사번': 'T-S01', '이름': '가상 A선임', '팀': 'A팀', '직급': '책임', '본부': '기술본부' }
  ];
  ['a1', 'a2', 'a3', 'b1', 'b2'].forEach(function (id, i) {
    var team = id.charAt(0) === 'a' ? 'A' : 'B';
    org.push({ email: 'staff.' + id + d, '사번': 'T-E0' + (i + 1), '이름': '가상 직원 ' + id.toUpperCase(),
      '팀': team + '팀', '직급': '사원', '본부': '기술본부',
      approver1Email: team === 'A' && i === 0 ? 'senior.a' + d : '',
      approver2Email: 'lead.' + team.toLowerCase() + d, approver3Email: 'head' + d });
  });
  var entries = parseRosterValues_(readTabValues_(op.ss, TAB_NAMES.ROSTER));
  var index = buildRosterIndex_(entries);
  var inputs = org.filter(function (o) { return !index[o.email]; }).map(function (o) {
    if (o.isCeo && findCompanyWideRole_(entries, 'isCeo')) { o.isCeo = false; }
    return o;
  });
  if (!inputs.length) { return { ok: true, created: 0, note: '가상 조직이 이미 있습니다.' }; }
  var masterEntry = { email: op.real, isHrAdmin: true, isMaster: true };
  return applyRosterInputs_(masterEntry, inputs, false);
}

}
