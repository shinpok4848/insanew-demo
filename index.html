// ===== EvaluationCycles.gs =====
/*
 * Server-owned H1/H2 evaluation-cycle control plane.
 *
 * A cycle, not browser input, determines which phase employees may edit.
 * Every runtime path reads exact headers and fails closed on duplicate logical
 * keys or more than one globally OPEN cycle.
 */

function normalizeEvaluationPeriod_(period) {
  var value = String(period === null || period === undefined ? '' : period).trim();
  if (!/^\d{4}$/.test(value)) {
    throw new Error('평가 연도는 4자리 숫자여야 합니다.');
  }
  return value;
}

function normalizeEvaluationPhase_(phase) {
  var value = String(phase === null || phase === undefined ? '' : phase).trim();
  if (value !== EVALUATION_CYCLES.PHASES.H1 && value !== EVALUATION_CYCLES.PHASES.H2) {
    throw new Error('평가 단계는 H1 또는 H2여야 합니다.');
  }
  return value;
}

function normalizeEvaluationCycleStatus_(status) {
  var value = String(status === null || status === undefined ? '' : status).trim();
  if (value !== EVALUATION_CYCLES.STATUS.OPEN && value !== EVALUATION_CYCLES.STATUS.CLOSED) {
    throw new Error('평가 운영 상태는 OPEN 또는 CLOSED여야 합니다.');
  }
  return value;
}

function requireEvaluationCycleColumns_(headerRow) {
  var columns = resolveColumns_(headerRow || []);
  EVALUATION_CYCLE_HEADERS.forEach(function (header) {
    requireColumn_(columns, header, TAB_NAMES.EVALUATION_CYCLES);
  });
  return columns;
}

function validateEvaluationCycleRecord_(record) {
  var C = EVALUATION_CYCLE_COLUMNS;
  var rec = record || {};
  rec[C.CYCLE_ID] = String(rec[C.CYCLE_ID] || '').trim();
  if (!rec[C.CYCLE_ID]) {
    throw new Error('EvaluationCycles 행의 cycleId가 비어 있습니다.');
  }
  rec[C.PERIOD] = normalizeEvaluationPeriod_(rec[C.PERIOD]);
  rec[C.PHASE] = normalizeEvaluationPhase_(rec[C.PHASE]);
  rec[C.STATUS] = normalizeEvaluationCycleStatus_(rec[C.STATUS]);
  rec[C.SETTINGS_ID] = String(rec[C.SETTINGS_ID] || '').trim();
  if (!rec[C.SETTINGS_ID]) {
    throw new Error('EvaluationCycles 행의 settingsId가 비어 있습니다.');
  }
  var versionText = String(rec[C.SETTINGS_VERSION] === null ||
    rec[C.SETTINGS_VERSION] === undefined ? '' : rec[C.SETTINGS_VERSION]).trim();
  var version = Number(versionText);
  if (!/^\d+$/.test(versionText) || !isFinite(version) || version < 1) {
    throw new Error('EvaluationCycles 행의 settingsVersion이 올바르지 않습니다.');
  }
  rec[C.SETTINGS_VERSION] = version;
  rec[C.SETTINGS_HASH] = String(rec[C.SETTINGS_HASH] || '').trim().toLowerCase();
  if (!/^[0-9a-f]{64}$/.test(rec[C.SETTINGS_HASH])) {
    throw new Error('EvaluationCycles 행의 settingsHash가 올바르지 않습니다.');
  }
  [C.CREATED_AT, C.CREATED_BY, C.OPENED_AT, C.OPENED_BY, C.UPDATED_AT,
    C.UPDATED_BY].forEach(function (field) {
    if (!String(rec[field] === null || rec[field] === undefined ? '' : rec[field]).trim()) {
      throw new Error('EvaluationCycles 행의 ' + field + ' 값이 비어 있습니다.');
    }
  });
  if (rec[C.STATUS] === EVALUATION_CYCLES.STATUS.CLOSED &&
      (!String(rec[C.CLOSED_AT] || '').trim() || !String(rec[C.CLOSED_BY] || '').trim())) {
    throw new Error('CLOSED 운영 행에는 closedAt/closedBy가 필요합니다.');
  }
  return rec;
}

/** Parse by exact headers. Nonblank malformed rows are rejected. PURE. */
function parseEvaluationCycleValues_(values, requireExactHeaders) {
  var strictHeaders = requireExactHeaders !== false;
  if (!values || values.length < 1) {
    if (strictHeaders) { requireEvaluationCycleColumns_([]); }
    return [];
  }
  var columns = strictHeaders
    ? requireEvaluationCycleColumns_(values[0]) : resolveColumns_(values[0]);
  var out = [];
  for (var r = 1; r < values.length; r++) {
    var row = values[r] || [];
    var hasData = EVALUATION_CYCLE_HEADERS.some(function (header) {
      return Object.prototype.hasOwnProperty.call(columns, header) &&
        row[columns[header]] !== null && row[columns[header]] !== undefined &&
        String(row[columns[header]]).trim() !== '';
    });
    if (!hasData) { continue; }
    var rec = { _row: r + 1 };
    EVALUATION_CYCLE_HEADERS.concat(EVALUATION_CYCLE_OPTIONAL_HEADERS).forEach(function (header) {
      rec[header] = Object.prototype.hasOwnProperty.call(columns, header) &&
        row[columns[header]] !== null && row[columns[header]] !== undefined
        ? row[columns[header]] : '';
    });
    out.push(validateEvaluationCycleRecord_(rec));
  }
  return out;
}

function assertUniqueEvaluationCycles_(records) {
  var C = EVALUATION_CYCLE_COLUMNS;
  var ids = {};
  var keys = {};
  (records || []).forEach(function (record) {
    var id = String(record[C.CYCLE_ID]);
    var key = String(record[C.PERIOD]) + '\u0000' + String(record[C.PHASE]);
    if (Object.prototype.hasOwnProperty.call(ids, id)) {
      throw new Error('중복 cycleId가 발견되었습니다: ' + id);
    }
    if (Object.prototype.hasOwnProperty.call(keys, key)) {
      throw new Error(record[C.PERIOD] + ' ' + record[C.PHASE] +
        ' 평가 운영 행이 중복되었습니다. Sheet를 정리한 뒤 다시 시도하세요.');
    }
    ids[id] = true;
    keys[key] = true;
  });
  return true;
}

/** Find one year+phase row and reject duplicate logical keys. PURE. */
function findEvaluationCycle_(records, period, phase) {
  var per = normalizeEvaluationPeriod_(period);
  var ph = normalizeEvaluationPhase_(phase);
  var C = EVALUATION_CYCLE_COLUMNS;
  var matches = (records || []).filter(function (record) {
    return String(record[C.PERIOD]) === per && String(record[C.PHASE]) === ph;
  });
  if (matches.length > 1) {
    throw new Error(per + ' ' + ph + ' 평가 운영 행이 중복되었습니다.');
  }
  return matches.length ? matches[0] : null;
}

function findEvaluationCycleById_(records, cycleId) {
  var id = String(cycleId || '').trim();
  var C = EVALUATION_CYCLE_COLUMNS;
  var matches = (records || []).filter(function (record) {
    return String(record[C.CYCLE_ID]) === id;
  });
  if (matches.length > 1) { throw new Error('중복 cycleId가 발견되었습니다: ' + id); }
  return matches.length ? matches[0] : null;
}

function getEvaluationCycleSheet_(spreadsheet) {
  var sheet = spreadsheet.getSheetByName(TAB_NAMES.EVALUATION_CYCLES);
  if (!sheet) {
    throw new Error('필수 탭 "' + TAB_NAMES.EVALUATION_CYCLES + '"이(가) 없습니다.');
  }
  return sheet;
}

function readEvaluationCycles_(spreadsheet) {
  var records = parseEvaluationCycleValues_(
    getEvaluationCycleSheet_(spreadsheet).getDataRange().getValues(), true);
  assertUniqueEvaluationCycles_(records);
  return records;
}

function singleOpenCycleFromRecords_(records, optionalPeriod) {
  var C = EVALUATION_CYCLE_COLUMNS;
  var open = (records || []).filter(function (record) {
    return record[C.STATUS] === EVALUATION_CYCLES.STATUS.OPEN;
  });
  if (open.length > 1) {
    throw new Error('OPEN 평가 운영이 둘 이상입니다. 안전을 위해 모든 직원 입력을 차단했습니다.');
  }
  if (!open.length) { return null; }
  if (optionalPeriod !== null && optionalPeriod !== undefined &&
      String(optionalPeriod).trim() !== '') {
    var per = normalizeEvaluationPeriod_(optionalPeriod);
    return String(open[0][C.PERIOD]) === per ? open[0] : null;
  }
  return open[0];
}

/** Return null or the unique globally OPEN cycle; duplicate OPEN fails closed. */
function getSingleOpenEvaluationCycle_(spreadsheet, optionalPeriod) {
  return singleOpenCycleFromRecords_(readEvaluationCycles_(spreadsheet), optionalPeriod);
}

function evaluationCycleToRow_(headerRow, record) {
  return (headerRow || []).map(function (header) {
    var key = String(header).trim();
    return Object.prototype.hasOwnProperty.call(record, key) ? record[key] : '';
  });
}

// Optional column: submission deadline (YYYY-MM-DD) for D-day and reminders.
var EVALUATION_CYCLE_OPTIONAL_HEADERS = ['deadlineAt'];

function normalizeDeadline_(value) {
  if (value === null || value === undefined || value === '') { return ''; }
  if (Object.prototype.toString.call(value) === '[object Date]') {
    if (isNaN(value.getTime())) { return ''; }
    var y = value.getFullYear(), m = value.getMonth() + 1, d = value.getDate();
    return y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
  }
  var text = String(value).trim().slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '';
}

/** Whole days from `now` to the deadline date (negative when overdue). PURE. */
function daysUntilDeadline_(deadline, now) {
  var d = normalizeDeadline_(deadline);
  if (!d) { return null; }
  var ref = now ? new Date(now) : new Date();
  var parts = d.split('-');
  var end = Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  var today = Date.UTC(ref.getFullYear(), ref.getMonth(), ref.getDate());
  return Math.round((end - today) / 86400000);
}

function safeEvaluationCycleView_(cycle) {
  if (!cycle) { return null; }
  var C = EVALUATION_CYCLE_COLUMNS;
  var deadline = normalizeDeadline_(cycle.deadlineAt);
  return {
    cycleId: cycle[C.CYCLE_ID],
    period: cycle[C.PERIOD],
    phase: cycle[C.PHASE],
    status: cycle[C.STATUS],
    settingsVersion: Number(cycle[C.SETTINGS_VERSION]),
    deadlineAt: deadline,
    daysLeft: deadline ? daysUntilDeadline_(deadline) : null
  };
}

function resolveSettingsForCycleFromRecords_(cycle, settingsRecords) {
  var C = EVALUATION_CYCLE_COLUMNS;
  var stored = findSettingsById_(settingsRecords, cycle[C.SETTINGS_ID]);
  if (!stored) { throw new Error('운영에 연결된 평가 설정을 찾을 수 없습니다.'); }
  var verified = verifyFinalSettings_(stored);
  if (String(verified.period) !== String(cycle[C.PERIOD]) ||
      Number(verified.version) !== Number(cycle[C.SETTINGS_VERSION]) ||
      String(verified.settingsHash).toLowerCase() !== String(cycle[C.SETTINGS_HASH]).toLowerCase()) {
    throw new Error('평가 운영과 FINAL 설정의 바인딩 무결성 검증에 실패했습니다.');
  }
  return verified;
}

function resolveSettingsForCycle_(spreadsheet, cycle) {
  var settingsRecords = parseEvaluationSettingsValues_(
    getSettingsSheet_(spreadsheet).getDataRange().getValues(), true);
  return resolveSettingsForCycleFromRecords_(cycle, settingsRecords);
}

function sameSettingsBinding_(left, right) {
  var C = EVALUATION_CYCLE_COLUMNS;
  return !!left && !!right &&
    String(left[C.SETTINGS_ID]) === String(right[C.SETTINGS_ID]) &&
    Number(left[C.SETTINGS_VERSION]) === Number(right[C.SETTINGS_VERSION]) &&
    String(left[C.SETTINGS_HASH]).toLowerCase() === String(right[C.SETTINGS_HASH]).toLowerCase();
}

/** Verify phase submission metadata, frozen snapshot, and cycle FINAL binding. */
function assertPhaseSubmissionCycleBinding_(spreadsheet, submission, cycleRecords, settingsRecords) {
  var S = SUBMISSION_COLUMNS;
  var C = EVALUATION_CYCLE_COLUMNS;
  var phase = normalizeEvaluationPhase_(submission && submission[S.PHASE]);
  var cycleId = String(submission && submission[S.CYCLE_ID] || '').trim();
  if (!cycleId) { throw new Error('단계별 제출물에 cycleId가 없습니다.'); }
  var cycles = cycleRecords || readEvaluationCycles_(spreadsheet);
  assertUniqueEvaluationCycles_(cycles);
  var cycle = findEvaluationCycleById_(cycles, cycleId);
  if (!cycle) { throw new Error('제출물에 연결된 평가 운영을 찾을 수 없습니다.'); }
  if (String(cycle[C.PERIOD]) !== String(submission[S.PERIOD]) ||
      String(cycle[C.PHASE]) !== phase) {
    throw new Error('제출물과 평가 운영의 연도/단계가 일치하지 않습니다.');
  }
  var settings = settingsFromSubmissionSnapshot_(submission);
  if (String(submission[S.SETTINGS_ID]) !== String(cycle[C.SETTINGS_ID]) ||
      Number(submission[S.SETTINGS_VERSION]) !== Number(cycle[C.SETTINGS_VERSION]) ||
      String(submission[S.SETTINGS_HASH]).toLowerCase() !== String(cycle[C.SETTINGS_HASH]).toLowerCase() ||
      String(settings.settingsId) !== String(cycle[C.SETTINGS_ID]) ||
      Number(settings.version) !== Number(cycle[C.SETTINGS_VERSION])) {
    throw new Error('제출물의 동결 설정과 평가 운영 바인딩이 일치하지 않습니다.');
  }
  var cycleSettings = settingsRecords
    ? resolveSettingsForCycleFromRecords_(cycle, settingsRecords)
    : resolveSettingsForCycle_(spreadsheet, cycle);
  if (String(cycleSettings.settingsHash).toLowerCase() !== String(settings.settingsHash).toLowerCase()) {
    throw new Error('제출물과 운영 설정의 해시가 일치하지 않습니다.');
  }
  return { cycle: cycle, settings: settings };
}

function requirePhaseColumnsForCycleChecks_(headerRow) {
  var columns = resolveColumns_(headerRow || []);
  [SUBMISSION_COLUMNS.CYCLE_ID, SUBMISSION_COLUMNS.PHASE].forEach(function (header) {
    requireColumn_(columns, header, TAB_NAMES.SUBMISSIONS);
  });
  return columns;
}

function hasH2SubmissionForPeriod_(spreadsheet, period) {
  var sheet = spreadsheet.getSheetByName(TAB_NAMES.SUBMISSIONS);
  if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
  var values = sheet.getDataRange().getValues();
  requirePhaseColumnsForCycleChecks_(values[0] || []);
  var per = normalizeEvaluationPeriod_(period);
  return parseSubmissionValues_(values).some(function (submission) {
    return String(submission[SUBMISSION_COLUMNS.PERIOD]) === per &&
      String(submission[SUBMISSION_COLUMNS.PHASE]) === EVALUATION_CYCLES.PHASES.H2;
  });
}

function hasSettingsBoundCycleForPeriod_(spreadsheet, period) {
  var per = normalizeEvaluationPeriod_(period);
  var C = EVALUATION_CYCLE_COLUMNS;
  return readEvaluationCycles_(spreadsheet).some(function (cycle) {
    return String(cycle[C.PERIOD]) === per && String(cycle[C.SETTINGS_ID]).trim() !== '';
  });
}

function assertOpenEvaluationCycleLifecycle_(spreadsheet, cycle) {
  if (!cycle || cycle.status !== EVALUATION_CYCLES.STATUS.OPEN) {
    throw new Error('OPEN 평가 운영이 아닙니다.');
  }
  var records = readEvaluationCycles_(spreadsheet);
  var stored = findEvaluationCycleById_(records, cycle.cycleId);
  if (!stored || stored.status !== EVALUATION_CYCLES.STATUS.OPEN) {
    throw new Error('평가 운영 상태가 변경되었습니다.');
  }
  resolveSettingsForCycle_(spreadsheet, stored);
  // H1 may be reopened for controlled recovery after H2 is CLOSED. Existing
  // H2 submissions do not invalidate that OPEN H1; workflow state still
  // prevents in-flight or completed H1 rows from being edited.
  if (stored.phase === EVALUATION_CYCLES.PHASES.H2) {
    var h1 = findEvaluationCycle_(records, stored.period, EVALUATION_CYCLES.PHASES.H1);
    if (!h1 || h1.status !== EVALUATION_CYCLES.STATUS.CLOSED ||
        !sameSettingsBinding_(h1, stored)) {
      throw new Error('H2 OPEN 운영에는 CLOSED H1과 동일한 설정 바인딩이 필요합니다.');
    }
    resolveSettingsForCycle_(spreadsheet, h1);
  }
  return stored;
}

function listEvaluationCycles(period) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 평가 운영을 조회할 수 있습니다.');
  }
  var per = String(period || '').trim();
  if (per) { per = normalizeEvaluationPeriod_(per); }
  var records = readEvaluationCycles_(openHrSpreadsheet_()).filter(function (cycle) {
    return !per || String(cycle[EVALUATION_CYCLE_COLUMNS.PERIOD]) === per;
  });
  records.sort(function (a, b) {
    return String(b.period).localeCompare(String(a.period)) ||
      String(a.phase).localeCompare(String(b.phase));
  });
  return { period: per, cycles: records.map(function (record) {
    var copy = {};
    EVALUATION_CYCLE_HEADERS.forEach(function (header) { copy[header] = record[header]; });
    copy.deadlineAt = normalizeDeadline_(record.deadlineAt);
    copy.daysLeft = copy.deadlineAt ? daysUntilDeadline_(copy.deadlineAt) : null;
    return copy;
  }) };
}

/** Employee-safe status endpoint: no creator/opener/closer email is exposed. */
function getEvaluationCycleStatus(period) {
  requireCurrentUser_();
  var per = String(period || '').trim();
  if (per) { per = normalizeEvaluationPeriod_(per); }
  var ss = openHrSpreadsheet_();
  var cycle = getSingleOpenEvaluationCycle_(ss, per || null);
  if (cycle) { cycle = assertOpenEvaluationCycleLifecycle_(ss, cycle); }
  return { period: per, cycle: safeEvaluationCycleView_(cycle) };
}

function createCycleId_(records, period, phase) {
  for (var attempt = 0; attempt < 5; attempt++) {
    var id = 'CYCLE-' + period + '-' + phase + '-' + Utilities.getUuid().slice(0, 8);
    if (!findEvaluationCycleById_(records, id)) { return id; }
  }
  throw new Error('고유한 평가 운영 ID를 생성하지 못했습니다. 다시 시도하세요.');
}

function openEvaluationCycle(period, phase) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 평가 운영을 열 수 있습니다.');
  }
  var per = normalizeEvaluationPeriod_(period);
  var ph = normalizeEvaluationPhase_(phase);
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = getEvaluationCycleSheet_(ss);
    var values = sheet.getDataRange().getValues();
    requireEvaluationCycleColumns_(values[0] || []);
    var records = parseEvaluationCycleValues_(values, true);
    assertUniqueEvaluationCycles_(records);
    var globallyOpen = singleOpenCycleFromRecords_(records, null);
    var target = findEvaluationCycle_(records, per, ph);
    if (globallyOpen && (!target || globallyOpen.cycleId !== target.cycleId)) {
      throw new Error(globallyOpen.period + ' ' + globallyOpen.phase +
        ' 평가가 이미 OPEN입니다. 먼저 마감하세요.');
    }

    var settings;
    if (ph === EVALUATION_CYCLES.PHASES.H1) {
      // A controlled recovery reopens the existing authority row only after
      // any H2 OPEN cycle has been closed by the global guard above. Reuse and
      // re-verify its original FINAL binding; never select a newer setting.
      settings = target ? resolveSettingsForCycle_(ss, target)
        : getActiveFinalEvaluationSettings_(ss, per);
    } else {
      var h1Cycle = findEvaluationCycle_(records, per, EVALUATION_CYCLES.PHASES.H1);
      if (!h1Cycle || h1Cycle.status !== EVALUATION_CYCLES.STATUS.CLOSED) {
        throw new Error('상반기 평가 운영을 먼저 마감(CLOSED)한 뒤 하반기를 열어 주세요.');
      }
      settings = resolveSettingsForCycle_(ss, h1Cycle);
      if (target) {
        resolveSettingsForCycle_(ss, target);
        if (!sameSettingsBinding_(target, h1Cycle)) {
          throw new Error('H2 운영은 H1과 정확히 같은 평가 설정에 연결되어야 합니다.');
        }
      }
    }

    if (target && target.status === EVALUATION_CYCLES.STATUS.OPEN) {
      return { ok: true, alreadyOpen: true, cycle: safeEvaluationCycleView_(target) };
    }

    var now = new Date().toISOString();
    var C = EVALUATION_CYCLE_COLUMNS;
    if (!target) {
      target = {};
      EVALUATION_CYCLE_HEADERS.forEach(function (header) { target[header] = ''; });
      target[C.CYCLE_ID] = createCycleId_(records, per, ph);
      target[C.PERIOD] = per;
      target[C.PHASE] = ph;
      target[C.SETTINGS_ID] = settings.settingsId;
      target[C.SETTINGS_VERSION] = Number(settings.version);
      target[C.SETTINGS_HASH] = settings.settingsHash;
      target[C.CREATED_AT] = now;
      target[C.CREATED_BY] = entry.email;
    }
    target[C.STATUS] = EVALUATION_CYCLES.STATUS.OPEN;
    target[C.OPENED_AT] = now;
    target[C.OPENED_BY] = entry.email;
    target[C.CLOSED_AT] = '';
    target[C.CLOSED_BY] = '';
    target[C.UPDATED_AT] = now;
    target[C.UPDATED_BY] = entry.email;
    validateEvaluationCycleRecord_(target);
    var row = evaluationCycleToRow_(values[0], target);
    if (target._row) {
      sheet.getRange(target._row, 1, 1, row.length).setValues([row]);
    } else {
      sheet.appendRow(row);
    }
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email,
      action: AUDIT_ACTIONS.CYCLE_OPENED, targetType: 'CYCLE', targetId: target[C.CYCLE_ID],
      period: per, detail: { phase: ph, settingsVersion: Number(settings.version),
        settingsHash: settings.settingsHash }, nowIso: now }));
    return { ok: true, cycle: safeEvaluationCycleView_(target) };
  } finally {
    lock.releaseLock();
  }
}

function closeEvaluationCycle(cycleId) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 평가 운영을 마감할 수 있습니다.');
  }
  var id = String(cycleId || '').trim();
  if (!id) { throw new Error('마감할 cycleId가 지정되지 않았습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = getEvaluationCycleSheet_(ss);
    var values = sheet.getDataRange().getValues();
    requireEvaluationCycleColumns_(values[0] || []);
    var records = parseEvaluationCycleValues_(values, true);
    assertUniqueEvaluationCycles_(records);
    var globallyOpen = singleOpenCycleFromRecords_(records, null);
    var target = findEvaluationCycleById_(records, id);
    if (!target) { throw new Error('평가 운영을 찾을 수 없습니다.'); }
    if (target.status !== EVALUATION_CYCLES.STATUS.OPEN ||
        !globallyOpen || globallyOpen.cycleId !== target.cycleId) {
      throw new Error('현재 OPEN 상태인 평가 운영만 마감할 수 있습니다.');
    }
    resolveSettingsForCycle_(ss, target);
    var now = new Date().toISOString();
    target.status = EVALUATION_CYCLES.STATUS.CLOSED;
    target.closedAt = now;
    target.closedBy = entry.email;
    target.updatedAt = now;
    target.updatedBy = entry.email;
    validateEvaluationCycleRecord_(target);
    sheet.getRange(target._row, 1, 1, values[0].length).setValues([
      evaluationCycleToRow_(values[0], target)
    ]);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email,
      action: AUDIT_ACTIONS.CYCLE_CLOSED, targetType: 'CYCLE', targetId: target.cycleId,
      period: target.period, detail: { phase: target.phase }, nowIso: now }));
    return { ok: true, cycle: safeEvaluationCycleView_(target) };
  } finally {
    lock.releaseLock();
  }
}

/** HR: set/clear the submission deadline (YYYY-MM-DD) of a cycle. */
function setCycleDeadline(cycleId, deadline) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) { throw new Error('권한이 없습니다. 인사팀 관리자만 마감일을 설정할 수 있습니다.'); }
  var value = String(deadline || '').trim();
  if (value && !normalizeDeadline_(value)) { throw new Error('마감일은 YYYY-MM-DD 형식이어야 합니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = getEvaluationCycleSheet_(ss);
    var values = sheet.getDataRange().getValues();
    requireColumn_(requireEvaluationCycleColumns_(values[0] || []), 'deadlineAt', TAB_NAMES.EVALUATION_CYCLES);
    var records = parseEvaluationCycleValues_(values, true);
    var target = findEvaluationCycleById_(records, cycleId);
    if (!target) { throw new Error('평가 운영을 찾을 수 없습니다.'); }
    var now = new Date().toISOString();
    var before = normalizeDeadline_(target.deadlineAt);
    target.deadlineAt = value ? normalizeDeadline_(value) : '';
    target.updatedAt = now;
    target.updatedBy = entry.email;
    sheet.getRange(target._row, 1, 1, values[0].length).setValues([evaluationCycleToRow_(values[0], target)]);
    appendAuditLog_(ss, buildAuditLogRow_({ actorEmail: entry.email, action: 'CYCLE_DEADLINE_SET',
      targetType: 'CYCLE', targetId: target.cycleId, period: target.period,
      detail: { before: before, after: target.deadlineAt }, nowIso: now }));
    return { ok: true, cycle: safeEvaluationCycleView_(target) };
  } finally { lock.releaseLock(); }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    normalizeEvaluationPeriod_: normalizeEvaluationPeriod_,
    normalizeEvaluationPhase_: normalizeEvaluationPhase_,
    normalizeEvaluationCycleStatus_: normalizeEvaluationCycleStatus_,
    requireEvaluationCycleColumns_: requireEvaluationCycleColumns_,
    parseEvaluationCycleValues_: parseEvaluationCycleValues_,
    findEvaluationCycle_: findEvaluationCycle_,
    findEvaluationCycleById_: findEvaluationCycleById_,
    singleOpenCycleFromRecords_: singleOpenCycleFromRecords_,
    safeEvaluationCycleView_: safeEvaluationCycleView_,
    sameSettingsBinding_: sameSettingsBinding_,
    daysUntilDeadline_: daysUntilDeadline_,
    normalizeDeadline_: normalizeDeadline_
  };
}

// ===== Evaluations.gs =====
/**
 * Evaluations.gs
 * ---------------------------------------------------------------------------
 * Submission read/write for the employee self-evaluation flow, plus the HR
 * admin consolidated view. All privileged handlers re-derive identity from the
 * session (via Auth.gs) and authorize BEFORE any Sheet access. Client-supplied
 * identity is ignored for authorization.
 *
 * Pure, unit-testable logic is factored out:
 *  - parseSubmissionValues_ / findSubmission_  : parse + locate rows
 *  - sanitizeFormData_                         : whitelist client form fields
 *  - buildSubmissionRecord_                    : build the row a submit writes,
 *      snapshotting name/team/rank and REJECTING a mismatched target email
 *  - buildConsolidatedList_                    : join roster + submissions for HR
 * ---------------------------------------------------------------------------
 */

/**
 * The whitelisted self-assessment form fields a client may supply. Anything
 * else the browser sends is ignored (identity, status, stage, timestamps are
 * NEVER taken from the client).
 */
var COMPETENCY_DEFINITIONS = [

];

var EVAL_FORM_FIELDS = [
