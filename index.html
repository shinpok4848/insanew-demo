var H1_PHASE_FORM_FIELDS = [SUBMISSION_COLUMNS.H1_SELF_REVIEW];
var H2_PHASE_FORM_FIELDS = [
  SUBMISSION_COLUMNS.H2_SELF_REVIEW,
  SUBMISSION_COLUMNS.STRENGTHS,
  SUBMISSION_COLUMNS.IMPROVEMENTS,
  SUBMISSION_COLUMNS.GOALS,
  SUBMISSION_COLUMNS.SELF_SUMMARY
];
COMPETENCY_DEFINITIONS.forEach(function (item) {
  H2_PHASE_FORM_FIELDS.push(item.level, item.comment);
});

var SUBMISSION_TEXT_FIELDS = [
  SUBMISSION_COLUMNS.NAME_SNAPSHOT, SUBMISSION_COLUMNS.TEAM_SNAPSHOT,
  SUBMISSION_COLUMNS.RANK_SNAPSHOT, SUBMISSION_COLUMNS.ACHIEVEMENTS,
  SUBMISSION_COLUMNS.STRENGTHS, SUBMISSION_COLUMNS.IMPROVEMENTS,
  SUBMISSION_COLUMNS.GOALS, SUBMISSION_COLUMNS.H1_TEAM_GOAL_SNAPSHOT,
  SUBMISSION_COLUMNS.H1_SELF_REVIEW, SUBMISSION_COLUMNS.H2_TEAM_GOAL_SNAPSHOT,
  SUBMISSION_COLUMNS.H2_SELF_REVIEW, SUBMISSION_COLUMNS.SELF_SUMMARY,
  SUBMISSION_COLUMNS.H1_RESULT_GRADE_SNAPSHOT,
  SUBMISSION_COLUMNS.H1_RESULT_COMMENT_SNAPSHOT,
  SUBMISSION_COLUMNS.RESULT_COMMENT, SUBMISSION_COLUMNS.RESULT_RATING
];
COMPETENCY_DEFINITIONS.forEach(function (item) {
  SUBMISSION_TEXT_FIELDS.push(item.comment);
});
// Evaluator free text is also user input and gets the same literal cleanup.
SUBMISSION_TEXT_FIELDS.push(SUBMISSION_COLUMNS.FIRST_EVALUATION_COMMENT,
  SUBMISSION_COLUMNS.SECOND_EVALUATION_COMMENT);

/**
 * First stage for a new phase submission: 상위직급자 when the employee has a
 * distinct, non-auditor senior; otherwise 팀장. PURE.
 */
function initialStageForEntry_(entry, allEntries) {
  var chain = resolveApproverChainFromEntry_(entry, allEntries || []);
  var senior = chain[WORKFLOW.STAGES.SENIOR];
  return senior && senior !== chain[WORKFLOW.STAGES.TEAM_LEAD]
    ? WORKFLOW.STAGES.SENIOR : WORKFLOW.STAGES.TEAM_LEAD;
}

/** Refuse self-evaluation writes from a non-target (감사). */
function assertEvaluationTarget_(entry) {
  if (!isEvaluationTarget_(entry)) {
    throw new Error('감사는 인사평가 대상에서 제외되어 평가서를 제출할 수 없습니다.');
  }
  return true;
}

function valueOrBlank_(value) {
  return value === null || value === undefined ? '' : value;
}

/*
 * Formula-injection guard: a STRING beginning with = + - @ (or a tab/CR that
 * spreadsheet apps also treat as formula starters) is written with a leading
 * apostrophe so Sheets stores it as literal text. Numbers are untouched.
 */
var FORMULA_TRIGGER_RE = /^[=+\-@\t\r]/;
function sheetSafeCellValue_(value) {
  return typeof value === 'string' && FORMULA_TRIGGER_RE.test(value) ? "'" + value : value;
}

/* Real Sheets strips the input apostrophe; local fixtures may retain it. */
function cleanSheetLiteralText_(value) {
  var text = value === null || value === undefined ? '' : String(value);
  return text.charAt(0) === "'" && FORMULA_TRIGGER_RE.test(text.slice(1)) ? text.slice(1) : text;
}

function sanitizePhaseFormData_(phase, formData) {
  var ph = normalizeEvaluationPhase_(phase);
  var fields = ph === EVALUATION_CYCLES.PHASES.H1
    ? H1_PHASE_FORM_FIELDS : H2_PHASE_FORM_FIELDS;
  var source = formData || {};
  var clean = {};
  fields.forEach(function (field) {
    clean[field] = source[field] === null || source[field] === undefined
      ? '' : String(source[field]);
  });
  return clean;
}

// Every new Submissions header must exist before advanced submissions can be
// written. Reads remain tolerant so old rows/sheets can still be inspected.
var ADVANCED_REQUIRED_SUBMISSION_HEADERS = [
  SUBMISSION_COLUMNS.CYCLE_ID,
  SUBMISSION_COLUMNS.PHASE,
  SUBMISSION_COLUMNS.LINKED_H1_SUBMISSION_ID,
  SUBMISSION_COLUMNS.H1_RESULT_GRADE_SNAPSHOT,
  SUBMISSION_COLUMNS.H1_RESULT_COMMENT_SNAPSHOT,
  SUBMISSION_COLUMNS.H1_TEAM_GOAL_SNAPSHOT,
  SUBMISSION_COLUMNS.H1_SELF_REVIEW,
  SUBMISSION_COLUMNS.H2_TEAM_GOAL_SNAPSHOT,
  SUBMISSION_COLUMNS.H2_SELF_REVIEW,
  SUBMISSION_COLUMNS.SELF_SUMMARY,
  SUBMISSION_COLUMNS.PASSION_LEVEL,
  SUBMISSION_COLUMNS.PASSION_COMMENT,
  SUBMISSION_COLUMNS.TEAMWORK_LEVEL,
  SUBMISSION_COLUMNS.TEAMWORK_COMMENT,
  SUBMISSION_COLUMNS.RESPONSIBILITY_LEVEL,
  SUBMISSION_COLUMNS.RESPONSIBILITY_COMMENT,
  SUBMISSION_COLUMNS.SELF_DEVELOPMENT_LEVEL,
  SUBMISSION_COLUMNS.SELF_DEVELOPMENT_COMMENT,
  SUBMISSION_COLUMNS.PLANNING_LEVEL,
  SUBMISSION_COLUMNS.PLANNING_COMMENT,
  SUBMISSION_COLUMNS.PROCESS_MANAGEMENT_LEVEL,
  SUBMISSION_COLUMNS.PROCESS_MANAGEMENT_COMMENT,
  SUBMISSION_COLUMNS.EXECUTION_LEVEL,
  SUBMISSION_COLUMNS.EXECUTION_COMMENT,
  SUBMISSION_COLUMNS.PROBLEM_SOLVING_LEVEL,
  SUBMISSION_COLUMNS.PROBLEM_SOLVING_COMMENT,
  SUBMISSION_COLUMNS.DECISION_MAKING_LEVEL,
  SUBMISSION_COLUMNS.DECISION_MAKING_COMMENT,
  SUBMISSION_COLUMNS.COMMUNICATION_LEVEL,
  SUBMISSION_COLUMNS.COMMUNICATION_COMMENT,
  SUBMISSION_COLUMNS.COMPETENCY_AVERAGE_LEVEL,
  SUBMISSION_COLUMNS.COMPETENCY_SCORE,
  SUBMISSION_COLUMNS.SETTINGS_ID,
  SUBMISSION_COLUMNS.SETTINGS_VERSION,
  SUBMISSION_COLUMNS.SETTINGS_SNAPSHOT_JSON,
  SUBMISSION_COLUMNS.SETTINGS_HASH,
  SUBMISSION_COLUMNS.H1_SCORE,
  SUBMISSION_COLUMNS.H2_SCORE,
  SUBMISSION_COLUMNS.H1_WEIGHTED_SCORE,
  SUBMISSION_COLUMNS.H2_WEIGHTED_SCORE,
  SUBMISSION_COLUMNS.COMPETENCY_WEIGHTED_SCORE,
  SUBMISSION_COLUMNS.FINAL_SCORE,
  SUBMISSION_COLUMNS.CALCULATED_GRADE,
  SUBMISSION_COLUMNS.CALCULATED_AT,
  SUBMISSION_COLUMNS.CALCULATED_BY
];

/** Reduce arbitrary client data to the explicit employee-input whitelist. */
function sanitizeFormData_(formData) {
  var clean = {};
  var src = formData || {};
  EVAL_FORM_FIELDS.forEach(function (field) {
    var v = src[field];
    clean[field] = (v === null || v === undefined) ? '' : String(v);
  });
  return clean;
}

/**
 * Legacy-compatible wrapper around the configurable server calculation.
 * Runtime submissions always pass a frozen/active FINAL settings record to
 * calculateCompetencyWithSettings_; this wrapper retains the default mapping
 * for existing pure callers and legacy rows.
 */
function validateAndCalculateCompetency_(formData) {
  return calculateCompetencyWithSettings_(formData, defaultEvaluationSettings_('2026'));
}

/** Fail loudly if the live sheet cannot persist the advanced annual schema. */
function requireAdvancedSubmissionColumns_(headerRow) {
  var columns = resolveColumns_(headerRow || []);
  ADVANCED_REQUIRED_SUBMISSION_HEADERS.forEach(function (header) {
    requireColumn_(columns, header, TAB_NAMES.SUBMISSIONS);
  });
  return true;
}

/**
 * Parse the Submissions tab 2D array (row 0 = headers) into row objects that
 * also carry their 1-based sheet row number (`_row`) for in-place updates.
 * PURE, unit-testable.
 *
 * @param {Array<Array<*>>} values 2D array from getValues().
 * @return {Array<!Object>} Parsed submission records.
 */
function parseSubmissionValues_(values) {
  var out = [];
  if (!values || values.length < 1) {
    return out;
  }
  var cols = resolveColumns_(values[0]);
  var C = SUBMISSION_COLUMNS;
  // Resolve every known column that is present; required ones throw.
  var idxEmail = requireColumn_(cols, C.EMPLOYEE_EMAIL, TAB_NAMES.SUBMISSIONS);
  var idxPeriod = requireColumn_(cols, C.PERIOD, TAB_NAMES.SUBMISSIONS);
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (!row) {
      continue;
    }
    var rec = { _row: r + 1 };
    Object.keys(C).forEach(function (k) {
      var header = C[k];
      if (Object.prototype.hasOwnProperty.call(cols, header)) {
        var v = row[cols[header]];
        rec[header] = (v === undefined || v === null) ? '' : v;
      }
    });
    // normalize the keys we match on and clean any locally retained literal
    // apostrophe used to prevent formula interpretation on write.
    rec[C.EMPLOYEE_EMAIL] = normalizeEmail_(row[idxEmail]);
    rec[C.PERIOD] = row[idxPeriod] === undefined ? '' : String(row[idxPeriod]);
    SUBMISSION_TEXT_FIELDS.forEach(function (field) {
      if (Object.prototype.hasOwnProperty.call(rec, field)) {
        rec[field] = cleanSheetLiteralText_(rec[field]);
      }
    });
    out.push(rec);
  }
  return out;
}

/**
 * Whether a submit (회신) is allowed given the CURRENT state of an existing
 * submission row. PURE, unit-testable and the guard the resubmission deny-path
 * test asserts (removing it fails that test).
 *
 * SECURITY / DATA-INTEGRITY: a submit stamps status=SUBMITTED at 상위직급자, so
 * it MUST be refused once the submission has entered the approval chain
 * (SUBMITTED/IN_REVIEW) or completed (COMPLETED). Otherwise re-pressing 회신
 * would silently rewind an in-flight or completed chain back to stage 1 and
 * overwrite already-approved content. Only allow a submit when:
 *   - no row exists yet (first submission), or
 *   - the existing row is DRAFT (still being edited) or RETURNED (sent back for
 *     revision — resubmission re-enters at 상위직급자 per docs/DESIGN.md).
 *
 * @param {?Object} existing The existing submission record, or null.
 * @return {boolean} True only when a submit may proceed.
 */
function canSubmitOver_(existing) {
  if (!existing) {
    return true; // no row yet — first submission
  }
  var status = existing[SUBMISSION_COLUMNS.STATUS];
  var S = WORKFLOW.STATUS;
  return status === S.DRAFT || status === S.RETURNED ||
    status === '' || status === null || status === undefined;
}

/**
 * Whether a phase submit is allowed for an existing H1/H2 row. Unlike the
 * legacy annual guard, malformed phase rows with a blank or missing status
 * fail closed.
 *
 * @param {?Object} existing The existing phase submission record, or null.
 * @return {boolean} True only for no row, DRAFT, or RETURNED.
 */
function canSubmitPhaseOver_(existing) {
  if (!existing) {
    return true;
  }
  var status = existing[SUBMISSION_COLUMNS.STATUS];
  var S = WORKFLOW.STATUS;
  return status === S.DRAFT || status === S.RETURNED;
}

/**
 * Find a single submission by owner email + period. PURE, unit-testable.
 *
 * @param {Array<!Object>} records Parsed submission records.
 * @param {string} email Owner email.
 * @param {string} period Evaluation period.
 * @return {?Object} The matching record or null.
 */
function findSubmission_(records, email, period) {
  var key = normalizeEmail_(email);
  var per = String(period);
  var list = records || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i][SUBMISSION_COLUMNS.EMPLOYEE_EMAIL] === key &&
        String(list[i][SUBMISSION_COLUMNS.PERIOD]) === per &&
        String(list[i][SUBMISSION_COLUMNS.PHASE] || '').trim() === '') {
      return list[i];
    }
  }
  return null;
}

/** Find one phase row by email+year+phase; duplicate logical keys fail closed. */
function findPhaseSubmission_(records, email, period, phase) {
  var key = normalizeEmail_(email);
  var per = normalizeEvaluationPeriod_(period);
  var ph = normalizeEvaluationPhase_(phase);
  var C = SUBMISSION_COLUMNS;
  var matches = (records || []).filter(function (record) {
    return normalizeEmail_(record[C.EMPLOYEE_EMAIL]) === key &&
      String(record[C.PERIOD]) === per && String(record[C.PHASE]) === ph;
  });
  if (matches.length > 1) {
    throw new Error(per + ' ' + ph + ' 제출물이 중복되었습니다. 안전을 위해 처리를 중단했습니다.');
  }
  return matches.length ? matches[0] : null;
}

function findSubmissionById_(records, submissionId) {
  var id = String(submissionId || '').trim();
  var matches = (records || []).filter(function (record) {
    return String(record[SUBMISSION_COLUMNS.SUBMISSION_ID]) === id;
  });
  if (matches.length > 1) { throw new Error('중복 submissionId가 발견되었습니다: ' + id); }
  return matches.length ? matches[0] : null;
}

function assertUniquePhaseSubmissionTarget_(records, submission) {
  if (!submission) { throw new Error('단계별 제출물이 없습니다.'); }
  var C = SUBMISSION_COLUMNS;
  var phase = String(submission[C.PHASE] || '').trim();
  if (!phase) { return submission; }
  var unique = findPhaseSubmission_(records, submission[C.EMPLOYEE_EMAIL],
    submission[C.PERIOD], phase);
  if (!unique || String(unique[C.SUBMISSION_ID]) !== String(submission[C.SUBMISSION_ID])) {
    throw new Error('요청한 제출물이 고유한 직원/연도/단계 키와 일치하지 않습니다.');
  }
  return submission;
}

function assertUniquePhaseSubmissionKeys_(records, optionalPeriod) {
  var C = SUBMISSION_COLUMNS;
  var period = String(optionalPeriod || '').trim();
  var seen = {};
  (records || []).forEach(function (submission) {
    var phase = String(submission[C.PHASE] || '').trim();
    if (!phase || (period && String(submission[C.PERIOD]) !== period)) { return; }
    normalizeEvaluationPhase_(phase);
    var key = normalizeEmail_(submission[C.EMPLOYEE_EMAIL]) + '\u0000' +
      String(submission[C.PERIOD]) + '\u0000' + phase;
    if (Object.prototype.hasOwnProperty.call(seen, key)) {
      throw new Error('중복된 직원/연도/단계 제출물이 있어 처리를 중단했습니다.');
    }
    seen[key] = true;
  });
  return true;
}

function isLegacyAnnualSubmission_(submission) {
  return !!submission && String(submission[SUBMISSION_COLUMNS.PHASE] || '').trim() === '';
}

/**
 * Build the submission record to persist when an employee presses 회신. PURE,
 * unit-testable and the core security assertion of the submit path.
 *
 * SECURITY: `callerEmail` is the trusted, server-derived identity and is the
 * ONLY source of the row's employeeEmail and of the name/team/rank snapshot
 * (taken from the caller's own roster entry). If `targetEmail` (whatever the
 * client claims / whatever row was located) does not match the caller, this
 * THROWS — an employee can never write another person's row.
 *
 * @param {Object} params
 * @param {string} params.callerEmail Trusted caller email.
 * @param {!Object} params.rosterEntry The caller's own roster entry.
 * @param {?Object} params.existing Existing submission record or null.
 * @param {string} params.period Evaluation period.
 * @param {!Object} params.formData Sanitized form fields.
 * @param {Object=} params.settings Verified active FINAL settings. Optional only
 *     for legacy pure-helper callers that intentionally use default scoring.
 * @param {string} params.targetEmail The email the write targets (must equal
 *     caller). Modeling a mismatch here is exactly what the deny-path test
 *     exercises.
 * @param {string} params.nowIso ISO timestamp for the write.
 * @param {function():string} params.newId Factory for a new submission id.
 * @return {!Object} A record ready to write to the Submissions tab.
 */
function buildSubmissionRecord_(params) {
  var caller = normalizeEmail_(params.callerEmail);
  var target = normalizeEmail_(params.targetEmail);
  if (!caller) {
    throw new Error('인증된 사용자만 제출할 수 있습니다.');
  }
  // HARD DENY: refuse to write for anyone other than the caller.
  if (target !== caller) {
    throw new Error('본인의 평가서만 제출할 수 있습니다. (대상 불일치)');
  }
  if (!params.rosterEntry || normalizeEmail_(params.rosterEntry.email) !== caller) {
    throw new Error('본인의 평가서만 제출할 수 있습니다. (명단 불일치)');
  }
  var C = SUBMISSION_COLUMNS;
  var existing = params.existing;
  // STATE GUARD: refuse a submit once the submission has entered the approval
  // chain or completed. Only a missing/DRAFT/RETURNED row may be (re)submitted,
  // so re-pressing 회신 can never rewind an in-flight/completed chain to stage 1
  // or overwrite already-approved content.
  if (!canSubmitOver_(existing)) {
    throw new Error(
      '이미 결재가 진행 중이거나 완료된 평가서는 다시 제출할 수 없습니다. ' +
      '(현재 상태: ' + existing[C.STATUS] + ')');
  }
  var hasExistingSnapshot = !!(existing &&
    String(existing[C.SETTINGS_SNAPSHOT_JSON] || '').trim());
  // A persisted snapshot is authoritative. Verify it here as well as in the
  // handler so this record builder can never calculate with one policy while
  // carrying forward another policy's snapshot.
  var settings = hasExistingSnapshot
    ? settingsFromSubmissionSnapshot_(existing)
    : (params.settings || defaultEvaluationSettings_(params.period));
  var scores = calculateCompetencyWithSettings_(params.formData, settings);
  var rec = {};
  // Carry forward immutable identity fields, always re-derived from caller.
  rec[C.SUBMISSION_ID] = existing && existing[C.SUBMISSION_ID]
    ? existing[C.SUBMISSION_ID] : params.newId();
  rec[C.EMPLOYEE_EMAIL] = caller;
  rec[C.PERIOD] = String(params.period);
  // This original API is LEGACY_ANNUAL only. Phase rows are handled by
  // submitMyPhaseEvaluation and can never be targeted through this key.
  rec[C.CYCLE_ID] = '';
  rec[C.PHASE] = '';
  rec[C.LINKED_H1_SUBMISSION_ID] = '';
  rec[C.H1_RESULT_GRADE_SNAPSHOT] = '';
  rec[C.H1_RESULT_COMMENT_SNAPSHOT] = '';
  // Snapshot identity and optional team goals from the caller's roster row.
  rec[C.NAME_SNAPSHOT] = params.rosterEntry.name || '';
  rec[C.TEAM_SNAPSHOT] = params.rosterEntry.team || '';
  rec[C.RANK_SNAPSHOT] = params.rosterEntry.rank || '';
  rec[C.H1_TEAM_GOAL_SNAPSHOT] = params.rosterEntry.h1TeamGoal || '';
  rec[C.H2_TEAM_GOAL_SNAPSHOT] = params.rosterEntry.h2TeamGoal || '';

  // Advanced employee-owned form fields (already sanitized/whitelisted).
  rec[C.H1_SELF_REVIEW] = params.formData[C.H1_SELF_REVIEW] || '';
  rec[C.H2_SELF_REVIEW] = params.formData[C.H2_SELF_REVIEW] || '';
  rec[C.STRENGTHS] = params.formData[C.STRENGTHS] || '';
  rec[C.IMPROVEMENTS] = params.formData[C.IMPROVEMENTS] || '';
  rec[C.GOALS] = params.formData[C.GOALS] || '';
  rec[C.SELF_SUMMARY] = params.formData[C.SELF_SUMMARY] || '';
  COMPETENCY_DEFINITIONS.forEach(function (item) {
    rec[item.level] = String(params.formData[item.level]).trim();
    rec[item.comment] = params.formData[item.comment] || '';
  });
  // Never accept either calculated value from the client.
  rec[C.COMPETENCY_AVERAGE_LEVEL] = scores.averageLevel;
  rec[C.COMPETENCY_SCORE] = scores.score;

  // Freeze the server-selected FINAL settings on first submit. An existing
  // verified snapshot is preserved exactly; a legacy editable row whose
  // snapshot field is blank freezes the active FINAL supplied by the handler.
  if (hasExistingSnapshot) {
    rec[C.SETTINGS_ID] = existing[C.SETTINGS_ID];
    rec[C.SETTINGS_VERSION] = existing[C.SETTINGS_VERSION];
    rec[C.SETTINGS_SNAPSHOT_JSON] = existing[C.SETTINGS_SNAPSHOT_JSON];
    rec[C.SETTINGS_HASH] = existing[C.SETTINGS_HASH];
  } else if (params.settings) {
    rec[C.SETTINGS_ID] = settings.settingsId;
    rec[C.SETTINGS_VERSION] = Number(settings.version);
    rec[C.SETTINGS_SNAPSHOT_JSON] = finalizedSettingsSnapshotJson_(settings);
    rec[C.SETTINGS_HASH] = settings.settingsHash;
  }
  // Result calculation fields are server-owned and start blank.
  rec[C.H1_SCORE] = existing ? valueOrBlank_(existing[C.H1_SCORE]) : '';
  rec[C.H2_SCORE] = existing ? valueOrBlank_(existing[C.H2_SCORE]) : '';
  rec[C.H1_WEIGHTED_SCORE] = existing ? valueOrBlank_(existing[C.H1_WEIGHTED_SCORE]) : '';
  rec[C.H2_WEIGHTED_SCORE] = existing ? valueOrBlank_(existing[C.H2_WEIGHTED_SCORE]) : '';
  rec[C.COMPETENCY_WEIGHTED_SCORE] = existing
    ? valueOrBlank_(existing[C.COMPETENCY_WEIGHTED_SCORE]) : '';
  rec[C.FINAL_SCORE] = existing ? valueOrBlank_(existing[C.FINAL_SCORE]) : '';
  rec[C.CALCULATED_GRADE] = existing ? valueOrBlank_(existing[C.CALCULATED_GRADE]) : '';
  rec[C.CALCULATED_AT] = existing ? valueOrBlank_(existing[C.CALCULATED_AT]) : '';
  rec[C.CALCULATED_BY] = existing ? valueOrBlank_(existing[C.CALCULATED_BY]) : '';

  // Legacy compatibility fields remain populated for existing reports/readers.
  var reviews = [];
  if (rec[C.H1_SELF_REVIEW]) { reviews.push('[상반기]\n' + rec[C.H1_SELF_REVIEW]); }
  if (rec[C.H2_SELF_REVIEW]) { reviews.push('[하반기]\n' + rec[C.H2_SELF_REVIEW]); }
  rec[C.ACHIEVEMENTS] = reviews.join('\n\n');
  rec[C.SELF_RATING] = String(scores.score);
  // Workflow: 회신 -> SUBMITTED at the first stage.
  rec[C.STATUS] = WORKFLOW.STATUS.SUBMITTED;
  rec[C.CURRENT_STAGE] = WORKFLOW.STAGE_ORDER[0];
  // Preserve any prior result fields (untouched by an employee submit).
  rec[C.RESULT_COMMENT] = existing ? (existing[C.RESULT_COMMENT] || '') : '';
  rec[C.RESULT_RATING] = existing ? (existing[C.RESULT_RATING] || '') : '';
  rec[C.RESULT_SENT_AT] = existing ? (existing[C.RESULT_SENT_AT] || '') : '';
  // Timestamps.
  rec[C.CREATED_AT] = existing && existing[C.CREATED_AT]
    ? existing[C.CREATED_AT] : params.nowIso;
  rec[C.SUBMITTED_AT] = params.nowIso;
  rec[C.UPDATED_AT] = params.nowIso;
  rec[C.COMPLETED_AT] = existing ? (existing[C.COMPLETED_AT] || '') : '';
  return rec;
}

/**
 * Join the roster with submissions for a period into a consolidated list for
 * the HR view: every rostered evaluation target (auditors excluded) appears, with 제출/미제출 status and (if
 * submitted) the submission contents. PURE, unit-testable.
 *
 * @param {Array<!Object>} rosterEntries Parsed roster entries.
 * @param {Array<!Object>} submissionRecords Parsed submission records.
 * @param {string} period Evaluation period.
 * @return {Array<!Object>} One row per employee for the admin table.
 */
function buildConsolidatedList_(rosterEntries, submissionRecords, period) {
  var C = SUBMISSION_COLUMNS;
  var byEmail = {};
  (submissionRecords || []).forEach(function (rec) {
    if (String(rec[C.PERIOD]) === String(period) &&
        String(rec[C.PHASE] || '').trim() === '') {
      byEmail[rec[C.EMPLOYEE_EMAIL]] = rec;
    }
  });
  // 감사 (isAuditor=TRUE) is not an evaluation target and is not listed.
  return filterEvaluationTargets_(rosterEntries).map(function (e) {
    var sub = Object.prototype.hasOwnProperty.call(byEmail, e.email)
      ? byEmail[e.email] : null;
    return {
      email: e.email,
      employeeNumber: e.employeeNumber,
      name: e.name,
      team: e.team,
      rank: e.rank,
      submitted: !!sub,
      statusLabel: sub ? '제출' : '미제출',
      status: sub ? sub[C.STATUS] : '',
      currentStage: sub ? sub[C.CURRENT_STAGE] : '',
      submission: sub || null
    };
  });
}

/**
 * Serialize a submission record object into a row array matching the Sheet's
 * header order. Not pure (reads live headers), used only by writes.
 *
 * @param {Array<*>} headerRow The Submissions header row.
 * @param {!Object} record A record keyed by header name.
 * @return {Array<*>} Row array aligned to the headers.
 */
function recordToRow_(headerRow, record) {
  return headerRow.map(function (h) {
    var key = String(h).trim();
    var value = Object.prototype.hasOwnProperty.call(record, key) ? record[key] : '';
    return sheetSafeCellValue_(value);
  });
}

/**
 * Whether a submission is in a state where its final result (등급/의견) may be
 * entered. PURE, unit-testable. The result must be captured before HR mails it
 * out, so allow entry once the chain has COMPLETED and refuse anything else
 * (a DRAFT/SUBMITTED/IN_REVIEW/RETURNED submission has no final result yet).
 *
 * @param {?Object} submission The submission record, or null.
 * @return {boolean} True only for a COMPLETED submission.
 */
function canSetResult_(submission) {
  if (!submission) {
    return false;
  }
  return submission[SUBMISSION_COLUMNS.STATUS] === WORKFLOW.STATUS.COMPLETED;
}

/**
 * Build the result-field patch (resultRating/resultComment) to merge into a
 * submission row from HR-entered values, coerced to strings. PURE,
 * unit-testable. Only these two fields are produced; nothing else about the
 * submission (identity, workflow state, dispatch tracking) is touched.
 *
 * @param {*} rating The final grade/rating (untrusted DATA).
 * @param {*} comment The final comment (untrusted DATA).
 * @return {!Object} { resultRating, resultComment } as strings.
 */
function buildResultPatch_(rating, comment) {
  var C = SUBMISSION_COLUMNS;
  var patch = {};
  patch[C.RESULT_RATING] = (rating === null || rating === undefined)
    ? '' : String(rating);
  patch[C.RESULT_COMMENT] = (comment === null || comment === undefined)
    ? '' : String(comment);
  return patch;
}

// ---- Google-runtime handlers (called from the client) --------------------

/**
 * Return the caller's own roster info + their existing submission for a period
 * (if any). Creates nothing. Identity is server-derived; the `period` argument
 * is untrusted DATA only.
 *
 * @param {string} period Evaluation period, e.g. "2026".
 * @return {!Object} { employee: {...}, submission: {...}|null, period }.
 */
function getMyEvaluation(period) {
  var entry = requireCurrentUser_();
  var per = String(period || '');
  var ss = openHrSpreadsheet_();
  var subs = parseSubmissionValues_(readTabValues_(ss, TAB_NAMES.SUBMISSIONS));
  var existing = findSubmission_(subs, entry.email, per);
  // Defense in depth: never return a row the caller does not own.
  if (existing && !authorizeOwnSubmission(entry.email, {
    employeeEmail: existing[SUBMISSION_COLUMNS.EMPLOYEE_EMAIL]
  })) {
    existing = null;
  }
  var settings;
  if (existing && String(existing[SUBMISSION_COLUMNS.SETTINGS_SNAPSHOT_JSON] || '').trim()) {
    settings = settingsFromSubmissionSnapshot_(existing);
  } else if (canSubmitOver_(existing)) {
    // New evaluations and editable legacy rows must display the exact active
    // FINAL they will freeze on their first post-migration submit.
    settings = getActiveFinalEvaluationSettings_(ss, per);
  } else {
    // Do not retrofit historical or in-flight legacy rows. Their snapshot-less
    // display remains on the legacy mapping used before settings migration.
    settings = defaultEvaluationSettings_(per);
  }
  return {
    period: per,
    employee: {
      email: entry.email,
      employeeNumber: entry.employeeNumber,
      name: entry.name,
      team: entry.team,
      rank: entry.rank,
      h1TeamGoal: entry.h1TeamGoal || '',
      h2TeamGoal: entry.h2TeamGoal || ''
    },
    submission: existing,
    settings: displaySafeSettings_(settings)
  };
}

/**
 * Persist the caller's own self-evaluation (회신). Re-derives identity, writes
 * ONLY the caller's row, snapshots name/team/rank, sets status=SUBMITTED and
 * currentStage to the first stage, and guards the append/update with
 * LockService. The client cannot target another email.
 *
 * @param {string} period Evaluation period.
 * @param {Object} formData Untrusted client form fields (whitelisted).
 * @return {!Object} { ok: true, submission: {...} }.
 */
function submitMyEvaluation(period, formData) {
  var entry = requireCurrentUser_();
  assertEvaluationTarget_(entry);
  var per = String(period || '');
  if (!per) {
    throw new Error('평가 기간(period)이 지정되지 않았습니다.');
  }
  var clean = sanitizeFormData_(formData);

  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
    if (!sheet) {
      throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".');
    }
    var values = sheet.getDataRange().getValues();
    var headerRow = values[0];
    // Refuse the write rather than silently dropping annual fields when an
    // existing deployment has not yet completed the schema migration.
    requireAdvancedSubmissionColumns_(headerRow);
    var records = parseSubmissionValues_(values);
    var existing = findSubmission_(records, entry.email, per);
    // Preserve the existing resubmission guard before resolving any policy.
    if (!canSubmitOver_(existing)) {
      throw new Error(
        '이미 결재가 진행 중이거나 완료된 평가서는 다시 제출할 수 없습니다. ' +
        '(현재 상태: ' + existing[SUBMISSION_COLUMNS.STATUS] + ')');
    }
    var settings;
    if (existing && String(existing[SUBMISSION_COLUMNS.SETTINGS_SNAPSHOT_JSON] || '').trim()) {
      // Every snapshot-backed editable row, including RETURNED, keeps the exact
      // verified frozen policy.
      settings = settingsFromSubmissionSnapshot_(existing);
    } else {
      // First submits and editable legacy rows freeze the current active FINAL
      // while this submission lock prevents a concurrent policy replacement.
      settings = getActiveFinalEvaluationSettings_(ss, per);
    }

    var record = buildSubmissionRecord_({
      callerEmail: entry.email,
      rosterEntry: entry,
      existing: existing,
      period: per,
      formData: clean,
      settings: settings,
      // The write always targets the caller; passing caller here documents the
      // invariant and keeps parity with the deny-path unit test.
      targetEmail: entry.email,
      nowIso: new Date().toISOString(),
      newId: function () {
        return 'SUB-' + per.replace(/[^0-9A-Za-z]/g, '') + '-' +
          Utilities.getUuid().slice(0, 8);
      }
    });

    var rowArray = recordToRow_(headerRow, record);
    if (existing && existing._row) {
      sheet.getRange(existing._row, 1, 1, rowArray.length).setValues([rowArray]);
    } else {
      sheet.appendRow(rowArray);
    }
    return { ok: true, submission: record };
  } finally {
    lock.releaseLock();
  }
}

/**
 * HR admin consolidated view: all rostered employees with 제출/미제출 status and
 * (when submitted) contents for a period. Authorizes the caller is an HR admin
 * FIRST; non-admins get an authorization error.
 *
 * @param {string} period Evaluation period.
 * @return {!Object} { period, rows: [...] }.
 */
function getAllSubmissions(period) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 조회할 수 있습니다.');
  }
  var per = String(period || '');
  var ss = openHrSpreadsheet_();
  var rosterEntries = parseRosterValues_(readTabValues_(ss, TAB_NAMES.ROSTER));
  var subs = parseSubmissionValues_(readTabValues_(ss, TAB_NAMES.SUBMISSIONS));
  var rows = buildConsolidatedList_(rosterEntries, subs, per);
  rows.forEach(function (row) {
    if (!row.submission) { return; }
    var sub = row.submission;
    var safe = String(sub[SUBMISSION_COLUMNS.SETTINGS_SNAPSHOT_JSON] || '').trim()
      ? displaySafeSettings_(settingsFromSubmissionSnapshot_(sub))
      : displaySafeSettings_(defaultEvaluationSettings_(per));
    sub.calculationSettings = safe;
  });
  return { period: per, rows: rows };
}

/**
 * Set the final result (등급/의견) that will be emailed to the employee for a
 * COMPLETED submission. HR-admin-authorized: re-derives the caller from the
 * session and requires the HR-admin role BEFORE any Sheet access; client
 * identity is ignored. Only a COMPLETED submission is eligible (the result is
 * the outcome of the finished approval chain), and a submission whose result
 * email has already been sent (non-empty resultSentAt) is refused so a sent
 * result cannot be silently changed afterwards. Guarded by LockService.
 *
 * @param {string} submissionId The submission to annotate (untrusted DATA).
 * @param {string} rating The final grade/rating (untrusted DATA).
 * @param {string} comment The final comment (untrusted DATA).
 * @return {!Object} { ok, submissionId, resultRating, resultComment }.
 */
function setSubmissionResult(submissionId, rating, comment) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 결과를 입력할 수 있습니다.');
  }
  var id = String(submissionId || '');
  if (!id) {
    throw new Error('대상(submissionId)이 지정되지 않았습니다.');
  }

  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
    if (!sheet) {
      throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".');
    }
    var values = sheet.getDataRange().getValues();
    var headerRow = values[0];
    var records = parseSubmissionValues_(values);
    var C = SUBMISSION_COLUMNS;
    var sub = findSubmissionById_(records, id);
    if (!sub) {
      throw new Error('해당 제출물을 찾을 수 없습니다.');
    }
    if (!isLegacyAnnualSubmission_(sub)) {
      throw new Error('단계별 H1/H2 제출물은 레거시 수동 결과 기능으로 처리할 수 없습니다.');
    }
    if (!canSetResult_(sub)) {
      throw new Error('완료(COMPLETED)된 평가에만 결과를 입력할 수 있습니다.');
    }
    if (String(sub[C.SETTINGS_SNAPSHOT_JSON] || '').trim() ||
        String(sub[C.SETTINGS_ID] || '').trim() || String(sub[C.SETTINGS_HASH] || '').trim()) {
      throw new Error('설정 기반 평가는 수동 등급을 입력할 수 없습니다. 계산 결과 저장 기능을 사용하세요.');
    }
    var sentAt = sub[C.RESULT_SENT_AT];
    if (sentAt !== null && sentAt !== undefined && String(sentAt).trim() !== '') {
      throw new Error('이미 결과가 발송된 평가는 수정할 수 없습니다.');
    }

    var patch = buildResultPatch_(rating, comment);
    sub[C.RESULT_RATING] = patch[C.RESULT_RATING];
    sub[C.RESULT_COMMENT] = patch[C.RESULT_COMMENT];
    sub[C.UPDATED_AT] = new Date().toISOString();
    var rowArray = recordToRow_(headerRow, sub);
    sheet.getRange(sub._row, 1, 1, rowArray.length).setValues([rowArray]);

    return { ok: true, submissionId: id,
      resultRating: sub[C.RESULT_RATING], resultComment: sub[C.RESULT_COMMENT] };
  } finally {
    lock.releaseLock();
  }
}

/** Require every field needed for an authoritative calculated-result write. */
function requireCalculatedResultColumns_(headerRow) {
  var columns = resolveColumns_(headerRow || []);
  [
    SUBMISSION_COLUMNS.SETTINGS_ID,
    SUBMISSION_COLUMNS.SETTINGS_VERSION,
    SUBMISSION_COLUMNS.SETTINGS_SNAPSHOT_JSON,
    SUBMISSION_COLUMNS.SETTINGS_HASH,
    SUBMISSION_COLUMNS.H1_SCORE,
    SUBMISSION_COLUMNS.H2_SCORE,
    SUBMISSION_COLUMNS.H1_WEIGHTED_SCORE,
    SUBMISSION_COLUMNS.H2_WEIGHTED_SCORE,
    SUBMISSION_COLUMNS.COMPETENCY_WEIGHTED_SCORE,
    SUBMISSION_COLUMNS.FINAL_SCORE,
    SUBMISSION_COLUMNS.CALCULATED_GRADE,
    SUBMISSION_COLUMNS.CALCULATED_AT,
    SUBMISSION_COLUMNS.CALCULATED_BY,
    SUBMISSION_COLUMNS.RESULT_RATING,
    SUBMISSION_COLUMNS.RESULT_COMMENT,
    SUBMISSION_COLUMNS.RESULT_SENT_AT,
    SUBMISSION_COLUMNS.UPDATED_AT
  ].forEach(function (header) {
    requireColumn_(columns, header, TAB_NAMES.SUBMISSIONS);
  });
  return true;
}

/**
 * Calculate and persist an HR result from H1/H2 raw scores plus the frozen
 * competency/settings snapshot. Client-calculated scores, grades and weights
 * are never accepted.
 */
function calculateAndSetSubmissionResult(submissionId, h1Score, h2Score, resultComment) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 결과를 계산할 수 있습니다.');
  }
  var id = String(submissionId || '');
  if (!id) { throw new Error('대상(submissionId)이 지정되지 않았습니다.'); }

  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var sheet = openHrSpreadsheet_().getSheetByName(TAB_NAMES.SUBMISSIONS);
    if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
    var values = sheet.getDataRange().getValues();
    var headerRow = values[0] || [];
    requireCalculatedResultColumns_(headerRow);
    var records = parseSubmissionValues_(values);
    var C = SUBMISSION_COLUMNS;
    var sub = findSubmissionById_(records, id);
    if (!sub) { throw new Error('해당 제출물을 찾을 수 없습니다.'); }
    if (!isLegacyAnnualSubmission_(sub)) {
      throw new Error('단계별 H1/H2 제출물은 연간 전용 레거시 계산 기능으로 처리할 수 없습니다.');
    }
    if (!canSetResult_(sub)) { throw new Error('완료(COMPLETED)된 평가에만 결과를 입력할 수 있습니다.'); }
    if (String(sub[C.RESULT_SENT_AT] || '').trim()) { throw new Error('이미 결과가 발송된 평가는 수정할 수 없습니다.'); }

    var settings = settingsFromSubmissionSnapshot_(sub);
    var competency = calculateCompetencyWithSettings_(sub, settings);
    var result = calculateFinalResult_(h1Score, h2Score, competency.score, settings);
    var now = new Date().toISOString();
    sub[C.COMPETENCY_AVERAGE_LEVEL] = competency.averageLevel;
    sub[C.COMPETENCY_SCORE] = competency.score;
    sub[C.H1_SCORE] = rawComponentScore_(h1Score, '상반기 점수');
    sub[C.H2_SCORE] = rawComponentScore_(h2Score, '하반기 점수');
    sub[C.H1_WEIGHTED_SCORE] = result.contributions.h1;
    sub[C.H2_WEIGHTED_SCORE] = result.contributions.h2;
    sub[C.COMPETENCY_WEIGHTED_SCORE] = result.contributions.competency;
    sub[C.FINAL_SCORE] = result.finalScore;
    sub[C.CALCULATED_GRADE] = result.grade;
    sub[C.CALCULATED_AT] = now;
    sub[C.CALCULATED_BY] = entry.email;
    sub[C.RESULT_RATING] = result.grade;
    sub[C.RESULT_COMMENT] = resultComment === null || resultComment === undefined
      ? '' : String(resultComment);
    sub[C.UPDATED_AT] = now;
    sheet.getRange(sub._row, 1, 1, headerRow.length).setValues([
      recordToRow_(headerRow, sub)
    ]);
    return {
      ok: true, submissionId: id, competencyScore: competency.score,
      contributions: result.contributions, finalScore: result.finalScore,
      grade: result.grade, calculatedAt: now, calculatedBy: entry.email
    };
  } finally { lock.releaseLock(); }
}

// ---- Phase-aware H1/H2 flow ---------------------------------------------

function requirePhaseSubmissionColumns_(headerRow) {
  var columns = resolveColumns_(headerRow || []);
  Object.keys(SUBMISSION_COLUMNS).forEach(function (key) {
    var header = SUBMISSION_COLUMNS[key];
    // 1차/2차 evaluator columns are optional for reads so an unmigrated sheet
    // keeps working; every evaluator write calls requireEvaluatorColumns_.
    if (EVALUATOR_SUBMISSION_HEADERS.indexOf(header) !== -1) { return; }
    requireColumn_(columns, header, TAB_NAMES.SUBMISSIONS);
  });
  return columns;
}

function hasStoredValue_(value) {
  return value !== null && value !== undefined && String(value).trim() !== '';
}

function isValidStoredScore_(value) {
  if (!hasStoredValue_(value)) { return false; }
  var text = String(value).trim();
  if (!/^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(text)) { return false; }
  var number = Number(text);
  return isFinite(number) && number >= 0 && number <= 100;
}

function isFinalizedH1Submission_(submission) {
  var C = SUBMISSION_COLUMNS;
  return !!submission && submission[C.PHASE] === EVALUATION_CYCLES.PHASES.H1 &&
    submission[C.STATUS] === WORKFLOW.STATUS.COMPLETED &&
    isValidStoredScore_(submission[C.H1_SCORE]) &&
    hasStoredValue_(submission[C.CALCULATED_GRADE]) &&
    hasStoredValue_(submission[C.CALCULATED_AT]) &&
    hasStoredValue_(submission[C.CALCULATED_BY]) &&
    !hasStoredValue_(submission[C.RESULT_SENT_AT]);
}

/** Evaluator-produced H1 must be announced by HR before H2 starts. */
function isH1ResultReleased_(submission) {
  return !hasFirstEvaluation_(submission) ||
    hasStoredValue_(submission[SUBMISSION_COLUMNS.RESULT_NOTIFIED_AT]);
}

function requireFinalizedH1Submission_(submission) {
  if (!isFinalizedH1Submission_(submission)) {
    throw new Error('상반기 평가가 결재 완료되고 1차/2차 평가 결과까지 확정되어야 하반기를 진행할 수 있습니다.');
  }
  return submission;
}

/**
 * 1차 score → 1차 환산등급 using the 1차용 bands (gradeBandsRound1). Used for
 * the H1 score and for the H2 업적 score. PURE.
 */
function gradeForPhaseScore_(score, settings, label) {
  var rounded = roundWithSettings_(rawComponentScore_(score, label || '1차 평가 점수'), settings);
  var valid = canonicalizeEvaluationSettingsPayload_(settings, settings.period);
  var grade = gradeForBands_(rounded, valid.gradeBandsRound1);
  if (!grade) { throw new Error('점수에 해당하는 1차 등급 구간이 없습니다.'); }
  return { score: rounded, grade: grade };
}

/**
 * Round-1 (S/A/B+/B/C …) grade of a row: 2차 조정등급 when present, otherwise
 * the 1차 환산등급; legacy H1 rows fall back to calculatedGrade. H2's
 * calculatedGrade is the 최종 종합등급 and is never returned here. PURE.
 */
function round1GradeOf_(rec) {
  if (!rec) { return ''; }
  var C = SUBMISSION_COLUMNS;
  if (hasSecondEvaluation_(rec) && hasStoredValue_(rec[C.ADJUSTED_GRADE])) { return String(rec[C.ADJUSTED_GRADE]); }
  if (hasStoredValue_(rec[C.FIRST_EVALUATION_GRADE])) { return String(rec[C.FIRST_EVALUATION_GRADE]); }
  return String(rec[C.PHASE] || '') === EVALUATION_CYCLES.PHASES.H2 ? '' : String(rec[C.CALCULATED_GRADE] || '');
}

function assertMatchingPhaseSettings_(h1, h2) {
  var C = SUBMISSION_COLUMNS;
  if (!h1 || !h2 || normalizeEmail_(h1[C.EMPLOYEE_EMAIL]) !== normalizeEmail_(h2[C.EMPLOYEE_EMAIL]) ||
      String(h1[C.PERIOD]) !== String(h2[C.PERIOD])) {
    throw new Error('H1/H2 제출물의 소유자 또는 연도가 일치하지 않습니다.');
  }
  if (String(h1[C.SETTINGS_ID]) !== String(h2[C.SETTINGS_ID]) ||
      Number(h1[C.SETTINGS_VERSION]) !== Number(h2[C.SETTINGS_VERSION]) ||
      String(h1[C.SETTINGS_HASH]).toLowerCase() !== String(h2[C.SETTINGS_HASH]).toLowerCase() ||
      String(h1[C.SETTINGS_SNAPSHOT_JSON]) !== String(h2[C.SETTINGS_SNAPSHOT_JSON])) {
    throw new Error('H1/H2 제출물의 동결 평가 설정이 일치하지 않습니다.');
  }
  return true;
}

function assertH2LinkedToH1_(h1, h2) {
  var C = SUBMISSION_COLUMNS;
  requireFinalizedH1Submission_(h1);
  if (!h2 || h2[C.PHASE] !== EVALUATION_CYCLES.PHASES.H2) {
    throw new Error('유효한 H2 제출물이 아닙니다.');
  }
  assertMatchingPhaseSettings_(h1, h2);
  if (String(h2[C.LINKED_H1_SUBMISSION_ID]) !== String(h1[C.SUBMISSION_ID])) {
    throw new Error('H2 제출물의 H1 연결 ID가 일치하지 않습니다.');
  }
  if (!isValidStoredScore_(h2[C.H1_SCORE]) ||
      Number(h2[C.H1_SCORE]) !== Number(h1[C.H1_SCORE]) ||
      String(h2[C.H1_TEAM_GOAL_SNAPSHOT] || '') !== String(h1[C.H1_TEAM_GOAL_SNAPSHOT] || '') ||
      String(h2[C.H1_SELF_REVIEW] || '') !== String(h1[C.H1_SELF_REVIEW] || '') ||
      String(h2[C.H1_RESULT_GRADE_SNAPSHOT] || '') !== String(h1[C.CALCULATED_GRADE] || '') ||
      String(h2[C.H1_RESULT_COMMENT_SNAPSHOT] || '') !== String(h1[C.RESULT_COMMENT] || '')) {
    throw new Error('H2에 보관된 H1 내용/결과 스냅샷이 원본 H1과 일치하지 않습니다.');
  }
  return true;
}

function applyPhaseSettingsSnapshot_(record, existing, settings) {
  var C = SUBMISSION_COLUMNS;
  if (existing) {
    var frozen = settingsFromSubmissionSnapshot_(existing);
    if (String(frozen.settingsId) !== String(settings.settingsId) ||
        Number(frozen.version) !== Number(settings.version) ||
        String(frozen.settingsHash).toLowerCase() !== String(settings.settingsHash).toLowerCase()) {
      throw new Error('기존 제출물과 현재 평가 운영의 설정 바인딩이 일치하지 않습니다.');
    }
    record[C.SETTINGS_ID] = existing[C.SETTINGS_ID];
    record[C.SETTINGS_VERSION] = existing[C.SETTINGS_VERSION];
    record[C.SETTINGS_SNAPSHOT_JSON] = existing[C.SETTINGS_SNAPSHOT_JSON];
    record[C.SETTINGS_HASH] = existing[C.SETTINGS_HASH];
  } else {
    record[C.SETTINGS_ID] = settings.settingsId;
    record[C.SETTINGS_VERSION] = Number(settings.version);
    record[C.SETTINGS_SNAPSHOT_JSON] = finalizedSettingsSnapshotJson_(settings);
    record[C.SETTINGS_HASH] = settings.settingsHash;
  }
}

function buildPhaseSubmissionRecord_(params) {
  var caller = normalizeEmail_(params.callerEmail);
  if (!caller || !params.rosterEntry || normalizeEmail_(params.rosterEntry.email) !== caller) {
    throw new Error('본인의 평가서만 제출할 수 있습니다.');
  }
  var C = SUBMISSION_COLUMNS;
  var phase = normalizeEvaluationPhase_(params.phase);
  var period = normalizeEvaluationPeriod_(params.period);
  var existing = params.existing || null;
  if (!canSubmitPhaseOver_(existing)) {
    throw new Error('이미 결재가 진행 중이거나 완료된 평가서는 다시 제출할 수 없습니다.');
  }
  if (existing && (normalizeEmail_(existing[C.EMPLOYEE_EMAIL]) !== caller ||
      String(existing[C.PERIOD]) !== period || String(existing[C.PHASE]) !== phase ||
      String(existing[C.CYCLE_ID]) !== String(params.cycleId))) {
    throw new Error('기존 제출물의 소유자/연도/단계/운영 ID가 일치하지 않습니다.');
  }
  var record = {};
  Object.keys(C).forEach(function (key) { record[C[key]] = ''; });
  record[C.SUBMISSION_ID] = existing ? existing[C.SUBMISSION_ID] : params.newId();
  record[C.EMPLOYEE_EMAIL] = caller;
  record[C.PERIOD] = period;
  record[C.CYCLE_ID] = String(params.cycleId);
  record[C.PHASE] = phase;
  record[C.NAME_SNAPSHOT] = existing
    ? existing[C.NAME_SNAPSHOT] : (params.rosterEntry.name || '');
  record[C.TEAM_SNAPSHOT] = existing
    ? existing[C.TEAM_SNAPSHOT] : (params.rosterEntry.team || '');
  record[C.RANK_SNAPSHOT] = existing
    ? existing[C.RANK_SNAPSHOT] : (params.rosterEntry.rank || '');
  applyPhaseSettingsSnapshot_(record, existing, params.settings);

  if (phase === EVALUATION_CYCLES.PHASES.H1) {
    record[C.H1_TEAM_GOAL_SNAPSHOT] = existing
      ? existing[C.H1_TEAM_GOAL_SNAPSHOT] : (params.rosterEntry.h1TeamGoal || '');
    record[C.H1_SELF_REVIEW] = params.formData[C.H1_SELF_REVIEW] || '';
  } else {
    var h1 = requireFinalizedH1Submission_(params.h1Submission);
    record[C.LINKED_H1_SUBMISSION_ID] = h1[C.SUBMISSION_ID];
    record[C.H1_TEAM_GOAL_SNAPSHOT] = h1[C.H1_TEAM_GOAL_SNAPSHOT] || '';
    record[C.H1_SELF_REVIEW] = h1[C.H1_SELF_REVIEW] || '';
    record[C.H1_SCORE] = valueOrBlank_(h1[C.H1_SCORE]);
    record[C.H1_RESULT_GRADE_SNAPSHOT] = h1[C.CALCULATED_GRADE] || '';
    record[C.H1_RESULT_COMMENT_SNAPSHOT] = h1[C.RESULT_COMMENT] || '';
    record[C.H2_TEAM_GOAL_SNAPSHOT] = existing
      ? existing[C.H2_TEAM_GOAL_SNAPSHOT] : (params.rosterEntry.h2TeamGoal || '');
    record[C.H2_SELF_REVIEW] = params.formData[C.H2_SELF_REVIEW] || '';
    record[C.STRENGTHS] = params.formData[C.STRENGTHS] || '';
    record[C.IMPROVEMENTS] = params.formData[C.IMPROVEMENTS] || '';
    record[C.GOALS] = params.formData[C.GOALS] || '';
    record[C.SELF_SUMMARY] = params.formData[C.SELF_SUMMARY] || '';
    COMPETENCY_DEFINITIONS.forEach(function (item) {
      record[item.level] = String(params.formData[item.level] || '').trim();
      record[item.comment] = params.formData[item.comment] || '';
    });
    var competency = calculateCompetencyWithSettings_(record, params.settings);
    record[C.COMPETENCY_AVERAGE_LEVEL] = competency.averageLevel;
    record[C.COMPETENCY_SCORE] = competency.score;
    record[C.SELF_RATING] = String(competency.score);
    var reviewParts = [];
    if (record[C.H1_SELF_REVIEW]) { reviewParts.push('[상반기]\n' + record[C.H1_SELF_REVIEW]); }
    if (record[C.H2_SELF_REVIEW]) { reviewParts.push('[하반기]\n' + record[C.H2_SELF_REVIEW]); }
    record[C.ACHIEVEMENTS] = reviewParts.join('\n\n');
  }

  record[C.STATUS] = WORKFLOW.STATUS.SUBMITTED;
  // 상위직급자 is optional: with no distinct senior the row starts at 팀장.
  record[C.CURRENT_STAGE] = params.initialStage || WORKFLOW.STAGE_ORDER[0];
  record[C.CREATED_AT] = existing && existing[C.CREATED_AT]
    ? existing[C.CREATED_AT] : params.nowIso;
  record[C.SUBMITTED_AT] = params.nowIso;
  record[C.UPDATED_AT] = params.nowIso;
  return record;
}

function employeePhaseSubmissionView_(submission, includeInFlightEvaluation) {
  if (!submission) { return null; }
  var C = SUBMISSION_COLUMNS;
  var phase = normalizeEvaluationPhase_(submission[C.PHASE]);
  // The 1차/2차 evaluators write H1 score/grade/comment mid-chain. Employees see
  // their H1 result only once the chain is COMPLETED (formerly: HR finalize).
  // Evaluator-produced H1 results appear only after HR's 결과 안내; legacy
  // HR-finalized rows keep their previous visibility (COMPLETED).
  var hideH1Result = !includeInFlightEvaluation && phase === EVALUATION_CYCLES.PHASES.H1 &&
    (submission[C.STATUS] !== WORKFLOW.STATUS.COMPLETED ||
     (hasFirstEvaluation_(submission) && !hasStoredValue_(submission[C.RESULT_NOTIFIED_AT])));
  var view = {
    submissionId: submission[C.SUBMISSION_ID], cycleId: submission[C.CYCLE_ID],
    period: submission[C.PERIOD], phase: phase, status: submission[C.STATUS],
    currentStage: normalizeWorkflowStage_(submission[C.CURRENT_STAGE]),
    legacyStage: isLegacyWorkflowStage_(submission[C.CURRENT_STAGE]),
    h1TeamGoalSnapshot: submission[C.H1_TEAM_GOAL_SNAPSHOT],
    h1SelfReview: submission[C.H1_SELF_REVIEW],
    h1Score: phase === EVALUATION_CYCLES.PHASES.H1
      ? valueOrBlank_(submission[C.H1_SCORE]) : valueOrBlank_(submission[C.H1_SCORE]),
    h1ResultGrade: phase === EVALUATION_CYCLES.PHASES.H1
      ? submission[C.CALCULATED_GRADE] : submission[C.H1_RESULT_GRADE_SNAPSHOT],
    h1ResultComment: phase === EVALUATION_CYCLES.PHASES.H1
      ? submission[C.RESULT_COMMENT] : submission[C.H1_RESULT_COMMENT_SNAPSHOT],
    calculatedAt: phase === EVALUATION_CYCLES.PHASES.H1
      ? submission[C.CALCULATED_AT] : '',
    submittedAt: submission[C.SUBMITTED_AT], completedAt: submission[C.COMPLETED_AT]
  };
  if (hideH1Result) {
    view.h1Score = '';
    view.h1ResultGrade = '';
    view.h1ResultComment = '';
    view.calculatedAt = '';
  }
  if (phase === EVALUATION_CYCLES.PHASES.H2) {
    view.linkedH1SubmissionId = submission[C.LINKED_H1_SUBMISSION_ID];
    view.h2TeamGoalSnapshot = submission[C.H2_TEAM_GOAL_SNAPSHOT];
    view.h2SelfReview = submission[C.H2_SELF_REVIEW];
    view.strengths = submission[C.STRENGTHS];
    view.improvements = submission[C.IMPROVEMENTS];
    view.goals = submission[C.GOALS];
    view.selfSummary = submission[C.SELF_SUMMARY];
    view.competencyAverageLevel = valueOrBlank_(submission[C.COMPETENCY_AVERAGE_LEVEL]);
    view.competencyScore = valueOrBlank_(submission[C.COMPETENCY_SCORE]);
    COMPETENCY_DEFINITIONS.forEach(function (item) {
      view[item.level] = submission[item.level];
      view[item.comment] = submission[item.comment];
    });
  }
  return view;
}

function adminPhaseSubmissionView_(submission) {
  if (!submission) { return null; }
  var view = employeePhaseSubmissionView_(submission, true);
  var C = SUBMISSION_COLUMNS;
  [C.H2_SCORE, C.H1_WEIGHTED_SCORE, C.H2_WEIGHTED_SCORE,
    C.COMPETENCY_WEIGHTED_SCORE, C.FINAL_SCORE, C.CALCULATED_GRADE,
    C.CALCULATED_AT, C.CALCULATED_BY, C.RESULT_COMMENT, C.RESULT_RATING,
    C.RESULT_SENT_AT, C.SETTINGS_ID, C.SETTINGS_VERSION].concat(
    EVALUATOR_SUBMISSION_HEADERS).forEach(function (field) {
    view[field] = valueOrBlank_(submission[field]);
  });
  view.hasFirstEvaluation = hasFirstEvaluation_(submission);
  view.hasSecondEvaluation = hasSecondEvaluation_(submission);
  return view;
}

function buildCombinedAnnualResult_(h1, h2, requireReleased) {
  var C = SUBMISSION_COLUMNS;
  assertH2LinkedToH1_(h1, h2);
  if (h2[C.STATUS] !== WORKFLOW.STATUS.COMPLETED ||
      !hasStoredValue_(h2[C.CALCULATED_AT]) || !hasStoredValue_(h2[C.CALCULATED_BY]) ||
      !hasStoredValue_(h2[C.CALCULATED_GRADE]) ||
      String(h2[C.RESULT_RATING] || '') !== String(h2[C.CALCULATED_GRADE] || '')) {
    throw new Error('확정된 H2 연간 결과가 없습니다.');
  }
  if (requireReleased && !hasStoredValue_(h2[C.RESULT_SENT_AT])) {
    throw new Error('연간 평가 결과가 아직 직원에게 공개되지 않았습니다.');
  }
  var settings = settingsFromSubmissionSnapshot_(h2);
  var h1PhaseResult = gradeForPhaseScore_(h1[C.H1_SCORE], settings);
  // A 2차 evaluator may have shifted the H1 grade by ±1; legacy rows have a
  // blank adjustment (0).
  var h1Adjustment = parseGradeAdjustment_(h1[C.GRADE_ADJUSTMENT]);
  var h1ExpectedGrade = shiftGrade_(h1PhaseResult.grade, h1Adjustment, settings);
  if (Number(h1[C.H1_SCORE]) !== Number(h1PhaseResult.score) ||
      String(h1[C.CALCULATED_GRADE]) !== String(h1ExpectedGrade) ||
      (hasStoredValue_(h1[C.FIRST_EVALUATION_GRADE]) &&
       String(h1[C.FIRST_EVALUATION_GRADE]) !== String(h1PhaseResult.grade))) {
    throw new Error('저장된 H1 결과 무결성 검증에 실패했습니다.');
  }
  var competency = calculateCompetencyWithSettings_(h2, settings);
  if (Number(h2[C.COMPETENCY_SCORE]) !== Number(competency.score) ||
      Number(h2[C.COMPETENCY_AVERAGE_LEVEL]) !== Number(competency.averageLevel)) {
    throw new Error('저장된 역량 점수 무결성 검증에 실패했습니다.');
  }
  // 최종 종합등급 = 최종용 bands on the composite score (never shifted).
  var calculated = calculateFinalResult_(h1[C.H1_SCORE], h2[C.H2_SCORE], competency.score, settings);
  var finalGrade = calculated.grade;
  // H2 업적: 1차 환산등급 (1차용 bands) and the 2차 ±1 조정등급 on that ladder.
  var h2Adjustment = parseGradeAdjustment_(h2[C.GRADE_ADJUSTMENT]);
  var h2FirstGrade = '';
  var h2Grade = '';
  if (hasFirstEvaluation_(h2)) {
    h2FirstGrade = gradeForPhaseScore_(h2[C.H2_SCORE], settings, '하반기 점수').grade;
    h2Grade = shiftGrade_(h2FirstGrade, h2Adjustment, settings);
    if (String(h2[C.FIRST_EVALUATION_GRADE]) !== h2FirstGrade ||
        (hasSecondEvaluation_(h2) && String(h2[C.ADJUSTED_GRADE]) !== h2Grade)) {
      throw new Error('저장된 H2 1차/2차 등급 무결성 검증에 실패했습니다.');
    }
  } else if (h2Adjustment !== 0) {
    throw new Error('1차 평가 기록이 없는 H2에 등급 조정이 있습니다.');
  }
  if (Number(h2[C.H1_WEIGHTED_SCORE]) !== Number(calculated.contributions.h1) ||
      Number(h2[C.H2_WEIGHTED_SCORE]) !== Number(calculated.contributions.h2) ||
      Number(h2[C.COMPETENCY_WEIGHTED_SCORE]) !== Number(calculated.contributions.competency) ||
      Number(h2[C.FINAL_SCORE]) !== Number(calculated.finalScore) ||
      String(h2[C.CALCULATED_GRADE]) !== String(finalGrade)) {
    throw new Error('저장된 연간 계산 결과 무결성 검증에 실패했습니다.');
  }
  return {
    period: h2[C.PERIOD],
    employee: {
      name: h2[C.NAME_SNAPSHOT], team: h2[C.TEAM_SNAPSHOT],
      rank: h2[C.RANK_SNAPSHOT]
    },
    settings: displaySafeSettings_(settings),
    h1: {
      teamGoal: h1[C.H1_TEAM_GOAL_SNAPSHOT], review: h1[C.H1_SELF_REVIEW],
      score: Number(h1[C.H1_SCORE]), grade: h1[C.CALCULATED_GRADE],
      firstGrade: h1PhaseResult.grade, gradeAdjustment: h1Adjustment,
      comment: h1[C.RESULT_COMMENT]
    },
    h2: {
      teamGoal: h2[C.H2_TEAM_GOAL_SNAPSHOT], review: h2[C.H2_SELF_REVIEW],
      score: Number(h2[C.H2_SCORE]), firstGrade: h2FirstGrade,
      gradeAdjustment: h2Adjustment, grade: h2Grade
    },
    annualNarrative: {
      strengths: h2[C.STRENGTHS], improvements: h2[C.IMPROVEMENTS],
      goals: h2[C.GOALS], selfSummary: h2[C.SELF_SUMMARY]
    },
    competencies: COMPETENCY_DEFINITIONS.map(function (item) {
      return { key: item.key, name: item.name, level: h2[item.level], comment: h2[item.comment] };
    }),
    competencyAverageLevel: competency.averageLevel,
    competencyScore: competency.score,
    contributions: calculated.contributions,
    finalScore: calculated.finalScore,
    finalGrade: finalGrade,
    finalComment: h2[C.RESULT_COMMENT],
    releasedAt: h2[C.RESULT_SENT_AT] || ''
  };
}

function buildEmployeeAnnualResult_(h1, h2) {
  return buildCombinedAnnualResult_(h1, h2, true);
}

function h1Eligibility_(h1) {
  if (!h1) {
    return { eligible: false, finalized: false,
      blockReason: '상반기 제출·결재 및 결과 확정 이력이 없어 하반기 평가를 작성할 수 없습니다. 인사팀에 문의하세요.' };
  }
  if (h1[SUBMISSION_COLUMNS.STATUS] !== WORKFLOW.STATUS.COMPLETED) {
    return { eligible: false, finalized: false,
      blockReason: '상반기 평가 결재가 완료되지 않아 하반기 평가를 작성할 수 없습니다.' };
  }
  if (!isFinalizedH1Submission_(h1)) {
    return { eligible: false, finalized: false,
      blockReason: '상반기 결과(1차/2차 평가)가 아직 확정되지 않아 하반기 평가를 작성할 수 없습니다.' };
  }
  if (!isH1ResultReleased_(h1)) {
    return { eligible: false, finalized: true,
      blockReason: '상반기 결과가 아직 인사팀에서 안내되지 않아 하반기 평가를 작성할 수 없습니다.' };
  }
  return { eligible: true, finalized: true, blockReason: '' };
}

function collectPhasePeriods_(submissionRecords, cycleRecords, settingsRecords,
    optionalOwnerEmail, requestedPeriod) {
  var C = SUBMISSION_COLUMNS;
  var owner = optionalOwnerEmail ? normalizeEmail_(optionalOwnerEmail) : '';
  var seen = {};
  function add(value) {
    var period = String(value || '').trim();
    if (/^\d{4}$/.test(period)) { seen[period] = true; }
  }
  add(requestedPeriod);
  (submissionRecords || []).forEach(function (submission) {
    var phase = String(submission[C.PHASE] || '').trim();
    if ((phase === EVALUATION_CYCLES.PHASES.H1 ||
         phase === EVALUATION_CYCLES.PHASES.H2) &&
        (!owner || normalizeEmail_(submission[C.EMPLOYEE_EMAIL]) === owner)) {
      add(submission[C.PERIOD]);
    }
  });
  (cycleRecords || []).forEach(function (cycle) { add(cycle.period); });
  (settingsRecords || []).forEach(function (settings) {
    if (settings.status === EVALUATION_SETTINGS.STATUS.FINAL) { add(settings.period); }
  });
  return Object.keys(seen).sort(function (a, b) { return Number(b) - Number(a); });
}

function choosePhasePeriod_(requestedPeriod, globallyOpen, availablePeriods) {
  var requested = String(requestedPeriod || '').trim();
  if (requested) { return normalizeEvaluationPeriod_(requested); }
  if (globallyOpen) { return globallyOpen.period; }
  if (availablePeriods && availablePeriods.length) { return availablePeriods[0]; }
  return String(new Date().getFullYear());
}

function getMyPhaseEvaluation(period) {
  var entry = requireCurrentUser_();
  var ss = openHrSpreadsheet_();
  var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
  if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
  var values = sheet.getDataRange().getValues();
  requirePhaseSubmissionColumns_(values[0] || []);
  var records = parseSubmissionValues_(values);
  var cycleRecords = readEvaluationCycles_(ss);
  var settingsRecords = parseEvaluationSettingsValues_(
    getSettingsSheet_(ss).getDataRange().getValues(), true);
  var globallyOpen = singleOpenCycleFromRecords_(cycleRecords, null);
  var availablePeriods = collectPhasePeriods_(records, cycleRecords,
    settingsRecords, entry.email, period);
  var per = choosePhasePeriod_(period, globallyOpen, availablePeriods);
  if (availablePeriods.indexOf(per) === -1) {
    availablePeriods.push(per);
    availablePeriods.sort(function (a, b) { return Number(b) - Number(a); });
  }
  assertUniquePhaseSubmissionKeys_(records, per);
  var openCycle = globallyOpen && globallyOpen.period === per ? globallyOpen : null;
  if (openCycle) { openCycle = assertOpenEvaluationCycleLifecycle_(ss, openCycle); }
  var h1 = findPhaseSubmission_(records, entry.email, per, EVALUATION_CYCLES.PHASES.H1);
  var h2 = findPhaseSubmission_(records, entry.email, per, EVALUATION_CYCLES.PHASES.H2);
  if (h1) {
    assertPhaseSubmissionCycleBinding_(ss, h1, cycleRecords, settingsRecords);
  }
  if (h2) {
    assertPhaseSubmissionCycleBinding_(ss, h2, cycleRecords, settingsRecords);
    assertH2LinkedToH1_(h1, h2);
  }
  var settings;
  if (h2) { settings = settingsFromSubmissionSnapshot_(h2); }
  else if (h1) { settings = settingsFromSubmissionSnapshot_(h1); }
  else if (openCycle) { settings = resolveSettingsForCycleFromRecords_(openCycle, settingsRecords); }
  else {
    var periodCycle = findEvaluationCycle_(cycleRecords, per, EVALUATION_CYCLES.PHASES.H2) ||
      findEvaluationCycle_(cycleRecords, per, EVALUATION_CYCLES.PHASES.H1);
    settings = periodCycle
      ? resolveSettingsForCycleFromRecords_(periodCycle, settingsRecords)
      : getActiveFinalEvaluationSettings_(ss, per);
  }
  var eligibility = h1Eligibility_(h1);
  var editablePhase = openCycle ? openCycle.phase : '';
  var phaseRow = editablePhase === EVALUATION_CYCLES.PHASES.H1 ? h1 : h2;
  var excluded = !isEvaluationTarget_(entry);
  var canEdit = !excluded && !!openCycle && canSubmitPhaseOver_(phaseRow) &&
    (editablePhase !== EVALUATION_CYCLES.PHASES.H2 || eligibility.eligible);
  return {
    period: per,
    availablePeriods: availablePeriods,
    employee: {
      email: entry.email, employeeNumber: entry.employeeNumber,
      name: entry.name, team: entry.team, rank: entry.rank,
      h1TeamGoal: entry.h1TeamGoal || '', h2TeamGoal: entry.h2TeamGoal || ''
    },
    cycle: safeEvaluationCycleView_(openCycle),
    editablePhase: editablePhase,
    canEdit: canEdit,
    evaluationExcluded: excluded,
    exclusionReason: excluded ? '감사는 인사평가 대상 및 결재 체인에서 제외됩니다.' : '',
    approvalChain: WORKFLOW.STAGE_ORDER.slice(),
    settings: displaySafeSettings_(settings),
    h1Eligibility: eligibility,
    h1: employeePhaseSubmissionView_(h1),
    h2: employeePhaseSubmissionView_(h2),
    // Step labels only (no scores) so the employee can follow the batch flow.
    progress: { h1: memberProgress_(h1), h2: memberProgress_(h2) },
    trend: growthTrend_(records, entry.email),
    annualResult: h2 && hasStoredValue_(h2[SUBMISSION_COLUMNS.RESULT_SENT_AT])
      ? buildEmployeeAnnualResult_(h1, h2) : null
  };
}

function submitMyPhaseEvaluation(cycleId, formData) {
  var entry = requireCurrentUser_();
  assertEvaluationTarget_(entry);
  var token = String(cycleId || '').trim();
  if (!token) { throw new Error('평가 운영 토큰(cycleId)이 없습니다. 화면을 새로고침하세요.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var cycle = getSingleOpenEvaluationCycle_(ss, null);
    if (!cycle || String(cycle.cycleId) !== token) {
      throw new Error('평가 운영 상태가 변경되었습니다. 화면을 새로고침한 뒤 다시 확인하세요.');
    }
    cycle = assertOpenEvaluationCycleLifecycle_(ss, cycle);
    var phase = normalizeEvaluationPhase_(cycle.phase);
    var period = normalizeEvaluationPeriod_(cycle.period);
    var settings = resolveSettingsForCycle_(ss, cycle);
    var clean = sanitizePhaseFormData_(phase, formData);
    var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
    if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
    var values = sheet.getDataRange().getValues();
    requirePhaseSubmissionColumns_(values[0] || []);
    var records = parseSubmissionValues_(values);
    var existing = findPhaseSubmission_(records, entry.email, period, phase);
    if (!canSubmitPhaseOver_(existing)) {
      throw new Error('이미 결재가 진행 중이거나 완료된 평가서는 다시 제출할 수 없습니다.');
    }
    if (existing) {
      if (String(existing[SUBMISSION_COLUMNS.CYCLE_ID]) !== token) {
        throw new Error('기존 제출물의 평가 운영 ID가 현재 OPEN 운영과 일치하지 않습니다.');
      }
      assertPhaseSubmissionCycleBinding_(ss, existing);
    }
    var h1 = null;
    if (phase === EVALUATION_CYCLES.PHASES.H2) {
      h1 = findPhaseSubmission_(records, entry.email, period, EVALUATION_CYCLES.PHASES.H1);
      requireFinalizedH1Submission_(h1);
      if (!existing && !isH1ResultReleased_(h1)) {
        throw new Error('상반기 결과가 아직 안내되지 않아 하반기 평가를 제출할 수 없습니다.');
      }
      assertPhaseSubmissionCycleBinding_(ss, h1);
      if (existing) { assertH2LinkedToH1_(h1, existing); }
    }
    var now = new Date().toISOString();
    var record = buildPhaseSubmissionRecord_({
      callerEmail: entry.email, rosterEntry: entry, existing: existing,
      period: period, phase: phase, cycleId: token, formData: clean,
      settings: settings, h1Submission: h1, nowIso: now,
      initialStage: initialStageForEntry_(entry,
        parseRosterValues_(readTabValues_(ss, TAB_NAMES.ROSTER))),
      newId: function () {
        return 'SUB-' + period + '-' + phase + '-' + Utilities.getUuid().slice(0, 8);
      }
    });
    var row = recordToRow_(values[0], record);
    if (existing && existing._row) {
      sheet.getRange(existing._row, 1, 1, row.length).setValues([row]);
    } else {
      sheet.appendRow(row);
    }
    return { ok: true, submissionId: record[SUBMISSION_COLUMNS.SUBMISSION_ID],
      period: period, phase: phase, status: record[SUBMISSION_COLUMNS.STATUS] };
  } finally {
    lock.releaseLock();
  }
}

function getAllPhaseSubmissions(period) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 조회할 수 있습니다.');
  }
  var ss = openHrSpreadsheet_();
  var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
  if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
  var values = sheet.getDataRange().getValues();
  requirePhaseSubmissionColumns_(values[0] || []);
  var records = parseSubmissionValues_(values);
  var cycleRecords = readEvaluationCycles_(ss);
  var settingsRecords = parseEvaluationSettingsValues_(
    getSettingsSheet_(ss).getDataRange().getValues(), true);
  var globallyOpen = singleOpenCycleFromRecords_(cycleRecords, null);
  var availablePeriods = collectPhasePeriods_(records, cycleRecords,
    settingsRecords, '', period);
  var per = choosePhasePeriod_(period, globallyOpen, availablePeriods);
  if (availablePeriods.indexOf(per) === -1) {
    availablePeriods.push(per);
    availablePeriods.sort(function (a, b) { return Number(b) - Number(a); });
  }
  assertUniquePhaseSubmissionKeys_(records, per);
  var openCycle = globallyOpen && globallyOpen.period === per ? globallyOpen : null;
  if (openCycle) { openCycle = assertOpenEvaluationCycleLifecycle_(ss, openCycle); }
  var fullRoster = parseRosterValues_(readTabValues_(ss, TAB_NAMES.ROSTER));
  // 감사 is not an evaluation target: not listed, not counted.
  var roster = filterEvaluationTargets_(fullRoster);
  var h1Cycle = findEvaluationCycle_(cycleRecords, per, EVALUATION_CYCLES.PHASES.H1);
  var h2Cycle = findEvaluationCycle_(cycleRecords, per, EVALUATION_CYCLES.PHASES.H2);
  var periodCycle = h2Cycle || h1Cycle;
  var fallbackSettings = openCycle
    ? resolveSettingsForCycleFromRecords_(openCycle, settingsRecords)
    : (periodCycle ? resolveSettingsForCycleFromRecords_(periodCycle, settingsRecords)
      : getActiveFinalEvaluationSettings_(ss, per));
  var rows = roster.map(function (employee) {
    var h1 = findPhaseSubmission_(records, employee.email, per, EVALUATION_CYCLES.PHASES.H1);
    var h2 = findPhaseSubmission_(records, employee.email, per, EVALUATION_CYCLES.PHASES.H2);
    if (h1) { assertPhaseSubmissionCycleBinding_(ss, h1, cycleRecords, settingsRecords); }
    if (h2) {
      assertPhaseSubmissionCycleBinding_(ss, h2, cycleRecords, settingsRecords);
      assertH2LinkedToH1_(h1, h2);
    }
    var settings = h2 ? settingsFromSubmissionSnapshot_(h2)
      : (h1 ? settingsFromSubmissionSnapshot_(h1) : fallbackSettings);
    return {
      email: employee.email, employeeNumber: employee.employeeNumber,
      name: employee.name, team: employee.team, rank: employee.rank,
      h1: adminPhaseSubmissionView_(h1), h2: adminPhaseSubmissionView_(h2),
      calculationSettings: settings ? displaySafeSettings_(settings) : null,
      approverChain: resolveApproverChainFromEntry_(employee, fullRoster),
      chainIssues: approverChainIssues_(employee, fullRoster)
    };
  });
  recordAccess_(ss, entry.email, 'VIEW_ALL_PHASE_SUBMISSIONS', [per]);
  return { period: per, availablePeriods: availablePeriods,
    approvalChain: WORKFLOW.STAGE_ORDER.slice(),
    excludedAuditors: fullRoster.length - roster.length,
    dashboard: buildPhaseDashboardSummary_(rows),
    cycle: safeEvaluationCycleView_(openCycle),
    cycles: { h1: safeEvaluationCycleView_(h1Cycle), h2: safeEvaluationCycleView_(h2Cycle) },
    rows: rows };
}

function finalizeH1Result(submissionId, h1Score, comment) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 H1 결과를 확정할 수 있습니다.');
  }
  var id = String(submissionId || '').trim();
  if (!id) { throw new Error('대상 submissionId가 지정되지 않았습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
    if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
    var values = sheet.getDataRange().getValues();
    requirePhaseSubmissionColumns_(values[0] || []);
    var records = parseSubmissionValues_(values);
    var sub = findSubmissionById_(records, id);
    var C = SUBMISSION_COLUMNS;
    if (!sub || sub[C.PHASE] !== EVALUATION_CYCLES.PHASES.H1) {
      throw new Error('H1 제출물을 찾을 수 없습니다.');
    }
    assertUniquePhaseSubmissionTarget_(records, sub);
    if (sub[C.STATUS] !== WORKFLOW.STATUS.COMPLETED) {
      throw new Error('결재 완료(COMPLETED)된 H1에만 결과를 확정할 수 있습니다.');
    }
    if (hasStoredValue_(sub[C.RESULT_SENT_AT])) {
      throw new Error('H1 제출물에는 결과 발송 시각이 존재할 수 없습니다.');
    }
    if (hasFirstEvaluation_(sub)) {
      throw new Error('1차/2차 평가자가 산출한 H1 결과는 인사팀이 점수를 입력·수정할 수 없습니다.');
    }
    var binding = assertPhaseSubmissionCycleBinding_(ss, sub);
    var cycles = readEvaluationCycles_(ss);
    var h2Cycle = findEvaluationCycle_(cycles, sub[C.PERIOD], EVALUATION_CYCLES.PHASES.H2);
    var resultMarkers = [C.H1_SCORE, C.CALCULATED_GRADE, C.RESULT_COMMENT,
      C.CALCULATED_AT, C.CALCULATED_BY];
    var hasAnyExistingResult = resultMarkers.some(function (field) {
      return hasStoredValue_(sub[field]);
    });
    var alreadyFinalized = isFinalizedH1Submission_(sub);
    if (hasAnyExistingResult && !alreadyFinalized) {
      throw new Error('기존 H1 결과 필드가 불완전하여 안전하게 확정할 수 없습니다. Sheet를 점검하세요.');
    }
    if (alreadyFinalized &&
        (h2Cycle || hasH2SubmissionForPeriod_(ss, sub[C.PERIOD]))) {
      throw new Error('H2 운영이 한 번이라도 생성되었거나 H2 제출물이 있어 기존 H1 결과를 수정할 수 없습니다.');
    }
    var phaseResult = gradeForPhaseScore_(h1Score, binding.settings, '상반기 점수');
    var now = new Date().toISOString();
    sub[C.H1_SCORE] = phaseResult.score;
    sub[C.CALCULATED_GRADE] = phaseResult.grade;
    sub[C.RESULT_COMMENT] = comment === null || comment === undefined ? '' : String(comment);
    sub[C.CALCULATED_AT] = now;
    sub[C.CALCULATED_BY] = entry.email;
    sub[C.RESULT_RATING] = '';
    sub[C.UPDATED_AT] = now;
    sheet.getRange(sub._row, 1, 1, values[0].length).setValues([
      recordToRow_(values[0], sub)
    ]);
    return { ok: true, submissionId: id, h1Score: phaseResult.score,
      grade: phaseResult.grade, calculatedAt: now, calculatedBy: entry.email };
  } finally {
    lock.releaseLock();
  }
}

function calculateAndSetAnnualResult(h2SubmissionId, h2Score, comment) {
  var entry = requireCurrentUser_();
  if (!authorizeHrAdmin(entry)) {
    throw new Error('권한이 없습니다. 인사팀 관리자만 연간 결과를 계산할 수 있습니다.');
  }
  var id = String(h2SubmissionId || '').trim();
  if (!id) { throw new Error('대상 H2 submissionId가 지정되지 않았습니다.'); }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var ss = openHrSpreadsheet_();
    var sheet = ss.getSheetByName(TAB_NAMES.SUBMISSIONS);
    if (!sheet) { throw new Error('Missing required tab "' + TAB_NAMES.SUBMISSIONS + '".'); }
    var values = sheet.getDataRange().getValues();
    requirePhaseSubmissionColumns_(values[0] || []);
    var records = parseSubmissionValues_(values);
    var h2 = findSubmissionById_(records, id);
    var C = SUBMISSION_COLUMNS;
    if (!h2 || h2[C.PHASE] !== EVALUATION_CYCLES.PHASES.H2) {
      throw new Error('H2 제출물을 찾을 수 없습니다.');
    }
    assertUniquePhaseSubmissionTarget_(records, h2);
    if (h2[C.STATUS] !== WORKFLOW.STATUS.COMPLETED) {
      throw new Error('결재 완료(COMPLETED)된 H2에만 연간 결과를 계산할 수 있습니다.');
    }
    if (hasStoredValue_(h2[C.RESULT_SENT_AT])) {
      throw new Error('이미 발송된 연간 결과는 수정할 수 없습니다.');
    }
    if (hasFirstEvaluation_(h2)) {
      throw new Error('1차/2차 평가가 기록된 H2는 점수를 입력할 수 없습니다. 연간 결과 확정 기능을 사용하세요.');
    }
    var h2Binding = assertPhaseSubmissionCycleBinding_(ss, h2);
    var h1 = findPhaseSubmission_(records, h2[C.EMPLOYEE_EMAIL], h2[C.PERIOD],
      EVALUATION_CYCLES.PHASES.H1);
    requireFinalizedH1Submission_(h1);
    var h1Binding = assertPhaseSubmissionCycleBinding_(ss, h1);
    assertH2LinkedToH1_(h1, h2);
    if (String(h1Binding.settings.settingsHash).toLowerCase() !==
        String(h2Binding.settings.settingsHash).toLowerCase()) {
      throw new Error('H1/H2 운영 설정이 일치하지 않습니다.');
    }
    var competency = calculateCompetencyWithSettings_(h2, h2Binding.settings);
    var trustedH1 = rawComponentScore_(h1[C.H1_SCORE], '확정 H1 점수');
    var trustedH2 = rawComponentScore_(h2Score, '하반기 점수');
    var result = calculateFinalResult_(trustedH1, trustedH2, competency.score, h2Binding.settings);
    var now = new Date().toISOString();
    h2[C.H1_SCORE] = trustedH1;
    h2[C.H2_SCORE] = trustedH2;
    h2[C.H1_RESULT_GRADE_SNAPSHOT] = h1[C.CALCULATED_GRADE];
    h2[C.H1_RESULT_COMMENT_SNAPSHOT] = h1[C.RESULT_COMMENT];
    h2[C.COMPETENCY_AVERAGE_LEVEL] = competency.averageLevel;
    h2[C.COMPETENCY_SCORE] = competency.score;
    h2[C.H1_WEIGHTED_SCORE] = result.contributions.h1;
    h2[C.H2_WEIGHTED_SCORE] = result.contributions.h2;
    h2[C.COMPETENCY_WEIGHTED_SCORE] = result.contributions.competency;
    h2[C.FINAL_SCORE] = result.finalScore;
    h2[C.CALCULATED_GRADE] = result.grade;
    h2[C.CALCULATED_AT] = now;
    h2[C.CALCULATED_BY] = entry.email;
    h2[C.RESULT_RATING] = result.grade;
    h2[C.RESULT_COMMENT] = comment === null || comment === undefined ? '' : String(comment);
    h2[C.UPDATED_AT] = now;
    sheet.getRange(h2._row, 1, 1, values[0].length).setValues([
      recordToRow_(values[0], h2)
    ]);
    return { ok: true, submissionId: id, trustedH1Score: trustedH1,
      h2Score: trustedH2, competencyScore: competency.score,
      contributions: result.contributions, finalScore: result.finalScore,
      grade: result.grade, calculatedAt: now, calculatedBy: entry.email };
  } finally {
    lock.releaseLock();
  }
}
